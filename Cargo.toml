# A Cargo workspace (docs/ARCHITECTURE.md, "Crates"): Chimera (chimera/),
# Source's and LithTech's loaders (source/, lithtech/), the games as
# libraries (games/), the apps (apps/), the tools of each layer and the repository's checks (checks/:
# the architecture tests and the affected-test selection). Each crate
# keeps its own tests (docs/OBSERVABILITY.md, section 1). Commands run at the repository root act on every
# default member: `cargo test` tests them all, `cargo test -p
# source_formats` one crate alone, `cargo run` the game (`default-run` of
# apps/cs_source).
[workspace]
members = [
    ".",
    "chimera/core",
    "chimera/dev",
    "chimera/workspace-hack",
    "chimera/world",
    "chimera/present",
    "chimera/sim",
    "chimera/client",
    "chimera/net",
    "chimera/tools",
    "chimera/vfs",
    "chimera/assets",
    "source/formats",
    "source/logic",
    "source/engine",
    "source/gameui",
    "source/tools",
    "lithtech/formats",
    "games/cs_source",
    "games/cs_source/tools",
    "games/combat_arms",
    "games/originals",
    "games/hl2dm",
    "apps/cs_source",
    "apps/cs_source_server",
    "apps/combat_arms",
    "apps/combat_arms_server",
    "apps/hl2dm",
    "apps/hl2dm_server",
    "apps/mashup_demo",
    "apps/party_kit",
    "apps/lucker_party",
    "apps/lucker_party_server",
    "apps/ultimate_gun_game",
    "apps/ultimate_gun_game_server",
    "checks",
]
default-members = [
    ".",
    "chimera/core",
    "chimera/dev",
    "chimera/workspace-hack",
    "chimera/world",
    "chimera/present",
    "chimera/sim",
    "chimera/client",
    "chimera/net",
    "chimera/tools",
    "chimera/vfs",
    "chimera/assets",
    "source/formats",
    "source/logic",
    "source/engine",
    "source/gameui",
    "source/tools",
    "lithtech/formats",
    "games/cs_source",
    "games/cs_source/tools",
    "games/combat_arms",
    "games/originals",
    "games/hl2dm",
    "apps/cs_source",
    "apps/cs_source_server",
    "apps/combat_arms",
    "apps/combat_arms_server",
    "apps/hl2dm",
    "apps/hl2dm_server",
    "apps/mashup_demo",
    "apps/party_kit",
    "apps/lucker_party",
    "apps/lucker_party_server",
    "apps/ultimate_gun_game",
    "apps/ultimate_gun_game_server",
    "checks",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

# Dependencies more than one member uses (or may): one version for all.
[workspace.dependencies]
chimera_core = { path = "chimera/core" }
chimera_dev = { path = "chimera/dev" }
# Third-party crates' features unified for every build (`cargo hakari`,
# .config/hakari.toml; chimera/workspace-hack/Cargo.toml).
workspace-hack = { path = "chimera/workspace-hack" }
chimera_world = { path = "chimera/world" }
chimera_present = { path = "chimera/present" }
chimera_sim = { path = "chimera/sim" }
chimera_client = { path = "chimera/client" }
chimera_net = { path = "chimera/net" }
chimera_vfs = { path = "chimera/vfs" }
# Game files as content-addressed records: the store, manifests, the
# `CachedFiles` mount layer, the vfs access log (docs/plans/active/asset-service.md).
chimera_assets = { path = "chimera/assets" }
source_formats = { path = "source/formats" }
source_logic = { path = "source/logic" }
# Source engine behaviour every Source game shares, on Chimera (the
# search path first; docs/plans/active/hl2dm.md, section 3).
source_engine = { path = "source/engine" }
# Source's GameUI drawn: the main and Esc menus and their dialogs, for a
# Source game's front end (docs/plans/active/hl2dm.md, lift S7).
source_gameui = { path = "source/gameui" }
# LithTech's formats as plain data (Combat Arms' `.rez` archives).
lithtech_formats = { path = "lithtech/formats" }
cs_source = { path = "games/cs_source" }
# Combat Arms as a game crate (games/combat_arms): its skeleton, filled
# from specs/combat_arms/ (docs/plans/active/combat-arms.md).
combat_arms = { path = "games/combat_arms" }
# Half-Life 2: Deathmatch as a game crate (games/hl2dm): its skeleton
# (docs/plans/active/hl2dm.md).
hl2dm = { path = "games/hl2dm" }
# Lucker Party's original minigames (games/originals): their definitions
# (minigames/) and rules hooks, on Chimera only.
originals = { path = "games/originals" }
# The party kit (apps/party_kit): what Lucker Party and the Ultimate Gun Game
# share; without its default `present` here so the dedicated servers can
# leave the presentation out.
party_kit = { path = "apps/party_kit", default-features = false }
ultimate_gun_game = { path = "apps/ultimate_gun_game", default-features = false }
# The layers' tools (docs/ARCHITECTURE.md, "Crates"): Chimera's (the
# perf gate, image comparison) and Source's (RCON) libraries, for the
# tools above them.
chimera_tools = { path = "chimera/tools" }
source_tools = { path = "source/tools" }
# The CS:S app's glue; without its default `present` here so the dedicated
# server can leave the presentation out (members that want it turn on
# `present`).
cs_source_app = { path = "apps/cs_source", default-features = false }
# Avian's default features minus the three that pull Bevy's render crates
# (`debug-plugin`, `bevy_picking`, `bevy_scene`): `chimera_present` and
# `chimera_client` turn them back on for the clients (the dedicated servers
# don't build them).
avian3d = { version = "0.8", default-features = false, features = [
    "3d", "parry-f32", "xpbd_joints", "parallel", "collider-from-mesh",
] }
# serialize: predicted components (Transform among them) travel as serde
# (`core::PredictedAppExt::predicted_net`); `dev` got it through
# bevy_remote, so builds without `dev` (playtest, release) failed.
bevy = { version = "0.20.0", default-features = false, features = [
    "serialize", "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_state", "reflect_auto_register", "bevy_color", "bevy_image", "bevy_mesh",
    "bevy_camera", "bevy_light", "bevy_window",
] }
# The server's state of a client's own player, compared with its prediction
# byte for byte (core::PredictedComponents::encode); replicon's format.
# The texture types (`Extent3d`, `TextureFormat`) of the images the loaders
# build; Bevy re-exports them only from `bevy_render`. The version
# bevy_image uses.
wgpu-types = { version = "30", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
# Per-thread hardware counters (instructions, cycles, cache and branch
# misses) for `metrics`; Linux only, elsewhere the metrics say
# "unavailable".
perf-event2 = "0.7.4"
# Per-thread CPU time (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`).
libc = "0.2"
# Networking (docs/plans/active/multiplayer.md): replication over renet's
# netcode UDP transport.
bevy_replicon = { version = "0.45.2", default-features = false, features = ["client", "server"] }
# Its release for Bevy 0.20 isn't out (the last, 0.20.0, is on Bevy 0.19):
# the upstream commit that moved it to Bevy 0.20 and replicon 0.45, which
# takes bevy_renet from its authors' `bevy-0.20` branch (Cargo.lock pins
# that too). Back to a crates.io version once one is published
# (docs/tech-debt.md).
bevy_replicon_renet = { git = "https://github.com/simgine/bevy_replicon_renet", rev = "0a8dd5b36548bf3b5b8b9403613ecd2bc0b93522" }
# The one bevy_replicon_renet's bevy_renet uses: from the same branch
# (above), or the two crates' types differ.
renetcode = { git = "https://github.com/simgine/renet", branch = "bevy-0.20" }
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# Bevy's math types (`bevy::math::Vec3` is `glam::Vec3`): the version
# bevy_math 0.20 uses, so a format crate's vectors are the game's.
glam = "0.33"
# LZMA-compressed BSP lumps and pakfile entries (bspzip -repack; vbsp
# already depends on it).
lzma-rs = "0.3"
# The user's folders (mount::install's settings, captures).
dirs = "7.0.0"
# Checksums and keys of the converted-map cache (chimera_world `map::cache`).
blake3 = "1.8"
# Plain arrays as bytes in the converted-map cache (chimera_world `map::pod_serde`).
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
toml = "1.1.6"
# Where Steam is (`HKCU\Software\Valve\Steam` `SteamPath`) for finding the
# CS:S install (chimera_core's mount::install); already in the tree
# through winit.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
# Source's maps, models and materials (`cs_source`'s loaders; `dump`,
# `refcmp`), compressed downloads and the map file's hash.
vbsp = "0.9"
vmdl = "0.2"
vmt-parser = "0.2"
vtf = "0.4"
bzip2 = "0.6.1"
sha2 = "0.10"
# Voice chat (chimera_client's `client::voice`, docs/plans/active/voice-chat.md):
# the microphone and the talkers' output (the cpal rodio, Bevy's audio,
# already uses), and Opus in pure Rust (encoder and decoder; no C
# compiler or system library on Linux or Windows).
cpal = "0.17"
mousiki = "0.2.1"
# MP3 sounds packed in community maps (music, minigame sounds).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
# HUD glyphs rasterized and placed as Source's HUD does (chimera_client's
# `hud_text`).
ab_glyph = "0.2.32"
# The client shell's debug UI and inspector (chimera_client); egui drawn
# over Bevy's UI (the debug UI over the HUD).
bevy-inspector-egui = "0.38"
bevy_egui = { version = "0.43.1", default-features = false, features = ["bevy_ui"] }
# Copy and paste (the console, the front end's text fields).
arboard = "3.6"
serde_json = "1.0.151"
# The window icon (`winit::window::Icon`; the winit bevy_winit uses).
winit = { version = "0.30", default-features = false }

[package]
name = "mashup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `mashup`, the repository root's package, is now a thin shim: the CS:S
# app's glue (`cs_source_app`, apps/cs_source) re-exported at the old
# `mashup::` paths (src/lib.rs), for `dump` (an install inspector for
# several games, tested in tests/it/; Combat Arms' archives through
# `lithtech_formats`) and `chimera_pack` (installs into the asset store). The game binary is the app's,
# the dedicated server apps/cs_source_server's, the tools their layers'
# (docs/ARCHITECTURE.md, "Crates").
[lib]
doctest = false

[dependencies]
cs_source_app.workspace = true
cs_source.workspace = true
# `chimera_pack`: the games whose installs it packs (their own mounts), the
# store it writes.
combat_arms.workspace = true
hl2dm.workspace = true
source_engine.workspace = true
chimera_core.workspace = true
chimera_assets.workspace = true
source_formats.workspace = true
lithtech_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
bevy_replicon_renet.workspace = true
postcard.workspace = true
bzip2.workspace = true
dirs.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true
workspace-hack.workspace = true

# Binaries without unit tests: `cargo test` skips building a test harness
# of each (one more link apiece). A binary that gets tests loses its
# `test = false`; checks/tests/it/architecture.rs checks this in every member.
[[bin]]
name = "dump"
test = false

# The asset store's packer (docs/plans/active/asset-service.md): a host
# tool, `--features tools`; never in releases.
[[bin]]
name = "chimera_pack"
test = false
required-features = ["tools"]

# The map sweep (docs/OBSERVABILITY.md, "Sweeping every cached map"): a
# host tool over CS:S's and HL2:DM's maps, `--features tools`.
[[bin]]
name = "mapsweep"
test = false
required-features = ["tools"]

# `dump`'s test (tests/it/).
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["present"]

[features]
default = ["present"]

# The app with its presentation, client shell and CS:S's front end
# (`cs_source_app`'s `present`): what the integration tests drive.
present = ["cs_source_app/present"]

# Host tools (`chimera_pack`), not in releases.
tools = []

# Faster iteration: link Bevy as a dynamic library (the app's `dev` and
# every crate's under it). Never enable for release builds.
dev = ["cs_source_app/dev"]

# CPU profile: every system and render step as a span in a Chrome trace
# (docs/performance.md). Slower; only for measuring.
profile = ["cs_source_app/profile"]
# A short window of spans (`trace_capture`), the Tracy profiler live:
# docs/performance.md, "See a frame yourself".
trace = ["cs_source_app/trace"]
tracy = ["cs_source_app/tracy"]

# Our own code: a little optimization so the game is playable in debug.
# Match tests' line tables so switching between run/build and test reuses
# dependency artifacts. Use `--profile devfull` to inspect local variables.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Dependencies (Bevy, parsers): fully optimized, compiled once and cached.
[profile.dev.package."*"]
opt-level = 3

# The `.rez` ciphers' block functions are inlined into lithtech_formats'
# CBC loop, so they build at its level: at 1, V1 (Twofish) decrypts at
# about 2 MB/s and stalls loading Combat Arms' keyed archives.
[profile.dev.package.lithtech_formats]
opt-level = 3

# Build scripts, proc macros and their dependencies: no debuginfo, always.
# Left to cargo, a build-time dependency keeps debuginfo only when a
# runtime dependency shares it, so `cargo test -p <crate>` (fewer runtime
# dependencies) built every proc macro again, and Bevy after them, for
# all the workspace-hack's unified features (docs/performance.md,
# "Workspace-hack").
[profile.dev.build-override]
debug = false

# Tests (`cargo test`, nextest): line tables only, for every crate. Panics
# and backtraces keep their files and lines; a debugger loses variables.
# Measured (docs/performance.md, "Test cycle"): rebuilding every test
# binary after a change to chimera_core 197-237 s instead of 383-427 s, a
# full test build's artifacts a third the size (23 GB instead of ~68), a
# test binary 478 MB instead of ~1 GB. Dev uses the same setting so
# run/build and test can share dependencies with matching features.
[profile.test]
debug = "line-tables-only"

# Opt-in full debugger information, in target/devfull rather than disturbing
# the warm default dev/test artifacts. Build-time units still omit debuginfo.
[profile.devfull]
inherits = "dev"
debug = 2

[profile.release]
codegen-units = 1
lto = "thin"

# Fast-to-rebuild optimized build for playtesting (e.g. on the Windows PC):
# release speed without LTO's long link.
[profile.playtest]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# The playtest build with line tables, for CPU sampling (`perf record`,
# tools/perf-profile.sh; docs/performance.md, "Measuring"): the same code,
# function and line names in the profile.
[profile.profiling]
inherits = "playtest"
debug = "line-tables-only"
