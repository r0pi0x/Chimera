# Optional. Copy to chimera.local.toml (gitignored) and edit. Machine-specific
# settings that must never be committed: install paths, Combat Arms keys.
# (An old mashup.local.toml is still read when there is no chimera.local.toml.)
#
# The game finds the CS:S install by itself: the path saved by its first-run
# dialog or `chimera_install <folder>` (in the user's settings.toml, beside
# the cfg folder), else Steam's library folders. A path here always wins
# over both, and `CHIMERA_<GAME>_ROOT` (`CHIMERA_HL2DM_ROOT`,
# `CHIMERA_CS_SOURCE_ROOT`) over all of them for one run. The startup log
# says which install is used and how it was found.

# [games.cs_source]
# Folder containing cstrike/ and hl2/. Steam app 240.
# path = "~/games/counter-strike-source"

# Optional: CS:S dedicated server (Steam app 232330, SteamCMD anonymous)
# with Metamod:Source, SourceMod and the tools/css_probe plugin, for the
# movecmp tool. Keep it separate from the game install.
# [games.cs_source_server]
# path = "~/games/css-ds"

# [games.hl2dm]
# Folder containing hl2mp/, hl2/ and platform/. Steam app 320; a SteamCMD
# install outside Steam's libraries needs this or CHIMERA_HL2DM_ROOT.
# path = "~/games/hl2dm"

# [games.tf2]
# Folder containing tf/, hl2/ and platform/: the retail client, Steam app
# 440 (textures, sounds), found in Steam's libraries without this line; or
# CHIMERA_TF2_ROOT for one run. A dedicated server's folder (SteamCMD app
# 232250) mounts too, but lacks the texture and sound archives: its maps
# load and play with stand-in textures and no sound
# (docs/assets-for-developers.md).
# path = "~/games/tf2"

# [games.dods]
# Folder containing dod/, hl2/ and platform/: the retail client, Steam app
# 300, found in Steam's libraries without this line; or CHIMERA_DODS_ROOT
# for one run. The dedicated server's folder (SteamCMD app 232290,
# anonymous) has everything the party reads (maps, models, textures,
# sounds) and needs this line or the variable.
# path = "~/games/dods_ds"
#
# TF2's encrypted weapon and class scripts (scripts/*.ctx): the
# 8-character key you supply yourself; never commit it. The environment's
# CHIMERA_TF2_CTX_KEY wins over this. (A section may hold only the key: the
# install is then found as without `path`.)
# [games.tf2.keys.ctx]
# key = ""

[games.combat_arms]
# Folder containing the game (only with the local Combat Arms loader).
path = "~/games/combat-arms-classic"

# Optional: the asset store (docs/plans/active/asset-service.md; records
# packed by `chimera_pack`, checked with `chimera_assets`). Default: the
# user's cache (~/.cache/chimera/assets, %LOCALAPPDATA%\chimera\assets).
# Tests and tools layer it under each install at the install's own build
# (the install's files first; the store only adds what the install
# lacks); the game apps and servers read a game the asset service serves
# from the store alone whenever a service is set, installed or not
# (docs/assets-for-developers.md, "Installs and the service"). The
# environment wins over this section:
# CHIMERA_ASSET_STORE, CHIMERA_ASSET_USE_INSTALL=0/1.
# [assets]
# store = "~/.cache/chimera/assets"
# true: the installs first in the apps too (the store only adds what an
# install lacks; the apps' "Use my installed games"). false: games the
# store has a manifest for load from it alone everywhere, tests included
# (no install looked for, no keys needed). Unset: as above.
# use_install = true
# The build to mount per game when served alone (default: the newest in
# the store); under an install only the install's build is mounted.
# builds = { cs_source = "25338318" }
# The asset service (docs/plans/active/asset-service.md): files the store
# lacks are fetched from it on demand (no install needed). A hub account
# needs nothing here (`chimera_assets hub <invite link>` signs you in; its
# hub's asset service is then used). An asset service with no hub: its
# admin gives you a token (`chimera_pack token add <name>`);
# `chimera_assets login <url> <token>` checks it and prints these lines.
# Over the environment: CHIMERA_ASSET_URL, CHIMERA_ASSET_TOKEN.
# url = "https://<the server's name>"
# token = "<the token>"
# The server's public key (pinned; without it, the key the server names
# over HTTPS is trusted).
# key = "..."

# The hub (docs/plans/active/hub.md, S2): list the servers this machine
# hosts on its account's hub (the account made with `+chimera:hub <invite
# link>`; it needs the `list` right, which a `host` invite gives). The
# same as `+sv_hub 1` (`chimera:hub`) on a server's command line; `+sv_hub
# 0` there overrides it.
# [hub]
# list = true
# List with this account file, not the user's (a host account's):
# account = "/path/to/account.toml"
