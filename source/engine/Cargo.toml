[package]
name = "source_engine"
version = "0.1.0"
description = "Source engine behaviour every Source game shares, on Chimera: the search path first"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates, Source's formats and its map logic; never the
# presentation (`chimera_present`), `mashup`, a game or an app
# (checks/tests/it/architecture.rs checks it). What it draws will sit
# behind a `ui` feature, as a game's front end does. Same versions and
# features as the game's (workspace dependencies), so `cargo test -p
# source_engine` reuses the game's builds.
[dependencies]
chimera_core.workspace = true
# The map's types (`map::MapData` and its parts) the content converts into.
chimera_world.workspace = true
# The weapon frame's view-model driver and parts the view-model rules and
# motion work on (`view_anim`, `view_motion`: lift S8).
chimera_sim.workspace = true
source_formats.workspace = true
# Source's content readers, as CS:S's were (the lifts S2-S4): BSP, MDL,
# VMT and VTF, with the image formats VTF and the HUD's pictures need.
avian3d.workspace = true
bevy.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
sha2.workspace = true
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true
# Others' bodies posed as the server's tick pose (`anim_net`): its
# snapshots by server tick and a network part.
chimera_net.workspace = true
bevy_replicon.workspace = true
# Maps sent compressed by servers (`maps::import_map_into`).
bzip2.workspace = true
workspace-hack.workspace = true

[features]
# Bevy as a dynamic library, as the games' `dev` (which turns this on):
# `cargo test -p source_engine --features dev` shares their Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "source_formats/dev"]

[dev-dependencies]
# The size of a network value as sent (`anim_net`'s tests).
postcard.workspace = true
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it (docs/performance.md, "Iteration speed").
chimera_world = { workspace = true, features = ["render"] }
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it:
# without this line a build that leaves the client shell out builds another
# bevy_winit, and with it another Bevy and every crate of ours.
bevy_winit.workspace = true
