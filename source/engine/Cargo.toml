[package]
name = "source_engine"
version = "0.1.0"
description = "Source engine behaviour every Source game shares, on Chimera: the search path first"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates, Source's formats and its map logic; never the
# presentation (`chimera_present`), `mashup`, a game or an app
# (checks/tests/it/architecture.rs checks it). What it draws will sit
# behind a `ui` feature, as a game's front end does. Same versions and
# features as the game's (workspace dependencies), so `cargo test -p
# source_engine` reuses the game's builds.
[dependencies]
chimera_core.workspace = true
# The map's types (`map::MapData` and its parts) the content converts into.
chimera_world.workspace = true
# The weapon frame's view-model driver and parts the view-model rules and
# motion work on (`view_anim`, `view_motion`: lift S8).
chimera_sim.workspace = true
source_formats.workspace = true
# Source's content readers, as CS:S's were (the lifts S2-S4): BSP, MDL,
# VMT and VTF, with the image formats VTF and the HUD's pictures need.
avian3d.workspace = true
bevy.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
sha2.workspace = true
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true
# Maps sent compressed by servers (`maps::import_map_into`).
bzip2.workspace = true
workspace-hack.workspace = true

[features]
# Bevy as a dynamic library, as the games' `dev` (which turns this on):
# `cargo test -p source_engine --features dev` shares their Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev"]
