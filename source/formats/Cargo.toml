[package]
name = "source_formats"
version = "0.1.0"
description = "Source engine file formats as plain data: no Bevy, no game code"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# Pure data: what a format needs to be read and nothing else. No Bevy, no
# avian, no `mashup` (checks/tests/it/architecture.rs checks it).
[dependencies]
chimera_vfs.workspace = true
# `keyvalues` and `wav`, re-exported at their old paths (lib.rs).
chimera_formats.workspace = true
glam.workspace = true
lzma-rs.workspace = true

[features]
# Nothing: lets `--features dev` name this package alongside the others
# (cargo test -p ... -p <crate> --features dev; .githooks/pre-commit).
dev = ["chimera_vfs/dev", "chimera_formats/dev"]
