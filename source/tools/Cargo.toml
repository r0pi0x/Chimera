[package]
name = "source_tools"
version = "0.1.0"
description = "Source's tools: RCON, the demo inspector, the entity test map writer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# Source's formats and plain crates; never Bevy, a game, an app or
# `mashup` (checks/tests/it/architecture.rs checks it): a tool that needs a
# game's loaders lives in that game's tools.
[dependencies]
source_formats.workspace = true

# Source demo (.dem) inspector: game events, user messages, sounds,
# entity props per tick (docs/OBSERVABILITY.md, "CS:S demos").
[[bin]]
name = "demodump"
test = false
required-features = ["tools"]

# Writes the entity test map (tools/testmap/); has unit tests, so `cargo
# test` builds it.
[[bin]]
name = "testmap"

[features]
# Nothing: lets `--features dev` name this package alongside the others
# (cargo test -p ... -p <crate> --features dev; .githooks/pre-commit).
dev = ["source_formats/dev"]
# The debugging binaries (docs/OBSERVABILITY.md).
tools = []
