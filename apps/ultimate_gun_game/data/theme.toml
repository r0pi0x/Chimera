# The Ultimate Gun Game's look, "Signal" (docs/plans/active/ugg-ui.md, 2.3
# and 3): palette Cobalt, the UGG faces (fonts/), one 12° slant, the motion
# and layout numbers of the Look Book IV prototype. Read by
# `chimera_ui::Theme::from_toml` over the shell's defaults
# (chimera/ui/data/shell.toml). Sizes are in cq (1 % of a 16:9 frame's
# width: 12.8 px at 720 lines), times in seconds, colours display-space.

name = "signal"

[palette]            # Cobalt; every other colour derives from these
ink = "#06080C"
ink_2 = "#0A0D13"
ink_3 = "#111620"
ink_4 = "#1A212D"
fg = "#E8EDF5"
acc = "#3B7BFF"
on_acc = "#04060B"
acc_text = "#6A98FF"
hero = "#2D6BEB"     # the forward action's fill: white on it is 4.76:1
on_hero = "#FFFFFF"
threat = "#FF3B4E"
good = "#9BE3B4"      # network good only
warn = "#FFB547"      # network warnings only

[alpha]
fg_2 = 0.66
fg_3 = 0.42
fg_4 = 0.15
fg_5 = 0.07
acc_2 = 0.16
acc_glow = 0.45
plate = 0.92          # no backdrop blur in Bevy: more opaque than the look book's .80
glow = 0.20

# Each game's own kill icon wherever it has one, ours only where none
# (chimera_ui::icons::choose).
[icons]
prefer_game = true

[shape]
slant_deg = 12.0
min_text_px = 9.0

# Switches: the shell's Signal HUD (race chip and board, kill feed,
# fallback HUD).
[flags.hud]
signal = true

# The UI sound kit (data/ui_sounds.toml, assets/sounds/ui/: the ui bus,
# chimera_client::client::ui_sound).
[flags.sound]
ui = true


# Text roles: the wordmark is Black with ss02 (whose A is the plain A).
# Titles, labels and buttons upper-case their text (`upper`; the faces
# have lower case since v0.5); `text` is the sentence face (descriptions,
# help, dialog bodies, notices, typed text, names) in its own case.
[type.wordmark]
face = "display"
weight = 900
tracking = 0.03
features = ["ss02"]
upper = true

[type.display_black]
face = "display"
weight = 900
tracking = 0.02
upper = true

[type.display_bold]
face = "display"
weight = 700
tracking = 0.02
upper = true

[type.display_regular]
face = "display"
weight = 400
tracking = 0.02
upper = true

# Data and the small tracked labels; cvar names and console lines keep
# their case (drawn without the role's case rule).
[type.mono]
face = "mono"
weight = 400
tracking = 0.06
hinted = true
upper = true

[type.text]
face = "display"
weight = 400
tracking = 0.01
line = 1.3

[motion.ease]
out = "bezier(.16,1,.3,1)"
in = "bezier(.7,0,.84,0)"
io = "bezier(.65,0,.35,1)"
pop = "bezier(.34,1.56,.64,1)"
roll = "back(.9)"

# The logo pass between screens: bands sweep over `total`, the screen
# swaps at `swap` while covered; the mark wipes in and out.
[motion.dur.pass]
total = 1.2
swap = 0.6
mark_in_at = 0.396     # .33 of the pass
mark_in = 0.192        # .16
mark_out_at = 0.84     # .70
mark_out = 0.144       # .12

# Tab: the chip opens into the board (decision 2: fast enough to spam).
[motion.dur.board]
open = 0.12
close = 0.09
content_out = 0.04
board_in_at = 0.03
board_in = 0.07

[motion.dur.feed]
enter = 0.22
life = 5.0
leave = 0.25
close_gap = 0.25

[motion.dur.toast]
wipe = 0.2
roll_at = 0.08
roll = 0.3
gun_at = 0.12
gun = 0.28
next_at = 0.2
next = 0.25
hold_to = 0.92
leave = 0.24

[motion.dur.airstrike]
banner_at = 0.25
banner = 0.3
fold_at = 2.0
fold = 0.28
chips_stack = 0.24
flash_decay = 0.12

[motion.dur.lobby]
ready_pop = 0.32

[motion.dur.matchend]
slab_at = 0.55
slab = 0.9
name_at = 0.9
climb_draw = 0.7
climb_ticks = 0.52
vote = 20.0
vote_hot_from = 17.0
lines_loop = 96.0      # the planes: one spacing per loop

[motion.dur.menu]
bar_at = 0.62
bar = 0.45
items_at = 0.24
item = 0.52
item_gap = 0.055
backdrop_dwell = 16.0
backdrop_swap = 0.52
lockup_at = 0.12       # the lockup wipes in
lockup = 0.6
ult_at = 0.38          # ULTIMATE's letters flicker on, one each ult_gap
ult_gap = 0.045
ult = 0.2
inv_at = 0.9           # the highlight's inverted text
hl_move = 0.3          # the highlight to another entry
acct_at = 0.7          # the account chip, the keys and caption fade in
keys_at = 0.9
fade = 0.5

[layout.pass]
band_acc_w = 1.1
band_acc_x = -2.6
band_ink_w = 140.0
band_ink_x = 0.0
band_acc2_w = 10.0
band_acc2_x = 141.0
band_fg_w = 5.0
band_fg_x = 152.0
from = -175.0
travel = 287.0
mark_w = 13.0
mark_h = 9.33
mark_x = 81.5          # its centre in the ink band, at mid-height: the frame's centre at the swap

[layout.lobby]       # the pre-match lobby (chimera_client lobby_panel) in the shell's window
mode_w = 18.0        # the mode column at the left
map_w = 27.4         # the map card's column at the right
card_h = 13.0        # the map card
big = 3.0            # "3 / 7"
map_big = 2.0
row_h = 2.9
avatar = 2.3         # a row's avatar
status_w = 11.2      # the status column (the progress bar inside)
ping_w = 4.6
name = 0.9
tag = 0.62
ticks_h = 1.4
countdown_ticks = 48.0
countdown_hot = 3.0  # the last seconds lit in the accent

# The chat docked in the lobby (chimera_client signal_chat): in the mode
# column, above the action bar (the shell's window, revision 8).
[layout.chat]
dock_left = 4.4
dock_bottom = 10.4
dock_w = 18.0
dock_h = 11.0

[layout.menu]        # the party menu's first page (party_kit signal_menu): a 100 x 56.25 frame
lockup_x = 2.6
lockup_y = 2.4
lockup = 2.3         # GUN GAME's size; ULTIMATE .62x
mark_h = 3.4         # the mark's height
lockup_w = 34.0      # the wipe's width
items_x = 2.6
items_y = 19.0
items_w = 24.0
item_h = 3.5
item_label = 1.36
item_ix = 0.62
item_ix_w = 1.3
item_gap = 1.1
hl_accent = 0.32     # the highlight's accent bar
tab_text = 0.64
keys_y = 1.8         # from the bottom
keys = 0.62
keys_gap = 1.6
vt_x = 2.1           # the rule up the right edge, from the right
vt = 0.56
tabs_x = 2.6         # the backdrop tabs, from the right
tabs_y = 1.4         # from the bottom
tabs_text = 0.62
tabs_label = 0.56
cap_y = 7.6          # the backdrop's caption, from the bottom
cap = 0.56
calm = 0.30          # the menu column's right edge (0-1 of the width): the ambient is calm left of it

# The shell (chimera_ui::shell): every out-of-match screen's bar, window,
# action bar and key hints (the design rules' revision 5, 11.4).
[layout.shell]
margin = 2.6
bar_y = 1.8          # the bar band, 4.6 tall
bar_h = 4.6
rule_y = 7.2
win_top = 8.4        # the content window, to win_bottom from the bottom
win_bottom = 4.6
keys_y = 1.8         # the key hints, from the bottom
side_w = 31.0        # the side panel
rows_in = 1.8        # rows from the window's left
rows_right = 35.0    # rows end this far from its right
row_h = 2.8
value_w = 14.0       # sliders, fields, dropdowns
act_h = 4.6          # the window's action bar
tile = 3.0           # the bar's square tiles

[layout.chip]
top = 2.2
w = 21.0
h = 3.05
tick_w = 0.66
tick_h = 0.32

[layout.board]
w = 64.0
h = 25.9
row_rise = 0.45

[layout.feed]
w = 26.0
row_h = 1.85
pitch = 2.15
enter_dx = 2.4

[layout.toast]
top = 6.8
h = 3.1

[layout.airstrike]
banner_h = 3.3
banner_top = 15.5
chip_w = 13.4
chip_pitch = 3.05

# The match end's blocks in its 100 x 56.25 frame (chimera_client
# match_end_signal::EndLayout; the chat docks with the same numbers):
# Leave top left, the chat down the left, the standings down the right,
# in the middle the details line, the climb and its stat tiles, and the
# footer (map cards, countdown) along the bottom.
[layout.matchend]
pad = 3.0            # the left and right margins; Leave's top, the standings' top
gap = 1.6            # between the columns
bottom = 3.2         # the frame's bottom margin: the chat's and the footer's end
chat_w = 21.5        # the chat down the left, from chat_top to the bottom
chat_top = 7.4       # under Leave
std_w = 30.0         # the standings down the right, above the footer
foot_gap = 1.4       # the standings end this far above the footer
details_top = 3.3    # the details line, centre
graph_top = 6.4      # the climb's head line; its chart follows
graph_h = 27.5       # the chart's height
stats_gap = 1.2      # the stat tiles under the chart
stats_h = 5.4
foot_top = 46.4      # the vote cards (centre) and the countdown (right)
row_h = 2.4          # the most a standings row gets; they shrink to fit
win_h = 5.8          # the winner's row
thumb_h = 2.0        # the map cards' picture


# The Escape menu over play (party_kit esc_signal; the components page's
# frame 05): a left panel over a gradient shade, so the race chip and the
# kill feed stay readable.
[layout.esc]
panel_x = 4.6
panel_y = 5.6
panel_w = 27.0
lockup = 1.5
item_h = 3.1
label = 1.15
bar_accent = 0.3
foot_y = 3.0
wipe = 0.2           # the selection's slab wiping to its new row, s

# Settings (party_kit settings; the components page's frame 02): one page
# for the menu's Options, the Escape menu's and the Controls page.
[layout.settings]
margin = 4.6
win_top = 9.4
win_bottom = 7.6
help_w = 27.0
row_h = 2.9
bind_h = 2.4
bar_h = 3.4
wipe = 0.26          # a page change's 12° wipe, s
keep_secs = 15.0     # a display-mode change reverts unless kept

# The main menu's Play and Join (party_kit signal_pages): Settings' frame
# with the kit's controls; Join's left column (Direct, Recent) and the LAN
# servers at the right, Play's summary pane.
[layout.pages]
margin = 4.6
win_top = 9.4
win_bottom = 7.6
row_h = 2.9
bar_h = 3.4
join_w = 30.0
summary_w = 27.0
wipe = 0.26          # a page or tab change's 12° wipe, s
