[package]
name = "lucker_party_server"
version = "0.1.0"
description = "Lucker Party's dedicated server: the party's simulation and the network playing a minigame, no window, render or audio"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The app crates this one is built on (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
apps = ["party_kit"]

# A thin binary: the party kit's server (apps/party_kit) on Chimera's
# (`chimera_net::dedicated`), the kit without its default `present`, so
# nothing of chimera_present, the client shell or Combat Arms'
# front end links (checks/tests/it/architecture.rs,
# `server_builds_without_presentation`). In a workspace build features unify:
# the released server is built alone, `cargo build --release -p
# lucker_party_server`.
[dependencies]
party_kit.workspace = true
chimera_net.workspace = true
workspace-hack.workspace = true

[[bin]]
name = "lucker_party_server"
path = "src/main.rs"
test = false

[features]
# Bevy as a dynamic library, as the other crates' `dev`.
dev = ["party_kit/dev", "chimera_net/dev"]
