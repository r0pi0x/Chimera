# The party apps' main menu (party_kit::main_menu) and the entries of the
# Escape menu (party_kit::esc_menu). Ultimate Gun Game starts at it; Lucker
# Party (shelved) still starts in its minigame and shows no Disconnect.
#
# [[entry]]: the main menu's left-hand entries, in order, in CS:S's main
# menu's place (the GameUI look of CS:S's install). `page` opens one of the
# menu's pages (play: shown as Host; join; options: Settings); `command` is a console line. `gap`
# leaves half a row before it; `tag` a chip after the label (the Signal
# menu's NEW); `play = true` puts the menu on its loading screen as its
# command runs (one start a press; the map's load enters the game). Sandbox runs `sandbox <map>`, Ultimate Gun Game's command (as
# `+sandbox` starts it: alone, cheats on), on the range (`chimera:range`,
# code-built, its bodies drawn; change the map here).
#
# [[escape]]: the Escape menu's entries, in order. `action` is one of
# resume, options, host, vote, disconnect, feedback (the report dialog),
# quit, developer (the UI kit's gallery), sandbox_gun and sandbox_bench (the sandbox's Change gun and bench);
# `when` gates it: always, host (not a network client), main_menu (the app
# has this main menu), sandbox and not_sandbox (a sandbox plays or not), developer (Options' Developer mode is on). The pre-match lobby has no Escape menu
# under a themed lobby: its own header buttons (Settings, Report a bug,
# Leave) instead.
#
# [[play]]: the Play page's Server tab, each row a cvar set when the game
# starts (its value shown from the cvar when the page opens, `default` if
# given; `{title}` in it is the app's name). `range` = [min, max, step],
# `choices` = [[value, label], ...], `text` = the entry's byte limit (`masked`: a password). `map` = true is
# the map row: "Rotation" (the minigame's pool, its first map) or one map
# of it. The Game tab is data/host_settings.toml's next-match rows.
#
# [background]: the live map behind the menu and its slow camera flight,
# an orbit around the middle of the map's spawn points: `maps` the maps
# it may be after the app's minigame's pool (one at hand without a
# download, the next after the last start's; none at hand: the menu's own
# backdrop), `height` metres above the spawns' middle, `radius` metres
# from it, `period` seconds a lap, `pitch` degrees down.

[background]
maps = ["cs_source:de_dust2", "combat_arms:warehouse"]
height = 13.0
radius = 34.0
period = 150.0
pitch = 12.0

[[entry]]
label = "Host"
page = "play"

[[entry]]
label = "Join"
page = "join"

[[entry]]
label = "Sandbox"
command = "sandbox range"
tag = "New"
play = true

[[entry]]
label = "Settings"
page = "options"

[[entry]]
label = "Quit"
command = "quit"

[[escape]]
label = "Resume"
action = "resume"

[[escape]]
label = "Change gun"
action = "sandbox_gun"
when = "sandbox"

[[escape]]
label = "Bench"
action = "sandbox_bench"
when = "sandbox"

[[escape]]
label = "Settings"
action = "options"

[[escape]]
label = "Host settings"
action = "host"
when = "host"

[[escape]]
label = "Vote to skip the map"
action = "vote"
when = "not_sandbox"

[[escape]]
label = "Disconnect"
action = "disconnect"
when = "main_menu"

[[escape]]
label = "Developer"
action = "developer"
when = "developer"

[[escape]]
label = "Report a bug"
action = "feedback"

[[escape]]
label = "Quit"
action = "quit"

[[play]]
label = "Server name"
cvar = "hostname"
text = 64
default = "{title}'s game"

[[play]]
label = "Password"
cvar = "sv_password"
text = 32
masked = true

[[play]]
label = "Port"
cvar = "hostport"
text = 5

[[play]]
label = "Maps"
map = true

[[play]]
label = "Bots"
cvar = "MaxPlayer"
range = [0, 15, 1]
default = "3"

[[play]]
label = "Max. players"
cvar = "maxplayers"
range = [2, 16, 1]
default = "8"

# The pre-match lobby (chimera_net::prematch) of each match the host
# starts: everyone waits on the map until loaded (loaded is ready; nobody
# readies up); the first match starts when the host presses Start
# (mp_lobby_host_start), later ones once everyone has the map. After each
# match everyone is back in the lobby while the next map loads.
[[play]]
label = "Pre-match lobby"
cvar = "mp_lobby"
choices = [["0", "Off"], ["1", "On"]]
default = "1"

[[play]]
label = "Lobby waits for (players)"
cvar = "mp_lobby_min_players"
range = [1, 16, 1]
default = "2"

# One choice: shown as its words (no control), set at the start.
[[play]]
label = "Start when"
cvar = "mp_lobby_host_start"
choices = [["1", "Host presses Start"]]
default = "1"

# The lobby after each match (the next map loading under it) starts once
# everyone has loaded, or after this long since the match was ready
# (mp_lobby_max_wait, s): the stragglers join when ready.
[[play]]
label = "Lobby waits at most (s)"
cvar = "mp_lobby_max_wait"
range = [15, 300, 15]
default = "90"

[[play]]
label = "Open the router's port (UPnP)"
cvar = "net_upnp"
choices = [["0", "Off"], ["1", "On"]]
