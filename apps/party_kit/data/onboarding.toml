[account.help]
username = "Your handle on {hub}: owners, lists and the board's tooltip use it. You may change it once a minute; your last names stay visible so nobody passes as you. A taken name offers free ones."
avatar = "The look others see beside your name, kept on your account. Arrows or a click choose; the hub hears of it a moment later."
hub = "Where this PC is signed in. Everything that needs an account (parties, the server list, downloads) goes through it."
link = "Sign another PC into this same account without an invite: show a code here and type it there, under I already have an account. A code works once, for 10 minutes."
sign_out = "This PC forgets your account: the device is revoked at the hub and its sign-in file deleted. The account itself stays."
intent = "Why you're making this invite, in your words. It stays with the account that redeems it, so an unwanted sign-up can be traced."
recipient = "Who it is meant for. Optional; it labels the invite in your list."
role = "A tester plays and downloads; a host also lists servers and its match results count. Owner invites are made on the hub's command line."
invite_link = "The link carries the hub, its certificate and a one-time code. It is shown once: copy it and send it privately. Valid for 14 days."
open = "An invite not used yet. Revoke it if it went to the wrong place: its code stops working at once."
