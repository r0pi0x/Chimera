[package]
name = "party_kit"
version = "0.1.0"
description = "The party kit: what Lucker Party and the Ultimate Gun Game share, over no game (the minigame runtime composed, the client shell, menus and settings, the dedicated server's launch); the games come in a `Party` from apps/party_roster"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The kit names no game (checks/tests/it/architecture.rs,
# `party_kit_names_no_game`): the games come in a `Party` (and its front end
# in a `client::PartyClient`) from the roster (apps/party_roster), which
# the four party apps depend on, so a game's edit doesn't rebuild the kit.
# Chimera's crates only; never an app. The presentation, the client shell
# and the menus are behind the default feature `present`: the dedicated
# servers build without them. Its composition tests are the roster's.

[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_net.workspace = true
chimera_present = { workspace = true, optional = true }
chimera_client = { workspace = true, optional = true }
chimera_ui = { workspace = true, optional = true }
avian3d.workspace = true
bevy.workspace = true
toml.workspace = true
# The first run's account calls and the recovery key's folder (`onboarding`).
chimera_assets.workspace = true
dirs.workspace = true
workspace-hack.workspace = true

# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
[dev-dependencies]
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

[features]
default = ["present"]

# The presentation (chimera_present), the client shell (chimera_client)
# and the party's menus: everything but the dedicated server.
present = ["dep:chimera_present", "dep:chimera_client", "dep:chimera_ui"]

# Faster iteration: link Bevy as a dynamic library, serve the remote
# protocol. Never for release builds.
dev = [
    "chimera_core/dev",
    "chimera_world/dev",
    "chimera_sim/dev",
    "chimera_net/dev",
    "chimera_assets/dev",
    "chimera_present?/dev",
    "chimera_client?/dev",
    "chimera_ui?/dev",
]

# Profiling (docs/performance.md, "See a frame yourself"): `trace` records
# a short window of spans (`trace_capture`, `CHIMERA_TRACE_SECONDS`),
# `profile` also the whole run into a Chrome trace, `tracy` streams to
# the Tracy profiler. Slower; only for measuring.
trace = ["chimera_core/trace", "chimera_client?/trace"]
profile = ["chimera_core/profile", "chimera_client?/profile"]
tracy = ["chimera_core/tracy", "chimera_client?/tracy"]
