[package]
name = "lucker_party"
version = "0.1.0"
description = "Lucker Party: minigames (data on Chimera's mode runtime) played with both games' parts, CS:S's and Combat Arms' maps and guns"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The app crates this one is built on (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
apps = ["party_kit"]

# A thin binary over the party kit (apps/party_kit), which composes the games.
[dependencies]
chimera_client = { workspace = true, optional = true }
party_kit.workspace = true
workspace-hack.workspace = true

# The game: its window, the presentation, the client shell and Combat
# Arms' front end.
[[bin]]
name = "lucker_party"
path = "src/main.rs"
test = false
required-features = ["present"]

[features]
default = ["present"]
present = ["dep:chimera_client", "party_kit/default"]

# Faster iteration: link Bevy as a dynamic library, serve the remote
# protocol. `cargo run --features dev --bin lucker_party`. Never for
# release builds.
dev = ["party_kit/dev", "chimera_client?/dev"]

# Profiling (docs/performance.md, "See a frame yourself").
trace = ["party_kit/trace"]
profile = ["party_kit/profile"]
tracy = ["party_kit/tracy"]
