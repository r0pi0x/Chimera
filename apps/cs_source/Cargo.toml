[package]
name = "cs_source_app"
version = "0.1.0"
description = "The faithful Counter-Strike: Source app: the game binary and its glue (the composed simulation, harness, map loading, client hooks)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "cs_source"

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The app composes Chimera, Source's logic and CS:S: `SimPlugins` (the
# simulation every CS:S build runs, `cs_source::SimPlugins`, with this
# build's version), the harness and greybox at their old paths
# (chimera_world's, chimera_net's and cs_source's), map loading by id
# (`games`), and with
# the presentation the client (`client`: the shell with this app's hooks
# and CS:S's HUD) and the game binary. Above it: the dedicated server
# (apps/cs_source_server), the tools that drive this simulation
# (games/cs_source/tools) and `mashup` (the repository root's package:
# `dump`).
[dependencies]
source_formats.workspace = true
chimera_core.workspace = true
chimera_world.workspace = true
# The presentation and the client shell: behind the default feature
# `present`; the dedicated server builds without them.
chimera_present = { workspace = true, optional = true }
chimera_client = { workspace = true, optional = true }
chimera_sim.workspace = true
chimera_net.workspace = true
source_logic.workspace = true
cs_source.workspace = true
avian3d.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The integration tests (tests/it/): what only the app has (its build's
# version); the scenario tests are cs_source's (games/cs_source/tests/).
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["present"]

# The game: its window, the presentation, the client shell and CS:S's
# front end (`--no-default-features` leaves them out). Named after the
# game; `doc = false`: its docs would land where the `cs_source` library's
# do.
[[bin]]
name = "cs_source"
path = "src/main.rs"
test = false
doc = false
required-features = ["present"]

# The offscreen test reads the PNGs the game saved (tests/it/heavy/offscreen.rs).
[dev-dependencies]
image.workspace = true

[features]
default = ["present"]

# The presentation (chimera_present: render, audio, `map::MapPlugin`), the
# client shell (`client`) and CS:S's front end (`cs_source/ui`):
# everything but the dedicated server.
present = ["dep:chimera_present", "dep:chimera_client", "cs_source/ui"]

# Faster iteration: link Bevy as a dynamic library. Use with
# `cargo run --features dev`. Never enable for release builds.
dev = [
    "chimera_core/dev",
    "chimera_world/dev",
    "chimera_present?/dev",
    "chimera_client?/dev",
    "source_logic/dev",
    "chimera_sim/dev",
    "chimera_net/dev",
    "cs_source/dev",
    "source_formats/dev",
]

# CPU profile: every system and render step as a span in a Chrome trace
# (docs/performance.md). Slower; only for measuring.
profile = ["chimera_core/profile", "chimera_client?/profile"]
# A short window of spans (`trace_capture`), and the Tracy profiler live
# (docs/performance.md, "See a frame yourself").
trace = ["chimera_core/trace", "chimera_client?/trace"]
tracy = ["chimera_core/tracy", "chimera_client?/tracy"]
