[package]
name = "ultimate_gun_game_server"
version = "0.1.0"
description = "Ultimate Gun Game's dedicated server: the party's server playing the automatic gun game, no window, render or audio"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The app crates this one is built on (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
apps = ["party_kit", "ultimate_gun_game"]

# The party kit's server (`party_kit::server`) with the Ultimate Gun Game's
# parts (`ultimate_gun_game` without its default `present`), so no
# presentation links (checks/tests/it/architecture.rs,
# `server_builds_without_presentation`).
[dependencies]
party_kit.workspace = true
ultimate_gun_game.workspace = true
workspace-hack.workspace = true

[[bin]]
name = "ultimate_gun_game_server"
path = "src/main.rs"
test = false

[features]
dev = ["party_kit/dev", "ultimate_gun_game/dev"]
