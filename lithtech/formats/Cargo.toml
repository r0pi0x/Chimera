[package]
name = "lithtech_formats"
version = "0.1.0"
description = "LithTech engine file formats as plain data: no Bevy, no game code"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# Pure data, like `source_formats`: what a format needs to be read and
# nothing else. No Bevy, avian, Chimera's crates, a game or `mashup`
# (checks/tests/it/architecture.rs checks it). `chimera_vfs` only for
# the VFS (`FileSource`, `Mount`), which Chimera's `mount` re-exports,
# so a `.rez` archive is a mount layer like a VPK.
[dependencies]
chimera_vfs.workspace = true
# `.rez` payloads (specs/combat_arms/rez_archive.md, "Encryption"): V2
# archives are AES-256-CBC (CBC and the plain tail are ours, in
# rez_cipher.rs). V1's Twofish is ours too (table-driven; RustCrypto's
# `twofish`, a dev-dependency below, checks it).
aes = "=0.9.3"

# The heavy tests find the install and keys in chimera.local.toml
# themselves (no Chimera crate here).
[dev-dependencies]
toml.workspace = true
twofish = "0.8"

# Integration tests as one binary (tests/it/): spec fixtures built in
# code, and `heavy::` against the user's Combat Arms install.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Nothing: lets `--features dev` name this package alongside the others
# (cargo test -p ... -p <crate> --features dev; .githooks/pre-commit).
dev = ["chimera_vfs/dev"]
