[package]
name = "tf2"
version = "0.1.0"
description = "Team Fortress 2 as a game crate: its install, registration, maps and guns so far (docs/plans/active/tf2.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The layers this crate builds on, beside Chimera (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
loaders = ["source"]

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's simulation crates and Source's shared crates; never `mashup`,
# another game (`cs_source`, `hl2dm`), an app, the presentation
# (`chimera_present`) or the shell: the front end is its own crate above
# this one, `tf2_ui` (games/tf2/ui; checks/tests/it/architecture.rs checks
# it). Same versions and features as the other
# members' (workspace dependencies), so `cargo test -p tf2` reuses the
# workspace's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_net.workspace = true
bevy_replicon.workspace = true
# Source engine behaviour shared with CS:S and HL2:DM (the search path,
# map lists, the maps' conversion).
source_engine.workspace = true
# Source's map logic (entity I/O, triggers, movers): part of the game's
# simulation (`SimPlugins`).
source_logic.workspace = true
# The VPK reader (an archive's files listed but its data missing).
source_formats.workspace = true
bevy.workspace = true
vbsp.workspace = true
# The rocket's blast lines (`game::weapons::rocket`).
avian3d.workspace = true
# The weapon hooks' parameters.
serde.workspace = true
# The class table (data/classes.toml).
toml.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, for this
# crate's own tests only (the dedicated servers build without them), so
# `cargo test -p tf2` shares the clients' builds of Bevy (hakari.toml).
# No client shell: its tests build none of it (`tf2_ui` has the front end's).
[dev-dependencies]
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it.
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it.
bevy_winit.workspace = true
# Digests of converted maps (tests/it/heavy/map_cache.rs).
postcard.workspace = true
sha2.workspace = true
# A kill-icon sheet made in the test (tests/it/kill_icons.rs).
vtf.workspace = true
image.workspace = true

# The integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on):
# `cargo test -p tf2 --features dev` shares the apps' Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "source_engine/dev", "source_logic/dev", "source_formats/dev"]
