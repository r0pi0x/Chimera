# TF2's unlocks we play (docs/plans/active/tf2-weapons.md, batches;
# specs/tf2/item_attributes.md 5). Ours: which items of the converted pack
# (`chimera_pack sets tf2 --only items`, `game::items`) become weapons,
# under which id, on which of our weapons. The items' numbers, names and
# models are the pack's (from the user's install, never committed); an
# item the pack lacks is simply not offered.
#
# [bases]: an item class (`item_class`) -> the weapon of ours its numbers
# start from (the class's own script, where the pack has it, then the
# attributes: `items::docs`).
#
# [items.<name>]: `index` the item's definition index; `batch` the plan's
# batch; `gun_game` overrides whether a ladder may draw it (default: it
# deals damage, its base being a ladder gun); `wearable`: no weapon, its
# attributes only modify its wearer; `note` what its attributes don't
# cover (still to build).

[bases]
tf_weapon_handgun_scout_secondary = "tf2:tf_weapon_pistol_scout"
tf_weapon_bat_fish = "tf2:tf_weapon_bat"
tf_weapon_rocketlauncher = "tf2:tf_weapon_rocketlauncher"
tf_weapon_rocketlauncher_directhit = "tf2:tf_weapon_rocketlauncher"
tf_weapon_shovel = "tf2:tf_weapon_shovel"
tf_weapon_flamethrower = "tf2:tf_weapon_flamethrower"
tf_weapon_fireaxe = "tf2:tf_weapon_fireaxe"
tf_weapon_breakable_sign = "tf2:tf_weapon_fireaxe"
tf_weapon_grenadelauncher = "tf2:tf_weapon_grenadelauncher"
tf_weapon_pipebomblauncher = "tf2:tf_weapon_pipebomblauncher"
tf_weapon_sword = "tf2:tf_weapon_bottle"
tf_weapon_minigun = "tf2:tf_weapon_minigun"
tf_weapon_shotgun = "tf2:tf_weapon_shotgun_primary"
tf_weapon_fists = "tf2:tf_weapon_fists"
tf_weapon_wrench = "tf2:tf_weapon_wrench"
tf_weapon_sniperrifle = "tf2:tf_weapon_sniperrifle"
tf_weapon_club = "tf2:tf_weapon_club"
tf_weapon_knife = "tf2:tf_weapon_knife"
