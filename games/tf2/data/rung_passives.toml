# The gun game's rung passives (docs/plans/active/rung-passives.md;
# Chimera's `minigame::passives`): the worn items a TF2 rung may carry
# beside its gun when the host has passives on (off by default), drawn
# per rung with the ladder for the rung's class (`game::classes::HOOK`).
#
# odds: a rung's chance of one; max: at most this many on a rung.
# slot_names: our weapon data's slots (0, 1, 2) by TF2's loadout names.
# [slots]: a gun's slot for a class where it isn't its data's (the
# Shotgun is the Engineer's primary, the others' secondary).
# [gun_keys]: the keys a gun uses beyond fire, which an item's `keys` may
# not take (the shields' and watches' attack2); an unlock reads its base
# weapon's row (`items::base_in`: the Degreaser the Flame Thrower's).
# [[passive]]: `item` a weapon id (data/items.toml; an item the pack lacks
# is never drawn), `classes`, `slot` the loadout slot it takes (never the
# rung gun's), `group` (one per group on a rung), `weight`, `kind` (worn
# or carried), `keys`, `summary` (one line for the HUD's hover card).
# P1: the worn items that take no key; P3: the keyed ones (shields and
# watches on attack2 with any weapon out, the chute on jump in the air:
# no gun uses jump) and the carried Thermal Thruster (switched to in its
# slot and fired: its slot is its key). `items::bots` uses them for bots.

odds = 0.25
max = 1
slot_names = ["primary", "secondary", "melee"]

[slots."tf2:tf_weapon_shotgun_primary"]
"*" = "secondary"
engineer = "primary"

[gun_keys]
"tf2:tf_weapon_flamethrower" = ["attack2"]
"tf2:tf_weapon_minigun" = ["attack2"]
"tf2:tf_weapon_sniperrifle" = ["attack2"]
"tf2:tf_weapon_pipebomblauncher" = ["attack2"]
"tf2:tf_weapon_rocketlauncher_fireball" = ["attack2"]
"tf2:tf_weapon_particle_cannon" = ["attack2"]
"tf2:tf_weapon_compound_bow" = ["attack2"]

[[passive]]
item = "tf2:mantreads"
classes = ["soldier"]
slot = "secondary"
group = "feet"
weight = 2
summary = "Stomp an enemy by landing on his head; less push from blasts and airblast"

[[passive]]
item = "tf2:ali_babas_wee_booties"
classes = ["demoman"]
slot = "secondary"
group = "feet"
summary = "More health; faster with a shield"

[[passive]]
item = "tf2:bootlegger"
classes = ["demoman"]
slot = "secondary"
group = "feet"
summary = "More health; faster with a shield"

[[passive]]
item = "tf2:darwins_danger_shield"
classes = ["sniper"]
slot = "secondary"
group = "back"
summary = "Resists fire and afterburn"

[[passive]]
item = "tf2:cozy_camper"
classes = ["sniper"]
slot = "secondary"
group = "back"
summary = "Regenerates health; steadier while scoped"

[[passive]]
item = "tf2:razorback"
classes = ["sniper"]
slot = "secondary"
group = "back"
summary = "Blocks one backstab"

