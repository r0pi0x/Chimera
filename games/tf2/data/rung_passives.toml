# ---- P5: utility items (kind = "active", their own option) ----
# Carried in their loadout slot and used with fire (`items::consumables`,
# `items::meters`); never in a slot or on a key the gun or a passive
# takes. A kill they set up is the gun's (they deal no damage). Bots use
# them (`items::bots`). Not the Buffalo Steak Sandvich (its melee-only
# buff would hold the rung's gun away for 19 s) nor the Gas Passer.

