# TF2's living players' idle faces (specs/tf2/faces.md 5): the looping
# idle expression scene each class plays when alive, not hurt, not
# speaking, not firing (`game::faces`). Each class's scene holds one
# expression event: its preset's controller weights (each controller's
# own range; lids negative) at the event's intensity.
#
# model: the class's player model; length: the scene's length (s; it
# starts again after it); from, to: the event's span in the scene (s);
# ramp: its intensity samples (event time s, intensity), between edge
# points of 0 at its start and end (spec 4.1; none: 1 throughout);
# preset: the preset's controllers and weights. The Pyro has none (spec
# 11): his face stays at rest.

[classes.engineer]
model = "models/player/engineer.mdl"
length = 30.0
from = 0.0
to = 30.0
ramp = [[0.194, 0.98], [29.68, 0.98]]
preset = { defaultFace = 1.0 }

