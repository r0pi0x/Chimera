# The Demoman's Bottle (specs/tf2/weapons_stock.md 1, 5.5): 65 every 0.8 s
# (its break on a crit hit, cosmetic, isn't built: the script's hit sounds
# throughout).
id = "tf2:tf_weapon_bottle"
base = "tf2:melee"

[melee.primary]
sound_swing = "tf2:Weapon_Bottle.Miss"
sound_hit = "tf2:Weapon_Bottle.HitFlesh"
sound_hit_world = "tf2:Weapon_Bottle.HitWorld"

# `b_draw`'s sound event (8.1).
[sounds]
# The draw's sounds are the owner's view model's animation sound events
# (specs/tf2/viewmodel_sounds.md, weapons_stock.md 8.1; view.rs).

[models]
world = "models/weapons/c_models/c_bottle/c_bottle.mdl"
view = "models/weapons/c_models/c_bottle/c_bottle.mdl"
view_right_handed = true

[hud]
name = "Bottle"
icon = "bottle"

[hooks."tf2:melee"]
arms = "demo"
script = "tf_weapon_bottle"
crit_swing = "tf2:Weapon_Bottle.MissCrit"
