# The Engineer's Wrench (specs/tf2/weapons_stock.md 1, 5.4): 65 every
# 0.8 s against players (no buildings in a gun game: a building is the
# world).
id = "tf2:tf_weapon_wrench"
base = "tf2:melee"

[melee.primary]
sound_swing = "tf2:Weapon_Wrench.Miss"
sound_hit = "tf2:Weapon_Wrench.HitFlesh"
sound_hit_world = "tf2:Weapon_Wrench.HitWorld"

# `pdq_draw`'s sound events (8.1).
[sounds]
# The draw's sounds are the owner's view model's animation sound events
# (specs/tf2/viewmodel_sounds.md, weapons_stock.md 8.1; view.rs).

[models]
world = "models/weapons/c_models/c_wrench/c_wrench.mdl"
view = "models/weapons/c_models/c_wrench/c_wrench.mdl"
view_right_handed = true

[hud]
name = "Wrench"
icon = "wrench"

[hooks."tf2:melee"]
arms = "engineer"
script = "tf_weapon_wrench"
crit_swing = "tf2:Weapon_Wrench.MissCrit"
