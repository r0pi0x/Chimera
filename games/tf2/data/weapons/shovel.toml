# The Soldier's Shovel (specs/tf2/weapons_stock.md 1, 5.2): 65 every 0.8 s.
id = "tf2:tf_weapon_shovel"
base = "tf2:melee"

[melee.primary]
sound_swing = "tf2:Weapon_Shovel.Miss"
sound_hit = "tf2:Weapon_Shovel.HitFlesh"
