# The Grenade Launcher, the Demoman's primary (specs/tf2/weapons_more.md
# 1, 4, 6): a grenade every 0.6 s, 4 in the drum and 16 carried, one at a
# time (first in at 1.2, then 0.6 each). The grenade (Chimera's flyers)
# starts 16 forward, 8 right and 6 down from the eye at 1200 along the aim
# and 200 up, falls with gravity 800 and bounces off the world; it passes
# teammates. `tf2:grenade`: on an enemy before it has touched the world it
# explodes there (full splash), after that it only bounces; at 2.1 s (the
# 2.0 s fuse at its tenth 0.2 s check) it explodes wherever it is at 60 %:
# 100 (60 on the fuse) x the splash (to 50 % at 146), no distance
# modifier; the owner's own the base 100 x the splash x0.75 grounded or
# airborne, pushed at scale 9 (weapons_more.md's corrections from the
# SDK).
id = "tf2:tf_weapon_grenadelauncher"
base = "tf2:base"
class = "launcher"
slot = 0
draw = 0.5

[trigger]
automatic = true
cycle = 0.6
timing = "set"

[magazine]
clip = 4
ammo = "tf2:grenades"
reload = 0.6
auto_reload = true
# cl_autoreload 1 (weapons.md 4, step 4): a clip not full reloads with neither attack held.
reload_when_idle = true
shells = { start = 0.6, insert = 0.6, back_to_back = true, from_tick = true, start_interruptible = true }

[hitscan]
range = 56754.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.0 }

[sounds]
# The owner's reload and draw sounds are his view model's animation
# sound events (specs/tf2/viewmodel_sounds.md, view.rs); everyone else
# hears the world reload at each reload's start (each round's insert for
# a one-at-a-time reload).
world_reload = "tf2:Weapon_GrenadeLauncher.WorldReload"
fire = "tf2:Weapon_GrenadeLauncher.Single"

[models]
world = "models/weapons/c_models/c_grenadelauncher/c_grenadelauncher.mdl"
view = "models/weapons/c_models/c_grenadelauncher/c_grenadelauncher.mdl"
view_right_handed = true

# The drum (`procedural_chamber`, six chambers) turns one chamber a shot
# in the Demoman's own view, smoothly, from the frame after the shot to
# about 0.14 s after it, clockwise seen from behind; never in a reload,
# never in the world model (specs/tf2/weapons_more.md 9.6).
[[anim.procedural]]
bone = "procedural_chamber"
per_shot = 60.0
time = 0.14

[hud]
name = "Grenade Launcher"
icon = "tf_projectile_pipe"

[hooks."tf2:gun"]
ramp = 1.0
arms = "demo"
script = "tf_weapon_grenadelauncher"

[hooks."chimera:projectile"]
# Drawn 0.12 s in the past on every client, the shooter's own too, its
# blast held as long, starting on its launch line behind the launch point
# (specs/tf2/effects.md 11, 11.1); its model hidden its first 0.1 s.
interp = true
whole_units = true
model_hidden = 0.1
speed = 1200.0
up_speed = 200.0
gravity = 800.0
half = [2.0, 2.0, 2.0]
touch = "report"
shown = "tf2:tf_weapon_grenadelauncher/grenade"
offset = [16.0, 8.0, -6.0]
pass_teammates = true
# Players are met as their collision boxes, not their colliders (weapons.md
# Open questions 12, effects.md 13).
hull_boxes = true
life = 2.1
# (600, r, 0) degrees/s about its forward, left, up, r a whole number in
# ±1200, added twice: (1200, 2r, 0) (weapons_more.md 4.1).
spin = { base = [600.0, 0.0, 0.0], random = [0.0, 1200.0, 0.0], times = 2 }
# Air drag per 0.015 s tick x air_density (tf2:air_density, 2), along /
# about its forward (its long axis), left, up (weapons_more.md 4.4, fitted),
# the angular on the whole spin; its inertia symmetric about the long axis,
# I_x = 0.288 I_other, so the spin precesses in the body after the drag
# (flight::precess, in the engine's sub-steps).
drag = { lin = [0.75e-6, 1.91e-6, 1.90e-6], ang = [9.45e-7, 3.98e-7, 3.98e-7], per = 0.015, inertia = [0.288, 1.0, 1.0] }

[hooks."tf2:grenade"]
damage = 100.0
radius = 146.0
edge = 0.5
fuse_scale = 0.6
self_radius = 146.0
self_damage = 100.0
self_air_scale = 0.75
self_ground_scale = 0.75
push_other = 6.0
push_self_air = 9.0
push_self_ground = 9.0
by_distance = false
sound = "tf2:Weapon_Grenade_Pipebomb.Explode"
bounce_sound = "tf2:Weapon_Grenade_Pipebomb.Bounce"

# The shot's look (specs/tf2/effects.md 1, 2, 5; looks.rs): its muzzle
# flash system (muzzle_flash.pcf) at the gun's `muzzle` attachment; its
# blasts' effects (explosion.pcf: on a surface, in the air or on a player,
# under water: the script's names, effects.md 1 and 5): the Stickybomb
# Launcher's, as TF2 reads for pipes; a crit-boosted owner's pipe also
# shows `critical_pipe_<team>` on itself (`crit`).
[hooks."tf2:looks"]
trail = { shown = "tf2:tf_weapon_grenadelauncher/grenade", system = "pipebombtrail", team = true, crit = "critical_pipe" }
muzzle = "muzzle_grenadelauncher"
explosion_of = "tf2:tf_weapon_pipebomblauncher"
