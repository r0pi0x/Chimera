# The Scout's Bat (specs/tf2/weapons_stock.md 1, 5.1): the only fast
# melee, 35 every 0.5 s; its draw a flourish (four sound events).
id = "tf2:tf_weapon_bat"
base = "tf2:melee"

[melee.primary]
damage = 35.0
hit_refire = 0.5
miss_refire = 0.5
miss_refire_other = 0.5
sound_swing = "Weapon_Bat.Miss"
sound_hit = "Weapon_Bat.HitFlesh"
sound_hit_world = "Weapon_Bat.HitWorld"

# `b_draw`'s sound events (8.1), at their fraction of its 1.3333 s.
[sounds]
draw = [[0.0333, "Weapon_Bat.Draw"], [0.2667, "Weapon_Bat.DrawSwoosh2"], [0.5333, "Weapon_Bat.DrawSwoosh1"], [0.6667, "Weapon_Bat.DrawCatch"]]

[models]
world = "models/weapons/c_models/c_bat.mdl"
view = "models/weapons/c_models/c_bat.mdl"
view_right_handed = true

[hud]
name = "Bat"
icon = "bat"

[hooks."tf2:melee"]
arms = "scout"
script = "tf_weapon_bat"
crit_swing = "Weapon_Bat.MissCrit"
