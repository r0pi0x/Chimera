# The Stickybomb Launcher, the Demoman's secondary (specs/tf2/
# weapons_more.md 1, 5, 6): attack charges (up to 4 s, then it fires by
# itself), its release launches a sticky at 900 to 2400 along the aim
# (by the time held) and 200 up, from the grenade's offset, 0.6 s before
# the next; 8 in the clip and 24 carried, one at a time (first in at 1.09,
# then 0.67). `tf2:sticky`: it sticks to the world, bounces off enemies,
# arms 0.8 s after launch; attack2 detonates every armed one; at most 8
# out (a ninth blows the oldest); 120 x the splash x the short-range-
# reduced modifier (121.8 % at 0) within 5 s of launch; in the air its
# radius grows from 85 % at arming to all of 146 over 2 s; the owner's
# own the base 120 x the splash x0.75 grounded or airborne, pushed at
# scale 9 (weapons_more.md's corrections from the SDK).
id = "tf2:tf_weapon_pipebomblauncher"
base = "tf2:base"
class = "launcher"
slot = 1
draw = 0.5

[trigger]
automatic = true
cycle = 0.6
timing = "set"

[magazine]
clip = 8
ammo = "tf2:stickies"
reload = 0.67
auto_reload = true
# cl_autoreload 1 (weapons.md 4, step 4): a clip not full reloads with neither attack held.
reload_when_idle = true
shells = { start = 0.42, insert = 0.67, back_to_back = true, from_tick = true, start_interruptible = true }

[hitscan]
range = 56754.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.0 }

[sounds]
# The owner's reload and draw sounds are his view model's animation
# sound events (specs/tf2/viewmodel_sounds.md, view.rs); everyone else
# hears the world reload at each reload's start (each round's insert for
# a one-at-a-time reload).
world_reload = "tf2:Weapon_StickyBombLauncher.WorldReload"
fire = "tf2:Weapon_StickyBombLauncher.Single"

[models]
world = "models/weapons/c_models/c_stickybomb_launcher/c_stickybomb_launcher.mdl"
view = "models/weapons/c_models/c_stickybomb_launcher/c_stickybomb_launcher.mdl"
view_right_handed = true

[hud]
name = "Stickybomb Launcher"
icon = "tf_projectile_pipe_remote"

[hooks."tf2:gun"]
ramp = 1.0
near = "compressed"
arms = "demo"
script = "tf_weapon_pipebomblauncher"

[hooks."tf2:sticky"]
damage = 120.0
radius = 146.0
edge = 0.5
self_radius = 146.0
self_damage = 120.0
self_air_scale = 0.75
self_ground_scale = 0.75
push_other = 6.0
push_self_air = 9.0
push_self_ground = 9.0
flat_after = 5.0
arm = 0.8
air_radius_start = 0.85
air_radius_time = 2.0
max = 8
speed_min = 900.0
speed_max = 2400.0
up_speed = 200.0
charge_time = 4.0
gravity = 800.0
offset = [16.0, 8.0, -6.0]
jitter = 10.0
# (600, r, 0) degrees/s about its forward, left, up, r a whole number in
# ±1200, added twice: (1200, 2r, 0) (weapons_more.md 4.1).
spin = { base = [600.0, 0.0, 0.0], random = [0.0, 1200.0, 0.0], times = 2 }
# Air drag per 0.015 s tick x air_density (tf2:air_density, 2), along /
# about its forward, left, up: per unit/s and per degree/s (weapons_more.md
# 4.4, fitted; the third angular term assumed as the spec's 7.3e-7).
drag = { lin = [1.43e-6, 1.41e-6, 1.45e-6], ang = [7.27e-7, 7.36e-7, 7.3e-7], per = 0.015 }
# Added to `arm` (weapons_more.md 5.3): the launcher's attribute; none on
# the stock one (the Quickiebomb -0.2, the Scottish Resistance +0.8). The
# detonation and the armed pulse (effects.md 11.3) both use arm + this.
sticky_arm_time = 0.0
sound = "tf2:Weapon_Grenade_Pipebomb.Explode"
charge_sound = "tf2:Weapon_StickyBombLauncher.ChargeUp"
detonate_sound = "tf2:Weapon_StickyBombLauncher.ModeSwitch"
# Drawn 0.12 s in the past on every client, the shooter's own too, as the
# other projectiles, starting on its launch line behind the launch point
# (specs/tf2/effects.md 11, 11.1); its model hidden its first 0.1 s.
interp = true
whole_units = true
model_hidden = 0.1

# The shot's look (specs/tf2/effects.md 1, 2, 5; looks.rs): its muzzle
# flash system (muzzle_flash.pcf) at the gun's `muzzle` attachment; its
# blasts' effects (explosion.pcf: on a surface, in the air or on a player,
# under water; which name sits in which script field is unconfirmed, the
# pcf names are used), the Stickybomb Launcher's for pipes too.
[hooks."tf2:looks"]
trail = { shown = "tf2:tf_weapon_pipebomblauncher/sticky", system = "stickybombtrail", team = true }
# Its pulse once armed (effects.md 11.3): each machine starts it the
# arm time (tf2:sticky's arm + sticky_arm_time, 0.8) after it first
# received the sticky.
armed = { shown = "tf2:tf_weapon_pipebomblauncher/sticky", system = "stickybomb_pulse", team = true }
muzzle = "muzzle_pipelauncher"
explosion = { wall = "ExplosionCore_Wall", player = "ExplosionCore_MidAir", water = "ExplosionCore_MidAir_underwater" }
