# The Syringe Gun, the Medic's primary (specs/tf2/weapons_more.md 1, 8):
# a needle every 0.105 s, 40 in the clip and 150 carried, the whole clip
# in 1.305 s. Each needle (Chimera's flyers) flies at 1000 units/s from
# under the gun toward the crosshair's point, +-1.5 degrees in pitch and
# yaw, falling at 0.3 of gravity, through teammates; on an enemy (`tf2:needle`) 10 x the short-
# range-reduced modifier (121.8 % at 0) at impact, rounded.
id = "tf2:tf_weapon_syringegun_medic"
base = "tf2:base"
class = "smg"
slot = 0
draw = 0.5

[trigger]
automatic = true
cycle = 0.105
timing = "set"

[magazine]
clip = 40
ammo = "tf2:syringes"
reload = 1.305
auto_reload = true
# cl_autoreload 1 (weapons.md 4, step 4): a clip not full reloads with neither attack held.
reload_when_idle = true

[hitscan]
range = 56754.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.0 }

[sounds]
fire = "tf2:Weapon_SyringeGun.Single"
empty = "tf2:Weapon_SyringeGun.ClipEmpty"
reload = [[0.0, "tf2:Weapon_SyringeGun.Reload1"], [0.5, "tf2:Weapon_SyringeGun.Reload2"], [1.0, "tf2:Weapon_SyringeGun.Reload3"]]
draw = [[0.0, "tf2:Weapon_SyringeGun.Draw"]]

[models]
world = "models/weapons/c_models/c_syringegun/c_syringegun.mdl"
view = "models/weapons/c_models/c_syringegun/c_syringegun.mdl"
view_right_handed = true

[hud]
name = "Syringe Gun"
icon = "syringegun_medic"

[hooks."tf2:gun"]
ramp = 1.0
near = "compressed"
arms = "medic"
script = "tf_weapon_syringegun_medic"

[hooks."chimera:projectile"]
# Drawn 0.1 s in the past on every client, the shooter's own too
# (specs/tf2/effects.md 11); its model shows at once (measured: needles
# appear at the barrel as their drawn place passes it).
interp = true
speed = 1000.0
gravity = 240.0
# Aimed at what a 2000-unit line from the eye meets, then +-1.5 degrees in
# pitch and yaw (weapons_more.md 8).
aim_trace = 2000.0
jitter = 1.5
touch = "report"
shown = "tf2:tf_weapon_syringegun_medic/syringe"
offset = [16.0, 6.0, -8.0]
pass_teammates = true
life = 10.0
# A touch on the world leaves a bullet's hole mark and debris, no needle
# (effects.md, "Needles on a wall").
marks = true

[hooks."tf2:needle"]
damage = 10.0

# The shot's look: its muzzle flash system (muzzle_flash.pcf), started at
# the gun's `muzzle` attachment (looks.rs).
[hooks."tf2:looks"]
trail = { shown = "tf2:tf_weapon_syringegun_medic/syringe", system = "nailtrails_medic", team = true }
muzzle = "muzzle_syringe"
