# TF2's ammo (specs/tf2/weapons.md 1, weapons_more.md 1): each gun's
# reserve. The Minigun's 200, the Sniper Rifle's 25 and the Flame
# Thrower's 200 are their clips (no reserve, they never reload).
units = { length = 0.0254 }

[ammo."tf2:scattergun"]
max = 32

[ammo."tf2:rockets"]
max = 20

[ammo."tf2:shotgun"]
max = 32

[ammo."tf2:minigun"]
max = 0

[ammo."tf2:pistol_scout"]
max = 36

[ammo."tf2:smg"]
max = 75

[ammo."tf2:sniperrifle"]
max = 0

[ammo."tf2:revolver"]
max = 24

[ammo."tf2:grenades"]
max = 16

[ammo."tf2:stickies"]
max = 24

[ammo."tf2:flame"]
max = 0

# The flare guns' 16 are their clip (batch2_mechanics.md 4.1).
[ammo."tf2:flares"]
max = 0

[ammo."tf2:syringes"]
max = 150

# Batch 2b's unlocks (specs/tf2/batch2b_mechanics.md): the Huntsman's
# arrows and the crossbow's bolts (the Sniper's and Medic's primary
# reserves, × the items' `mult_maxammo_primary`), the Bison's energy (no
# ammo: a reserve that doesn't run out in a match).
[ammo."tf2:arrows"]
max = 25

[ammo."tf2:bolts"]
max = 150

[ammo."tf2:energy"]
max = 9999
