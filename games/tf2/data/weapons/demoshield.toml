# The Demoman's shield class (`tf_wearable_demoshield`,
# specs/tf2/batch3_mechanics.md 1): no stock weapon of its own, the base of
# the Chargin' Targe, the Splendid Screen and the Tide Turner
# (data/items.toml `[bases]`). Worn (`tf2:worn`: carried, never drawn);
# attack2 with a full meter charges (`tf2:shield`, `items::shields`;
# batch3b_mechanics.md 1): 750 units/s for 1.5 s, the turn capped at 48
# degrees/s, 12 s to refill; the swing mini-crits at 75 meter and below,
# crits at 40 and below; an impact deals min(50, 8 + 0.7 x the meter used).
# Its resistances are the item's attributes.
id = "tf2:tf_wearable_demoshield"
base = "tf2:base"
abstract = true
slot = 1
draw = 0.5

[hud]
name = "Shield"

[hooks."tf2:worn"]

[hooks."tf2:shield"]
speed = 750.0
time = 1.5
recharge = 12.0
mini_below = 75.0
crit_below = 40.0
boost_max = "crit"
linger = 0.3
turn_cap = 48.0
impact_base = 8.0
impact_slope = 0.7
impact_cap = 50.0
head_bonus = 0.1
head_cap = 5
