# The Medic's Bonesaw (specs/tf2/weapons_stock.md 1, 5.2): 65 every 0.8 s;
# it draws with the Kukri's sound (its animation's event, kept).
id = "tf2:tf_weapon_bonesaw"
base = "tf2:melee"

[melee.primary]
sound_swing = "tf2:Weapon_BoneSaw.Miss"
sound_hit = "tf2:Weapon_BoneSaw.HitFlesh"
sound_hit_world = "tf2:Weapon_BoneSaw.HitWorld"

# `bs_draw`'s sound event (8.1).
[sounds]
# The draw's sounds are the owner's view model's animation sound events
# (specs/tf2/viewmodel_sounds.md, weapons_stock.md 8.1; view.rs).

[models]
world = "models/weapons/c_models/c_bonesaw/c_bonesaw.mdl"
view = "models/weapons/c_models/c_bonesaw/c_bonesaw.mdl"
view_right_handed = true

[hud]
name = "Bonesaw"
icon = "bonesaw"

[hooks."tf2:melee"]
arms = "medic"
script = "tf_weapon_bonesaw"
crit_swing = "tf2:Weapon_BoneSaw.MissCrit"
