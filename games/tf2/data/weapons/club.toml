# The Sniper's Kukri (specs/tf2/weapons_stock.md 1, 5.2): the generic
# `tf_weapon_club`, the machete's model; 65 every 0.8 s.
id = "tf2:tf_weapon_club"
base = "tf2:melee"

[melee.primary]
sound_swing = "tf2:Weapon_Machete.Miss"
sound_hit = "tf2:Weapon_Machete.HitFlesh"
sound_hit_world = "tf2:Weapon_Machete.HitWorld"

# `m_draw`'s sound event (8.1).
[sounds]
draw = [[0.0333, "tf2:Weapon_Machete.Draw"]]

[models]
world = "models/weapons/c_models/c_machete/c_machete.mdl"
view = "models/weapons/c_models/c_machete/c_machete.mdl"
view_right_handed = true

[hud]
name = "Kukri"
icon = "club"

[hooks."tf2:melee"]
arms = "sniper"
script = "tf_weapon_club"
crit_swing = "tf2:Weapon_Machete.MissCrit"
