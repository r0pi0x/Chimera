# The Minigun (specs/tf2/minigun.md; weapons.md 1, 6, 7): the Heavy's
# primary; winds up 0.75 s, its first shot 0.1 s later (tick 57), its
# holder at 110 units/s and unable to jump while it turns; no gameplay
# wind-down (idle 0.2 s after the last shot when firing, 0.3 s after
# attack2 when spun), only the switch waits for the spool-down (1.333 s,
# finished 0.2 s before its end: 77 ticks after the wind-down, minigun.md 3.3);
# empty, it switches to the previous weapon; 4 bullets of 9 every 0.105 s (7 ticks), spread 0.08,
# 200 rounds and no reload; the rev-up penalty (the 2017 rule): damage
# 50 % until 0.2 s spun then linear to 100 % at 1 s, spread 1.5x to 1x.
# `tf2:minigun` runs the spin.
id = "tf2:tf_weapon_minigun"
base = "tf2:gun"
class = "heavy"
slot = 0

[trigger]
automatic = true
cycle = 0.105
timing = "set"

[magazine]
clip = 200
ammo = "tf2:minigun"
reload = 1.0

[hitscan]
range = 56754.0
pellets = 4
punch_scale = 1.0
spread = { template = 0.08 }

[damage]
amount = 9.0
falloff = 1.0
falloff_step = 1024.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

# No sound per shot: `tf2:minigun` plays one sound by its state.
[sounds]
# The draw's sounds are the owner's view model's animation sound events
# (specs/tf2/viewmodel_sounds.md, weapons_stock.md 8.1; view.rs).

[models]
world = "models/weapons/c_models/c_minigun/c_minigun.mdl"
view = "models/weapons/c_models/c_minigun/c_minigun.mdl"
view_right_handed = true

[hud]
name = "Minigun"
icon = "minigun"

[hooks."tf2:gun"]
ramp = 1.0
arms = "heavy"
script = "tf_weapon_minigun"

[hooks."tf2:minigun"]
wind_up = 0.75
fire_step = 0.1
idle_after_fire = 0.2
spin_idle = 0.3
spool_down = 1.333
spool_down_fade = 0.2
penalty_time = 1.0
penalty_flat = 0.2
damage_floor = 0.5
spread_ceiling = 1.5
spun_speed = 110.0
wind_up_sound = "tf2:Weapon_Minigun.WindUp"
spin_sound = "tf2:Weapon_Minigun.Spin"
fire_sound = "tf2:Weapon_Minigun.Fire"
fire_crit_sound = "tf2:Weapon_Minigun.FireCrit"
empty_sound = "tf2:Weapon_Minigun.ClipEmpty"
wind_down_sound = "tf2:Weapon_Minigun.WindDown"

# Its looks (specs/tf2/effects.md 3, 6; looks.rs): no per-shot flash;
# while it fires (`tf2:minigun`'s fire loop) its constant muzzle system at
# `muzzle` and its brass at `eject_brass`, stopped when it stops firing;
# a tracer every 4th bullet of the shared count (the generic one: "pcf
# (inferred)").
[hooks."tf2:looks"]
tracer = "bullet_tracer01"
tracer_every = 4
while_firing = [
    { system = "muzzle_minigun_constant", at = "muzzle" },
    # The casings leave to the right, square to the aim and ~23 degrees up
    # (the system's own 100-200 units/s along its x: 150-180 measured), born
    # ~28 right of and 41 below the eye (particles.md Open questions 6).
    { system = "eject_minigunbrass", at = "eject_brass", up = 23.0, from_eye = [0.0, 28.0, -41.0] },
]
