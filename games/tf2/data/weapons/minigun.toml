# The Minigun (specs/tf2/weapons.md 1, 6, 7 and its corrections from the
# SDK): the Heavy's primary; winds up 0.75 s, its first shot 0.1 s later
# (about 0.85 s after the press), its holder at 110 units/s and unable to
# jump while it turns; no gameplay wind-down (idle at once on release,
# 0.2 s after the last shot when firing), only the switch waits for the
# 1.33 s spool-down; 4 bullets of 9 every 0.105 s (7 ticks), spread 0.08,
# 200 rounds and no reload; the rev-up penalty (the 2017 rule): damage
# 50 % until 0.2 s spun then linear to 100 % at 1 s, spread 1.5x to 1x.
# `tf2:minigun` runs the spin.
id = "tf2:tf_weapon_minigun"
base = "tf2:gun"
class = "heavy"
slot = 0

[trigger]
automatic = true
cycle = 0.105
timing = "set"

[magazine]
clip = 200
ammo = "tf2:minigun"
reload = 1.0

[hitscan]
range = 56754.0
pellets = 4
punch_scale = 1.0
spread = { template = 0.08 }

[damage]
amount = 9.0
falloff = 1.0
falloff_step = 1024.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

# Its shots' sound is the spin's loop (`tf2:minigun`).
[sounds]
draw = [[0.0, "tf2:Weapon_Minigun.Draw"]]

[models]
world = "models/weapons/c_models/c_minigun/c_minigun.mdl"
view = "models/weapons/c_models/c_minigun/c_minigun.mdl"
view_right_handed = true

[hud]
name = "Minigun"
icon = "minigun"

[hooks."tf2:gun"]
ramp = 1.0
arms = "heavy"
script = "tf_weapon_minigun"

[hooks."tf2:minigun"]
wind_up = 0.75
fire_step = 0.1
idle_after_fire = 0.2
spool_down = 1.33
penalty_time = 1.0
penalty_flat = 0.2
damage_floor = 0.5
spread_ceiling = 1.5
spun_speed = 110.0
wind_up_sound = "tf2:Weapon_Minigun.WindUp"
spin_sound = "tf2:Weapon_Minigun.Spin"
fire_sound = "tf2:Weapon_Minigun.Fire"
empty_sound = "tf2:Weapon_Minigun.ClipEmpty"
wind_down_sound = "tf2:Weapon_Minigun.WindDown"

# The shot's look: its muzzle flash system (muzzle_flash.pcf), started at
# the gun's `muzzle` attachment (looks.rs).
[hooks."tf2:looks"]
muzzle = "muzzle_minigun"
