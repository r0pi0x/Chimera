# The Pistol as the Scout's secondary (specs/tf2/weapons_more.md 1, 2):
# one bullet of 15 every 0.15 s, spread 0.04 (dead centre after 1.25 s
# without a shot), the distance modifier's near half x1 (150 % at 0
# units), 12 in the clip and 36 carried, the whole clip in 1.005 s.
# The Engineer holds it too when his class is drawn for its rung
# (data/classes.toml): his arms and `pstl_` sequences, the clip in
# 1.035 s (`reload`); he carries the Scout's 36, not his 200.
id = "tf2:tf_weapon_pistol_scout"
base = "tf2:gun"
class = "pistol"
slot = 1

[trigger]
automatic = true
cycle = 0.15
timing = "set"

[magazine]
clip = 12
ammo = "tf2:pistol_scout"
reload = 1.005
auto_reload = true

[hitscan]
range = 56754.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.04 }

[damage]
amount = 15.0
falloff = 1.0
falloff_step = 1024.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

[sounds]
fire = "tf2:Weapon_Pistol.Single"
empty = "tf2:Weapon_Pistol.ClipEmpty"
reload = [[0.0, "tf2:Weapon_Pistol.ReloadScout"]]
draw = [[0.0, "tf2:Weapon_Pistol.Draw"]]

[models]
world = "models/weapons/c_models/c_pistol/c_pistol.mdl"
view = "models/weapons/c_models/c_pistol/c_pistol.mdl"
view_right_handed = true

[hud]
name = "Pistol"
icon = "pistol_scout"

[hooks."tf2:gun"]
ramp = 1.0
arms = "scout"
script = "tf_weapon_pistol_scout"
first_pellet_pause = 1.25
reload = { scout = 1.005, engineer = 1.035 }

# The shot's looks (specs/tf2/effects.md 1, 2, 6; looks.rs): its muzzle
# flash system (muzzle_flash.pcf) at the gun's `muzzle` attachment, and
# its tracer (bullet_tracers.pcf, `_red`/`_blue` added) every 2nd bullet
# of the shared count.
[hooks."tf2:looks"]
muzzle = "muzzle_pistol"
tracer = "bullet_pistol_tracer01"
