# The Sniper Rifle, the Sniper's primary (specs/tf2/weapons_more.md 1,
# 3): one bullet every 1.5 s, no spread, 25 rounds and no reload, no
# distance modifier. attack2 scopes in (field of view 20, the holder at
# 80 units/s, the view model hidden); after a scoped shot the scope stays
# 0.5 s, drops, and comes back 1.4 s after the shot (auto re-zoom; its
# timing is `tf2:sniper`'s: weapons_more.md's corrections from the SDK);
# a jump drops it. Scoped, the damage charges from 50 to 150 (50/s, 0.3 s
# after a raise, at once after a re-zoom) and a head hit 0.2 s after the
# last zoom change is a crit, x3; unscoped every hit is 50.
id = "tf2:tf_weapon_sniperrifle"
base = "tf2:gun"
class = "sniper"
slot = 0

[trigger]
automatic = true
cycle = 1.5
timing = "set"

[magazine]
clip = 25
ammo = "tf2:sniperrifle"
reload = 1.0

[hitscan]
range = 56754.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.0 }

[damage]
amount = 50.0
falloff = 1.0
falloff_step = 1024.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

[alt]
kind = "scope"
fov = [20.0]
max_speed = 80.0
unzoom_after_shot = false
overlay = true
step = 0.3

[sounds]
fire = "tf2:Weapon_SniperRifle.Single"
empty = "tf2:Weapon_SniperRifle.ClipEmpty"
draw = [[0.0, "tf2:Weapon_SniperRifle.Draw"]]

[models]
world = "models/weapons/c_models/c_sniperrifle/c_sniperrifle.mdl"
view = "models/weapons/c_models/c_sniperrifle/c_sniperrifle.mdl"
view_right_handed = true

[hud]
name = "Sniper Rifle"
icon = "sniperrifle"

[hooks."tf2:gun"]
ramp = 1.0
arms = "sniper"
script = "tf_weapon_sniperrifle"
flat = true

[hooks."tf2:sniper"]
base = 50.0
charge_max = 150.0
charge_rate = 50.0
charge_delay = 0.3
headshot_delay = 0.2
headshot = 3.0
drop_after = 0.5
rezoom_after = 1.4
toggle_block = 0.1
unscoped_block = 1.6667
headshot_icon = "headshot"
