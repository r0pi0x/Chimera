# The Heavy's lunchbox class (`tf_weapon_lunchbox`,
# specs/tf2/batch2b_mechanics.md 11): no stock weapon of its own, the base
# the Sandvich, the Dalokohs Bar, the Second Banana and the Buffalo Steak
# Sandvich are built over (data/items.toml `[bases]`; `items::docs` merges
# the item's `set_weapon_mode` table below and its attributes). Attack
# eats: a 4.25 s taunt (no moving, no switching), the heal in four steps
# at 1, 2, 3 and 4 s, then the primary is drawn; attack2 with a full
# meter throws it as a medium health kit (half a teammate's max health);
# the meter refills over `item_meter_charge_rate` seconds
# (`items::consumables`).
id = "tf2:tf_weapon_lunchbox"
base = "tf2:base"
abstract = true
slot = 1
draw = 0.5

[hud]
name = "Lunchbox"

[hooks."tf2:gun"]
ramp = 1.0
flat = true
arms = "heavy"
script = "tf_weapon_lunchbox"

[hooks."tf2:consumable"]
kind = "lunch"
label = "FOOD"
recharge = 30.0
taunt = 4.25
steps = [1.0, 2.0, 3.0, 4.0]
heal = 75.0
throw_speed = 490.0
kit_share = 0.5

# By `set_weapon_mode`: 1 and 7 the Dalokohs Bar and the Fishcake (25 a
# step, max health +50 from the first), 2 the Buffalo Steak Sandvich (no
# heal; from 1 s for 19 s the mini-crit buff, melee only, speed x1.3).
[hooks."tf2:consumable".modes.1]
heal = 25.0
max_health = 50.0
[hooks."tf2:consumable".modes.7]
heal = 25.0
max_health = 50.0
[hooks."tf2:consumable".modes.2]
heal = 0.0
buff = true
effect = 19.0
effect_from = 1.0
speed = 1.3
melee_only = true
