# The Shotgun, the Engineer's primary and the Soldier's, Pyro's and
# Heavy's secondary (specs/tf2/weapons.md 1, 4, 6; docs/plans/active/
# tf2.md decision 6: its rung's class is drawn from the four,
# data/classes.toml; `arms` is its own, the Engineer's): 10
# pellets of 6, spread 0.0675 (the first pellet dead centre after a
# pause), 0.625 s between shots, 6 in the clip and 32 carried, shells
# one at a time: the start by the holder's class (`reload_start`), then
# 0.5 each.
id = "tf2:tf_weapon_shotgun_primary"
base = "tf2:gun"
class = "shotgun"
slot = 0

[trigger]
automatic = true
cycle = 0.625
timing = "set"

[magazine]
clip = 6
ammo = "tf2:shotgun"
reload = 0.5
auto_reload = true
# cl_autoreload 1 (weapons.md 4, step 4): a clip not full reloads with neither attack held.
reload_when_idle = true
shells = { start = 0.3333, insert = 0.5, back_to_back = true, from_tick = true, start_interruptible = true }

[hitscan]
range = 56754.0
pellets = 10
punch_scale = 1.0
spread = { template = 0.0675 }

[damage]
amount = 6.0
falloff = 1.0
falloff_step = 1024.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

[sounds]
fire = "tf2:Weapon_Shotgun.Single"
empty = "tf2:Weapon_Shotgun.Empty"
reload = [[0.0, "tf2:Weapon_Shotgun.Reload"]]
draw = [[0.0, "tf2:Weapon_Shotgun.Draw"]]

[models]
world = "models/weapons/c_models/c_shotgun/c_shotgun.mdl"
view = "models/weapons/c_models/c_shotgun/c_shotgun.mdl"
view_right_handed = true

[hud]
name = "Shotgun"
icon = "shotgun_primary"

[hooks."tf2:gun"]
ramp = 1.0
arms = "engineer"
script = "tf_weapon_shotgun_primary"
reload_start = { soldier = 0.4667, pyro = 0.5, heavy = 0.3333, engineer = 0.3333 }

# The shot's looks (specs/tf2/effects.md 1, 2, 6; looks.rs): its muzzle
# flash system (muzzle_flash.pcf) at the gun's `muzzle` attachment, and
# its tracer (bullet_tracers.pcf, `_red`/`_blue` added) every 2nd bullet
# of the shared count.
[hooks."tf2:looks"]
muzzle = "muzzle_shotgun"
tracer = "bullet_shotgun_tracer01"
