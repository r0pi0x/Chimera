# The Flame Thrower, the Pyro's primary (specs/tf2/weapons_more.md 1, 7
# and its corrections from the SDK): while attack is held a flame point
# every 0.02 s (every 2 ticks), 0.28 ammo each (about 9.3 a second of
# 200, no reload). Each point (`tf2:flame`) flies from 40 forward, 5 right
# of the eye at 2450 slowing by 8.5 a second (about 340 units of reach),
# lives 0.6 +- 0.1 s, and hits an enemy at most every 0.075 s for
# max(1, 13 x the age factor (1 to 0.5 at half its life) x the heat factor
# (0.5 to 1 over heat 10 to 50)), setting him burning: 3 s, + 0.4 s a
# hit, at most 10, 4 every 0.5 s.
id = "tf2:tf_weapon_flamethrower"
base = "tf2:base"
class = "flamethrower"
slot = 0
draw = 0.5

[trigger]
automatic = true
cycle = 0.02
timing = "set"

[magazine]
clip = 200
ammo = "tf2:flame"
reload = 1.0

# Without [damage] the frame traces nothing: `tf2:flame` hurts.
[hitscan]
range = 350.0
pellets = 1
punch_scale = 1.0
spread = { template = 0.0 }

[sounds]
# The draw's sounds are the owner's view model's animation sound events
# (specs/tf2/viewmodel_sounds.md, weapons_stock.md 8.1; view.rs).

[models]
world = "models/weapons/c_models/c_flamethrower/c_flamethrower.mdl"
view = "models/weapons/c_models/c_flamethrower/c_flamethrower.mdl"
view_right_handed = true

[hud]
name = "Flame Thrower"
icon = "flamethrower"

[hooks."tf2:gun"]
ramp = 1.0
arms = "pyro"
script = "tf_weapon_flamethrower"

[hooks."tf2:flame"]
damage = 13.0
emit = 0.02
ammo_rate = 14.0
speed = 2450.0
drag = 8.5
drift = 50.0
origin = [40.0, 5.0]
spread = 2.8
life = 0.6
life_jitter = 0.1
max_points = 30
size = 12.0
hit_interval = 0.075
age_floor = 0.5
heat_floor = 0.5
heat_low = 10.0
heat_high = 50.0
heat_decay = 1.25
fresh = 0.02
min_damage = 1.0
burn_damage = 4.0
burn_interval = 0.5
burn_start = 3.0
burn_add = 0.4
burn_max = 10.0
pyro_burn = 0.25
start_sound = "tf2:Weapon_FlameThrower.FireStart"
loop_sound = "tf2:Weapon_FlameThrower.FireLoop"
loop_crit_sound = "tf2:Weapon_FlameThrower.FireLoopCrit"
# A burst's sounds (specs/tf2/effects.md 14.2): the start fading 1 -> 0
# and the loop 0 -> 1 in straight lines over `burst_fade`; the release
# cuts both and plays the end (the stock gun's `.WindDown`) and the pilot
# light (a wave played once, not looped), also played at each draw.
end_sound = "tf2:Weapon_FlameThrower.WindDown"
hit_sound = "tf2:Weapon_FlameThrower.FireHit"
pilot_sound = "tf2:Weapon_FlameThrower.PilotLoop"
burst_fade = 3.5

# Attack2's airblast (specs/tf2/weapons_more.md 7.4; airblast.rs): 20 ammo,
# the next in 0.75 s, the next flame in 1.0 s, not under water. A sphere of
# 128 centred 128 ahead of the eye (seen from it); enemies also in a 35
# degree cone 256 long. Enemies pushed 600 (`tf_airblast_cray_power`)
# along the aim's pitch at the yaw to them, a speed toward the Pyro
# mirrored (x 2) with half its cost off, standing ones bounced off the
# ground (a 5-unit sweep) and lifted at least 100; no footing 0.5 s
# (sliding at 0.1 x friction from 50 units/s), air control 0.25 x and air
# friction 0.75 x until landing; a 10-15 degree view punch. Projectiles
# keep their speed toward the aim point; a stuck sticky is knocked loose
# at 2000 and doesn't stick for 1 s.
[hooks."tf2:flame".airblast]
cost = 20
refire = 0.75
flame_after = 1.0
reach = 128.0
cone = 35.0
power = 600.0
reflect = 2.0
cost_coeff = 0.5
ground_min_z = 100.0
ground_probe = 5.0
punch = [10.0, 15.0]
no_footing = 0.5
slide_speed = 50.0
slide_friction = 0.1
air_control = 0.25
air_friction = 0.75
sticky_push = 2000.0
no_restick = 1.0
sound = "tf2:Weapon_FlameThrower.AirBurstAttack"
deflect_sound = "tf2:Weapon_FlameThrower.AirBurstAttackDeflect"
impact_sound = "tf2:TFPlayer.AirBlastImpact"
flame_out_sound = "tf2:TFPlayer.FlameOut"
# A teammate put out heals the Pyro 20 (batch3b_mechanics.md 5, data).
extinguish_heal = 20.0

# The stream (specs/tf2/flames.md 3): one `new_flame` per burst at the
# muzzle, its sprites riding the flame points (control points 1-30); a
# crit's by team, under water's.
[hooks."tf2:looks"]
stream = { system = "new_flame", crit = "new_flame_crit", under_water = "flamethrower_underwater", burst_gap = 0.1 }
# The airblast's look (flames.md 3.1.1) on the muzzle, and each deflected
# projectile's (weapons_more.md 7.4).
airblast = "pyro_blast"
deflect = "deflect_fx"
