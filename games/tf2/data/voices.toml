# TF2's player voices (specs/tf2/voices.md; `game::voices`): per class,
# the pain lines' scene lengths (the gap before the next pain line,
# spec 2.4) and the kill rules (spec 4.3, 4.4, Appendix A), best score
# first: the first rule that passes speaks. Entry names are the game's
# sound script entries, played from the player's own install.
#
# A kill rule: `when` (any, many: 2+ recent kills, very_many: 4+, melee,
# rifle_headshot, rifle, spy_victim, dominated, revenge), `slot` (the
# killing gun's slot it needs: 0 primary, 1 secondary), `chance` (passes
# when the draw r in 0..=100 is above it: 70 is the spec's 30 %), `unless`
# (contexts that must be unset), `sets` (contexts set: name, seconds),
# `groups` (one drawn; its `lines`, after `predelay` s).

[classes.scout]
speaker = "Scout"
pain = [0.321, 0.593, 0.396, 0.37, 0.639, 0.382, 0.354, 0.36]

[[classes.scout.kill]]
when = "revenge"
sets = [["ScoutKillSpeech", 10.0], ["IsDominating", 10.0]]
[[classes.scout.kill.groups]]
predelay = 2.5
lines = ["Scout.Award12", "Scout.Cheers02", "Scout.Misc02", "Scout.Misc09", "Scout.NiceShot02", "Scout.Revenge01", "Scout.Revenge02", "Scout.Revenge03", "Scout.Revenge04", "Scout.Revenge05", "Scout.Revenge06", "Scout.Revenge07", "Scout.Revenge08", "Scout.Revenge09", "Scout.SpecialCompleted12"]

[[classes.scout.kill]]
when = "dominated"
chance = 70
sets = [["ScoutKillSpeech", 10.0], ["IsDominating", 10.0]]
[[classes.scout.kill.groups]]
predelay = 2.5
lines = ["Scout.Domination02", "Scout.Misc07", "Scout.Domination15", "Scout.Domination16"]

[[classes.scout.kill]]
when = "melee"
chance = 70
unless = ["ScoutKillSpeechMelee"]
sets = [["ScoutKillSpeechMelee", 10.0]]
[[classes.scout.kill.groups]]
lines = ["Scout.SpecialCompleted04", "Scout.SpecialCompleted06", "Scout.SpecialCompleted07", "Scout.SpecialCompleted09", "Scout.Taunts11"]
[[classes.scout.kill.groups]]
lines = ["Scout.SpecialCompleted02", "Scout.SpecialCompleted03", "Scout.SpecialCompleted11", "Scout.Taunts08"]

[[classes.scout.kill]]
when = "many"
slot = 0
chance = 70
unless = ["ScoutKillSpeech"]
sets = [["ScoutKillSpeech", 5.0]]
[[classes.scout.kill.groups]]
lines = ["Scout.GoodJob02", "Scout.LaughEvil02", "Scout.LaughHappy01", "Scout.LaughHappy02", "Scout.LaughHappy03", "Scout.LaughHappy04", "Scout.LaughLong01", "Scout.LaughLong02", "Scout.Taunts04", "Scout.Taunts16"]

