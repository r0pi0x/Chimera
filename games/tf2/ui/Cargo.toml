[package]
name = "tf2_ui"
version = "0.1.0"
description = "Team Fortress 2's front end on the client shell: its HUD and its guns' kill icons, above the game's simulation (`tf2`)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The game's simulation and the client shell; never another game, its
# front end or an app (checks/tests/it/architecture.rs, `layers_follow_paths`:
# a front end, games/<id>/ui, builds on its own game only). Its own crate
# so that `tf2` and its tests build without the shell, and a client-side
# edit selects this crate's tests, not the simulation's
# (docs/plans/active/architecture-for-iteration.md, stage 1).
[dependencies]
tf2.workspace = true
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_client.workspace = true
chimera_net.workspace = true
avian3d.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, as every
# build with the presentation has them, so `cargo test -p tf2_ui` shares the
# clients' builds (`selections_share_one_build`).
[dev-dependencies]
chimera_world = { workspace = true, features = ["render"] }
# TF2's particle systems run in the presentation (tests/it/heavy/particles.rs).
chimera_present.workspace = true
source_engine.workspace = true
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

# The integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on).
dev = ["tf2/dev", "chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_client/dev", "chimera_net/dev", "chimera_present/dev", "source_engine/dev"]
