[package]
name = "hl2dm_ui"
version = "0.1.0"
description = "Half-Life 2: Deathmatch's front end on the client shell: its HUD, menus, kill icons and quick info, above the game's simulation (`hl2dm`)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The game's simulation, Source's shared crates and the client shell with
# the presentation; never another game, its front end or an app
# (checks/tests/it/architecture.rs, `layers_follow_paths`). Its own crate so
# that `hl2dm` and its tests build without the shell, and a client-side edit
# selects this crate's tests, not the simulation's
# (docs/plans/active/architecture-for-iteration.md, stage 1).
[dependencies]
hl2dm.workspace = true
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_net.workspace = true
chimera_client.workspace = true
# The HUD's lights and the presentation it draws with.
chimera_present.workspace = true
source_engine.workspace = true
source_formats.workspace = true
# GameUI's main and Esc menus and their dialogs, shared with CS:S.
source_gameui.workspace = true
avian3d.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, as every
# build with the presentation has them, so `cargo test -p hl2dm_ui` shares
# the clients' builds (`selections_share_one_build`).
[dev-dependencies]
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

# The integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on).
dev = ["hl2dm/dev", "chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "chimera_client/dev", "chimera_present/dev", "source_engine/dev", "source_gameui/dev", "source_formats/dev"]
