# HL2:DM's ammo types (specs/hl2dm/weapons.md 4, source_deltas.md's ammo
# table): the most of each a player carries. A weapon's clip is apart
# from it. The projectiles' types (AR2AltFire, SMG1_Grenade, RPG_Round,
# Grenade, slam) are counted by their weapons' own hooks
# (`launch::Hl2Rounds`), XBowBolt by the crossbow's magazine.
units = { length = 0.0254 }

[ammo."hl2dm:pistol"]
max = 150

[ammo."hl2dm:357"]
max = 12

[ammo."hl2dm:smg1"]
max = 225

[ammo."hl2dm:ar2"]
max = 60

[ammo."hl2dm:buckshot"]
max = 30

# The ammo types of the weapons still to come (M5, M6), carried already:
# ammo boxes and crates give them (specs/hl2dm/maps_entities.md 1, 3).
[ammo."hl2dm:xbowbolt"]
max = 10

[ammo."hl2dm:rpg_round"]
max = 3

[ammo."hl2dm:smg1_grenade"]
max = 3

[ammo."hl2dm:ar2altfire"]
max = 3

[ammo."hl2dm:grenade"]
max = 5

[ammo."hl2dm:slam"]
max = 5
