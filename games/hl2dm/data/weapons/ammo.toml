# HL2:DM's ammo types (specs/hl2dm/weapons.md 4, source_deltas.md's ammo
# table): the most of each a player carries. A weapon's clip is apart
# from it. The projectiles' types (AR2AltFire, SMG1_Grenade, RPG_Round,
# Grenade, slam) are counted by their weapons' own hooks
# (`launch::Hl2Rounds`), XBowBolt by the crossbow's magazine.
units = { length = 0.0254 }

[ammo."hl2dm:pistol"]
max = 150

[ammo."hl2dm:357"]
max = 12

[ammo."hl2dm:smg1"]
max = 225

[ammo."hl2dm:ar2"]
max = 60

[ammo."hl2dm:buckshot"]
max = 30

[ammo."hl2dm:xbowbolt"]
max = 10
