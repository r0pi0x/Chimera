# The AR2 (specs/hl2dm/weapons.md 7.3): 11 a bullet, 0.1 s accumulating
# (ticks 7, 7, 6), a 3 degree cone, the machine gun's kick (8 degrees,
# over 5 s held), 30 rounds, 60 carried; a new one gives a full clip and
# 30 more (default_clip 60). Its energy ball on attack2 (projectiles.md
# 5): `hl2dm:combine_ball`. Script:
# bucket 2 position 1, weight 5, clip 30.
id = "hl2dm:weapon_ar2"
base = "hl2dm:gun"
class = "rifle"
slot = 2
draw = 0.8333
weight = 5

[magazine]
clip = 30
ammo = "hl2dm:ar2"
# 105 ticks.
reload = 1.5667

[hitscan]
spread = { cone = 0.02618 }

[damage]
amount = 11.0

[sounds]
fire = "Weapon_AR2.Single"
empty = "Weapon_IRifle.Empty"
reload = [[0.0, "Weapon_AR2.Reload"]]

[models]
world = "models/weapons/w_irifle.mdl"
view = "models/weapons/v_irifle.mdl"
view_right_handed = true

[hud]
name = "#HL2_Pulse_Rifle"
icon = "ar2"

[hooks."hl2dm:inventory"]
position = 1
default_clip = 60

[hooks."hl2dm:machine_gun"]
max = 8.0
slide = 5.0

# The energy ball (projectiles.md 5): 3 carried, none at spawn; charge
# 0.5 s (launch strictly after), busy 0.7, next primary 0.5, next
# secondary 1.0; a 10-unit sphere at 1000 units/s kept after every
# contact, 4 s of life, 1000 crush + dissolve a touch; punch pitch
# -12..-8, yaw 1..2 (whole degrees); seeks after world bounces 0.25 s
# apart: within cos 0.966 (15 degrees) in a 2048-unit sweep of +-256, or
# after a kill within 512 in front (`sk_combine_ball_search_radius`).
[hooks."hl2dm:combine_ball"]
ammo = "hl2dm:ar2altfire"
max = 3
charge = 0.5
busy = 0.7
primary = 0.5
secondary = 1.0
dry = 0.5
speed = 1000.0
radius = 10.0
mass = 150.0
life = 4.0
damage = 1000.0
punch_pitch = [-12, -8]
punch_yaw = [1, 2]
bounce_gap = 0.25
seek_cos = 0.966
seek_reach = 2048.0
seek_half = 256.0
seek_kill_radius = 512.0
charge_sound = "Weapon_CombineGuard.Special1"
sound = "Weapon_IRifle.Single"
launch_sound = "NPC_CombineBall.Launch"
empty = "Weapon_IRifle.Empty"
impact_sound = "NPC_CombineBall.Impact"
explode_sound = "NPC_CombineBall.Explosion"

# Eyes under water: the empty sound and 0.2 s (14 ticks) before the next
# try, no shot (weapons.md 5).
[hooks."hl2dm:dry_under_water"]
wait = 0.2

# The vents open with the held shots: VentPoses = shots / 5, at most 1
# (weapons.md 7.3).
[hooks."hl2dm:vent"]
pose = "VentPoses"
shots = 5
