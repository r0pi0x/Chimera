# The gravity gun (specs/hl2dm/gravity_gun.md, H5): primary punts what it
# points at within 250 (15000 + 600 x its mass, mass capped at 250, along
# the view; a downward punt's z x -0.65), every 0.5 s; secondary grabs a
# movable object of at most 250 kg within 250 (a line, then a +-4 box,
# then a 0.97 cone), pulls one up to 1000 away every 0.1 s (4000, less
# under 50 kg); held about 24 + 22.6 + its depth in front of the eye
# (pitch clamped to 75), 1 kg, damping 10, at most 1000 in/s; primary
# launches it at 1500 (less above 100 kg), a fresh secondary drops it
# (285 in/s, 720 deg/s at most). Usable the tick it is drawn (deploy sets
# the timers to now). Script: bucket 0 position 2, weight 0, no ammo,
# autoswitchto and autoswitchfrom 0.
id = "hl2dm:weapon_physcannon"
base = "hl2dm:base"
slot = 0
# The draw animation (v_physcannon.mdl, 22 ticks) doesn't delay use.
draw = 0.0
weight = 0
undroppable = true

[models]
world = "models/weapons/w_physics.mdl"
view = "models/weapons/v_physcannon.mdl"
view_right_handed = true

[hud]
name = "#HL2_GravityGun"
icon = "physcannon"

[hooks."hl2dm:inventory"]
position = 2
autoswitchto = false
autoswitchfrom = false

[hooks."hl2dm:physcannon"]
