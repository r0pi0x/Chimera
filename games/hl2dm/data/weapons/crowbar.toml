# The crowbar (specs/hl2dm/weapons.md 11): 25 a hit, every 0.4 s hit or
# miss, a 75-unit line then a +-16 box swept 47.288 units counting only
# targets whose origin is within 45 degrees of the view, the collision box
# (no hitgroups, no head bonus), no view punch, never dropped; attack2
# does nothing. A citizen's (the spawn's melee by model kind,
# `weapons::melee_for`). Script: bucket 0 position 0, weight 0.
id = "hl2dm:weapon_crowbar"
base = "hl2dm:base"
slot = 0
# v_crowbar.mdl's draw (63 ticks).
draw = 0.9333
weight = 0
undroppable = true

[melee.primary]
range = 75.0
hull = 16.0
# 75 - 1.732 x 16.
hull_reach = 47.288
facing_cos = 0.70721
# A box hit is refined: a line to twice its distance, else its 8 corners
# there (weapons.md 11).
refine = true
damage = 25.0
hitgroups = false
hit_refire = 0.4
miss_refire = 0.4
miss_refire_other = 0.4
# 300 kg x in/s a point: 7500 (weapons.md 11).
force = 7500.0
kind = "melee"
# The suit's rule (see `_gun.toml`).
armor_ratio = 1.0
quantum = 0.0
# Every swing's sound; the hit's own is the surface's impact.
sound_hit = "Weapon_Crowbar.Single"
sound_hit_world = "Weapon_Crowbar.Single"
sound_miss = "Weapon_Crowbar.Single"

[models]
world = "models/weapons/w_crowbar.mdl"
view = "models/weapons/v_crowbar.mdl"
view_right_handed = true

[hud]
name = "#HL2_Crowbar"
icon = "crowbar"

[hooks."hl2dm:inventory"]
position = 0
