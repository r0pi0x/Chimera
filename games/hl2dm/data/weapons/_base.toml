# HL2:DM's weapons' shared base: Source units (inches) and hit points
# (specs/hl2dm/weapons.md, "Units and conventions"). The format:
# docs/weapon-data.md. Each weapon's numbers are the spec's (its weapon
# scripts' table, H0 "Weapon scripts", and the view models' sequence
# lengths, weapons.md 2 and 7); the install's own scripts
# (`scripts/weapon_<name>.txt`, plain text) are read by
# `game::scripts` and checked against these files by
# tests/it/heavy/scripts.rs.
id = "hl2dm:base"
abstract = true
units = { length = 0.0254, damage = 0.01 }

# Whom a shot or a primary swing rewinds (weapons.md 12): only with attack
# held or a shot in the last 5 commands, then each player within 1.5 x
# their max speed x sv_maxunlag, or within 45 degrees of the view.
[lag_compensation]
fired_within = 5
reach = 1.5
view_cos = 0.707107
