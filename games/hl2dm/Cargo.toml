[package]
name = "hl2dm"
version = "0.1.0"
description = "Half-Life 2: Deathmatch as a game crate: its install, maps, movement, suit, and bullet and melee weapons so far (docs/plans/active/hl2dm.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The layers this crate builds on, beside Chimera (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
loaders = ["source"]

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates and Source's shared crates; never `mashup`, another
# game (`cs_source`, `combat_arms`) or an app, and the presentation
# (`chimera_present`) and the shell only for a front end to come
# (checks/tests/it/architecture.rs checks it). Same versions and features
# as the other members' (workspace dependencies), so `cargo test -p
# hl2dm` reuses the workspace's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
# Source engine behaviour shared with CS:S (the search path, map lists,
# the maps' conversion).
source_engine.workspace = true
# The install's strings (weapon names: `weapons::display_names`).
source_formats.workspace = true
# Source's map logic (entity I/O, triggers, movers): part of the game's
# simulation (`SimPlugins`).
source_logic.workspace = true
# Its part of the network: the player models worn (`bodies`).
chimera_net.workspace = true
bevy_replicon.workspace = true
bevy.workspace = true
# The suit's line-of-sight traces (pickups, chargers).
avian3d.workspace = true
vbsp.workspace = true
# Weapon hooks' parameters (`game::weapons`), the suit's predicted state
# (`Suit`).
serde.workspace = true
# The item data (data/items.toml).
toml.workspace = true
# The front end (`ui`, the `ui` feature): the client shell and the
# presentation it draws with.
chimera_client = { workspace = true, optional = true }
chimera_present = { workspace = true, optional = true }
# GameUI's main and Esc menus and their dialogs, shared with CS:S.
source_gameui = { workspace = true, optional = true }
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, for this
# crate's own tests only (the dedicated server builds without them), so
# `cargo test -p hl2dm` shares the clients' builds of Bevy (hakari.toml).
[dev-dependencies]
# This crate with its front end (`ui`), as the apps build it: its tests then
# use the one build of it every other selection uses (the workspace's, the
# hooks', `cargo run`'s) instead of a second one without the front end, with
# its own incremental cache (docs/performance.md, "Iteration speed"). That
# the simulation builds without `ui` the dedicated server's build checks
# (tools/post-push-tests.sh) and architecture.rs (`game_parts_do_not_use_their_ui`).
hl2dm = { workspace = true, features = ["ui"] }
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it (docs/performance.md, "Iteration speed").
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it:
# without this line a build that leaves the client shell out builds another
# bevy_winit, and with it another Bevy and every crate of ours.
bevy_winit.workspace = true
# The test kit's readers (`chimera_sim::testkit`: what is in hand, aim).
chimera_sim = { workspace = true, features = ["testkit"] }
# Digests of converted maps (tests/it/heavy/map_cache.rs).
postcard.workspace = true
sha2.workspace = true

# The integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

# The front end's (tests/ui/): built with `ui` only.
[[test]]
name = "ui"
path = "tests/ui/main.rs"
required-features = ["ui"]

[features]
# HL2:DM's front end (`ui`): its HUD on the client shell. The game's client
# turns it on, and this crate's own tests (the dev-dependency on itself); the
# dedicated server builds without.
ui = ["dep:chimera_client", "dep:chimera_present", "dep:source_gameui"]
# Bevy as a dynamic library, as an app's `dev` (which turns this on):
# `cargo test -p hl2dm --features dev` shares the apps' Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "source_engine/dev", "source_logic/dev", "chimera_client?/dev", "chimera_present?/dev", "source_gameui?/dev", "source_formats/dev"]
