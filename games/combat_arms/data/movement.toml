# Combat Arms player movement: our defaults, from
# specs/combat_arms/movement.md ("Constants"); the section each value comes
# from is in its comment. Distances are LithTech world units ("u"), +Y up;
# speeds u/s, accelerations u/s^2, times s. Read by
# games/combat_arms/src/game/movement.rs (`MovementData`). When the
# install's attribute data can be read (attribute_data.md), its values
# override the character and gear ones here.
#
# The tick (15 ms, Constants "tick") is the game's tick:
# `game::TICK_INTERVAL`.

# Ours, not the spec's: engine meters per world unit. The spec keeps world
# units (its open question 3, answered): the game's HUD calls 40 u a
# metre, but its bodies aren't built to that (a 100 u hull would be 2.5 m),
# so for mixing with other games we scale by body size (movement.md "World
# scale": 1 u = 0.0185 m +-0.001): the 100 u standing hull is 1.85 m.
meters_per_unit = 0.0185
# Ours: the gap the collision mover keeps from surfaces (u).
skin = 0.1
# Eye (camera) height: the eye sits eye_offset x the standing half-height
# above the hull's centre (ChaseCamOffset), plus eye_crouch_offset x the
# crouch rate (DuckDownCamOffSet): 83 u above the feet standing, 60 u
# crouched with the fallback boxes.
eye_offset = 0.66
eye_crouch_offset = -13.0
# Eye height: the camera's upward smoothing (CameraMoveUpTime s,
# CameraMoveUpMinVel u/s, CameraMoveMaxYDiff u).
camera_rise_time = 0.1
camera_rise_min_speed = 140.0
camera_rise_max_lag = 30.0
# Units and conventions: every in-game distance readout shows world units
# divided by 40 as metres.
hud_units_per_metre = 40.0

# Constants: console variables FRunVel, BRunVel, SRunVel, WalkVel, DuckVel,
# JumpVel; the ladder limit.
run_forward = 285.0
run_back = 285.0
run_strafe = 285.0
walk = 70.0
crouch = 50.0
jump = 330.0
ladder = 200.0
# Constants: PlayerGravity (along Y).
gravity = -1100.0
# Constants: ground friction coefficient k (1/s).
friction = 5.0
# Constants: BaseMoveAccel, StartAccel, MaxAccel, AccelInc (u/s^3).
base_accel = 3000.0
start_accel = 500.0
max_accel = 3000.0
accel_ramp = 6000.0
# Constants: crouch accel factor, InAirAccelMultiplier.
crouch_accel_factor = 0.5
in_air_accel_factor = 0.1
# Constants: SlideToStopTime (s), stop snap speed (u/s).
slide_to_stop_time = 0.1
stop_snap_speed = 5.0
# Constants: engine rest threshold (u^2/s^2 on |v|^2 and |a|^2).
rest_threshold = 0.1
# Constants: jump factor after a jump, its recovery (1/s), jump stance
# tolerance (u).
jump_factor_after_jump = 0.3
jump_factor_recovery = 1.2
jump_stance_tolerance = 0.5
# Constants: walkable normal (normal.y) of the integrator and the mover,
# and the movement's own "on ground" threshold (Corrections 18);
# StairStepHeight (+0.5 in the mover), standing probe (fraction of the
# half-height).
walkable_normal = 0.7071
on_ground_normal = 0.707
stair_step = 30.5
standing_probe = 0.02
# Constants: fallback half-extents (x, y, z) of the stand and crouch boxes
# (the models' real boxes: open question 1).
stand_half_extents = [15.0, 50.0, 15.0]
crouch_half_extents = [15.0, 40.0, 15.0]
# Constants: crouch release delay (s, wall clock).
crouch_release_delay = 0.1
# Constants: fall damage start and full heights (u), damage at full height
# (HP), fall minimum (u).
fall_damage_start = 300.0
fall_damage_full = 700.0
fall_damage_at_full = 200.0
fall_minimum = 50.0
# Ours: hit points of a full-health player (Chimera's health is 1.0 at full).
health_points = 100.0
# Other modifiers: a volume's viscosity removes viscosity_max x its
# `Viscosity` of speed per second (u/s^2). The movement spec names
# viscosity_max without a value; this is the engine's figure from
# grenades.md section 7 (5000 x c).
viscosity_max = 5000.0
# Constants: viscosity minimum speed (u/s): slower, no viscosity.
viscosity_min_speed = 1.0
# Tick clock, "Client and server": the server's stamina gauge advances by
# each record's duration clamped to this (s); ours advances per tick.
stamina_step_max = 0.1
# Constants: pusher air factor; pusher max upward speed (u/s).
pusher_air_factor = 0.1
pusher_max_up = 100.0

# Crouch-spam penalty: the dedicated server's shipped configuration (the
# "Server config key" table).
[crouch_spam]
duration = 0.1733333
tangents = [3.0, 1.0]
enable_slowdown = true
slowdown_increase_duration = 1.7
slowdown_increase_tangents = [0.5, 3.0]
slowdown_decrease_amount = 0.5
max_slowdown_rate = 5.0
min_slowdown_sp = 0.875
enable_lockout = true
lockout_increase_duration = 1.5
lockout_increase_tangents = [1.0, 1.0]
lockout_decrease_amount = 0.4
# DisableSP_DecreaseAmount_InPenalty (the other *_InPenalty values are
# never used: Quirks).
lockout_decrease_amount_in_penalty = 0.9
decrease_during_jumping_crouch = true
decrease_by_keystroke = true
decrease_exception_no_movement = true
no_movement_time_limit = 0.2
no_movement_deviation_limit = 0.1

# The character: figure type and worn gear (the attribute table). The
# reference character: figure DashSpeed 1.0, the default vest (MovePenalty
# 0.1, DashSpeed 0.4), nothing else worn.
[character.figure]
dash_speed = 1.0
dash_gauge = 30.0
gauge_recovery = 25.0
max_stamina = 100.0
variable_speed = 0.0
variable_weight = 0.0
variable_jump = 0.0
# StiffDuration: lengthens the infection-mode hit knock-back (Other
# modifiers), 0 in the stock data.
stiff_duration = 0.0

[[character.gear]]
name = "default vest"
dash_speed = 0.4
max_stamina = 0.0
move_penalty = 0.1
jump = 0.0
