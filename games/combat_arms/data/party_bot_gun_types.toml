# Combat Arms' bots' gun types for other games' guns when it is a party's
# base game (`game::bundle::BASE`; as data/bots.toml's [gun_types] names
# its own): which AI row (range, reaction, burst) a bot uses with each, so
# its bots fire them in a minigame. Our choice by each gun's kind, not the
# games' data; a gun not listed goes by its class (`bot_gun_type_of`).
"cs_source:weapon_glock" = "Pistol"
"cs_source:weapon_usp" = "Pistol"
"cs_source:weapon_p228" = "Pistol"
"cs_source:weapon_deagle" = "Pistol"
"cs_source:weapon_fiveseven" = "Pistol"
"cs_source:weapon_elite" = "Pistol"
"cs_source:weapon_m3" = "SG"
"cs_source:weapon_xm1014" = "SG"
"cs_source:weapon_mac10" = "Default"
"cs_source:weapon_tmp" = "Default"
"cs_source:weapon_mp5navy" = "Default"
"cs_source:weapon_ump45" = "Default"
"cs_source:weapon_p90" = "Default"
"cs_source:weapon_galil" = "Default"
"cs_source:weapon_famas" = "Default"
"cs_source:weapon_ak47" = "Default"
"cs_source:weapon_m4a1" = "Default"
"cs_source:weapon_sg552" = "Default"
"cs_source:weapon_aug" = "Default"
"cs_source:weapon_scout" = "SR"
"cs_source:weapon_awp" = "SR"
"cs_source:weapon_g3sg1" = "SR"
"cs_source:weapon_sg550" = "SR"
"cs_source:weapon_m249" = "MG"
"cs_source:weapon_knife" = "Knife"
# Halo's grenade rung (its frags thrown on the grenade action, the bots
# pressing it: `weapon::AttackAction`): Combat Arms' throw row, its range
# 300 to 1200 u (about 5.7 to 23 m): a frag's blast reaches 7.6 m.
"halo_ce:frag_grenade" = "ThrowWeapon"
# Combat Arms' auto turret (a placed device on the throw rule, its class
# "launcher"): the throw row, ammunition x1, so a bot on a turret rung gets
# the one turret a player gets (the class's "MG" row's x10 gave it ten).
"combat_arms:auto-turret" = "ThrowWeapon"
