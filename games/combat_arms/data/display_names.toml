# Combat Arms guns' short names (chimera_sim::weapon::names;
# docs/plans/active/gun-display-names.md). A gun's full name is the
# install's own (its shop item's name in the language table); the narrow
# places (callouts, the Tab scoreboard, kill feeds, the match-end rows) show
# a short one. `split = true`: the automatic split derives it (the skin
# before the model and the variant tail after it left out); each entry below
# names guns whose split is wrong or too long: their ids (a `*` matches any
# run of characters) and a `short` name (16 characters at most), or a `full`
# one where the install's string is broken. `gun_names combat_arms` in the
# console lists every gun's full and short name and where each came from.
game = "combat_arms"
split = true

