# Combat Arms' body families (specs/combat_arms/characters.md 13.4,
# 13.7, 13.8), read by game::characters::families: which family a body
# record belongs to (a family naming its body file wins over one naming
# its hit table, `Skeleton`), and how the player driver runs on it.
#
# Per family:
# - files: body files (the name after the folder, any case);
# - tables: hit tables (the record's `Skeleton`);
# - aim: whose seven aim nodes it pitches and twists (0 the male
#   player's, 1 the female's; none: no aim, 13.5);
# - stock_rig: the player tree it shares (0 male, 1 female): until its
#   own body loads it poses on that stock rig;
# - wearable = false: never drawn as a player's body;
# - class / legs: the upper class and leg set it plays whatever is
#   held (13.8: the infected bodies play class 39 on the `V` legs);
# - classes / other_class: the weapon classes it has animations for,
#   and the one it plays for any other gun (13.8, Open question 36);
#   other_class_by_record: the same per record `Name`;
# - hits: the hit reactions' names in place of `D_HIT` / `D_HITT`;
# - death: the death animation it always plays (the records'
#   `UseSpecialDeathAni` wins);
# - boss: a minimal mapping onto a body with no player names (13.8):
#   idle, walk, fire (one name looping while held, or start, loop and
#   end), melee (alt-fire), hit, death; one name on every tracker.

[families.male]
tables = [0]
aim = 0
stock_rig = 0

[families.female]
tables = [1]
# Quirk 12: the female body on the male hit table.
files = ["Light_W_vest.ltb"]
aim = 1
stock_rig = 1

[families.tanker]
tables = [2]
files = ["VIM_F_NM_DF_Tanker_SH.ltb", "CM_Body_Infected_Ship_Captain_KE.ltb", "CM_Body_Infected_Ship_Captain_B_KE.ltb"]
aim = 0
class = 39
legs = 1
hits = ["VD_HIT", "VD_HITT"]
death = "VDIE"

[families.assassin]
tables = [3]
files = ["VIW_F_NM_DF_Assassin_CH.ltb", "CW_VST_TheShining.ltb"]
aim = 1
class = 39
legs = 1
hits = ["VD_HIT", "VD_HITT"]
death = "VDIE"

# The powered suits (13.7): the robot classes; a gun of no suit class
# plays the SMG suit's (the melee record the melee suit's): Open
# question 36's proposal.
[families.small_suit]
tables = [5]
files = ["Suit_small_Base.ltb"]
aim = 0
classes = [58, 59, 60, 61, 62, 66, 67]
other_class = 58
other_class_by_record = { "Powered_Suit_Npc_Melee" = 61, "Powered_Suit_Melee" = 61 }

# The big suit has only the machine-gun and launcher classes; another gun
# plays the machine gun's (ours: the spec proposes nothing for it).
[families.big_suit]
tables = [6]
files = ["Suit_BIG_Base.ltb"]
aim = 0
classes = [63, 64]
other_class = 63

[families.eod_boss]
tables = [7]
files = ["PV_CabinFever2_EOD_Boss_KE.ltb"]
boss = { idle = "ilde", walk = "Walk", fire = ["Attack_L_ST", "Attack_L_LP", "Attack_L_ED"], melee = "Foot_Attack", hit = "Damage_ST", death = "Death" }

