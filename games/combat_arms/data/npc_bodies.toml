# The HQ raid boss's gunship (13.7) is no walking body; neither is the
# tutorial dummy, whose body file the install lacks.
[families.pattern_boss]
tables = [4]
files = ["boss_model.ltb"]
wearable = false

[families.dummy]
tables = [8, 17]
wearable = false

# The robot classes' upper names (13.7), by `AniType`. Per posture five
# names for the directions none, F, B, L, R (diagonals as F and B), and
# its sprint name; `{s}` is the stance (R running or standing, W walking:
# the walk name is used when the library has it); "run|walk" names the
# two forms where they differ otherwise. The right strafe plays the left
# names (Quirk 15).
[robot_classes.58] # SMG suit
aim = ["USMG{s}AmS", "USMG{s}AmF", "USMG{s}AmB", "USMG{s}AmL", "USMG{s}AmL"]
fire = ["USMG{s}FiS", "USMGRFiF", "USMGRFiF", "USMG{s}FiL", "USMG{s}FiL"]
select = ["USMGRSSeS", "USMG{s}SeS", "USMG{s}SeS", "USMG{s}SeS", "USMG{s}SeS"]
reload = ["USMGRSReS", "USMG{s}ReS", "USMG{s}ReS", "USMG{s}ReS", "USMG{s}ReS"]
sprint = { aim = "USMGRRAmF", fire = "USMGRRAmF", select = "USMGRRSeS", reload = "USMGRRReS" }

