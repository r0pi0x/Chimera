# VIP Escort (game_modes_2.md M13; the stock mission files, missions.md
# F4.6, and the VIP data).
[escort]
# The points' and the exit's game type.
family = "VIPEscort"
# [Mission0] VIPSpawn: the object the VIP is teleported to.
vip_spawn = "VipTeleportPoint"
# The objective's EscapeZoneTrigger: the exit's name.
escape_zone = "EscapeZoneTrigger"
# The exit timer (`VipExitTimer` TimeAmount, s from the round's setup); the
# exit opens when the timer stops itself, 1 s after that (its run-out:
# world_objects.md Follow-up (2026-10-31b) 1.1, game_modes_2.md case 54).
exit_time = 60.0
# Its InTimeCommandTime: the helicopter starts to arrive (s).
exit_arrival = 54.0
# VIP_MISSION_END_TIME: the message hold after a deciding event (s).
end_hold = 3.0
# A side swap: the wait after the intermission, then the notice (s).
swap_wait = 3.0
swap_notice = 3.0
# The VIP's weapons ([VIPChangeCharWeapon_0]: primary 91, the G18; ours,
# until the G18 is in our data: the M92FS) and its model's MovePenalty
# (model 87).
vip_weapons = ["combat_arms:beretta_m92fs"]
vip_move_penalty = 0.44

# AI damage (game_modes_2.md Constants (shared)): one non-melee AI hit takes
# at most `ai_damage_cap` health from a player, and `ai_damage_cap_big`
# when the hit was `ai_damage_big` or more (HP).
[ai_damage]
cap = 50.0
cap_big = 990.0
big = 1000.0
