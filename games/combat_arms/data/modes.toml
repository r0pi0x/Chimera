# BaseBankAmount (added at each real round's start and on joining a live
# round), RoundWinBonusAmount, KillBonusAmount, DeathBonusAmount.
base_bank = 1000
round_win_bonus = 500
kill_bonus = 100
death_bonus = 0
# A bar or bag is taken within this distance of the player (u).
