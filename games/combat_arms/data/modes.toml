# The objectives' numbers (Constants (shared) and the mode sections).
[objectives]
# M4: a dropped flag goes home after this, s.
flag_return = 30.0
# M3: the plant: the bomb's fire animation up to its FIRE_KEY (XK-2 fire_0
# 4000 ms, the key at 3904 ms: Open question 4, answered; the HUD's gauge
# shows the 4 s), the defuse when a site gives no DefuseTime, the fuse
# when it gives no DetonateTime, and how far outside a site's box (u, each
# axis) a planter may stand.
bomb_plant = 3.904
bomb_defuse = 7.0
bomb_fuse = 40.0
plant_margin = 50.0
# M10: the mission file's use time of the triggers (s), FlagMoveTime (s)
# and LastOccupyBonus (points).
seize_time = 5.0
flag_move_time = 120.0
last_occupy_bonus = 50
# M8: hosts are picked this long after the round goes live (s), H =
# max(round(N x SelectionRate), MinHostNum) from 4 players; the infected
# heal Heal every period (s) after standing still this long (s; Open
# question 12, answered: a fraction of their maximum hit points); the
# mission file's points.
host_delay = 20.0
selection_rate = 0.2
min_hosts = 2
infected_heal = 0.1
infected_still = 3.0
infected_heal_period = 1.0
human_kills_infected = 3
infected_killed_by_human = -1
infected_infects = 2
humans_win = 10
infected_win = 5
# M7: intel items per round.
intel_count = 5
# M5: the last player wins a round ended by leavers only with more than
# this share of G (rounded) made in kills.
leave_kill_share = 0.1
# M12 (missions.md F4.7, GMS\VTDM.GMS's stock values): the points a death
# is worth by the victim's VIP rank (0 none, 1 copper/bronze, 2 silver, 3
# gold), and the VIP tables: [TargetPoint, VIPs for a team of 1..8
# players]; G uses the first table with TargetPoint >= G.
vip_points = [1, 3, 5, 7]
vip_tables = [[60, [0, 0, 0, 0, 0, 1, 1, 2]], [1000, [0, 1, 1, 1, 2, 2, 2, 3]]]
# M7 (missions.md F4.2): Stage2PlayTime and AgentCameraHoldingTime, s.
stage2_time = 180.0
agent_camera_hold = 5.0
# M14 (missions.md F4.8): the stock default ladders of GMS\VWRM.GMS, per
# goal G: steps [kills, weapon id as stored, WeaponType]; a roll below
# `ladder_percent` (of 0..100) takes the step's weapon, else the player
# keeps their own.
ladder_percent = 80
ladders = [
    { goal = 15, steps = [[0, 325, 0], [4, 337, 1], [7, 35, 3], [10, 125, 26], [12, 257, 2], [13, 110, 4], [14, 84, 6]] },
    { goal = 30, steps = [[0, 325, 0], [4, 255, 0], [7, 337, 1], [11, 203, 1], [15, 35, 3], [18, 220, 3], [21, 295, 26], [23, 125, 26], [25, 257, 2], [27, 110, 4], [29, 84, 6]] },
    { goal = 45, steps = [[0, 325, 0], [4, 255, 0], [8, 351, 0], [11, 337, 1], [15, 203, 1], [19, 152, 1], [22, 35, 3], [26, 220, 3], [29, 386, 3], [32, 295, 26], [35, 125, 26], [38, 257, 2], [41, 110, 4], [44, 84, 6]] },
]

# S12 (Open question 27): the mutation boxes' items' pick weights by the
# toucher's condition [lose, even, win]: 0 speed, 1 accuracy, 2 damage and
# rate, 3 toughness, 4 ammunition, 5 health, 6 heal, 7 invulnerable, 8
# infected host, 9 spy (the weights favour the winners, Quirk 15).
mutation_weights = [
    [10, 10, 10],
    [5, 10, 20],
    [10, 10, 10],
    [10, 10, 10],
    [10, 10, 10],
    [10, 10, 10],
    [10, 10, 10],
    [5, 10, 20],
