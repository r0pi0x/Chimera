# Combat Arms' shoot-through surfaces: specs/combat_arms/weapon_firing.md,
# "Penetration" and its Follow-up (2026-10-31b) (the surface table's
# MaxShootThroughThickness, MaxShootThroughPerturb, BulletRangeDampen,
# BulletDamageDampen; 19 surfaces). Our numbers as the spec gives them, not
# a file from the game. Surfaces not listed (concrete, metal, ...) stop
# bullets; Unknown (0), every untyped polygon and object, is listed.
#
# `names`: the surface names a row covers (matched without case against a
# collider's `PropSurface`, or the type name of the world's surface there);
# `ids`: their surface type numbers, in the same order; `thickness`: the most material a bullet
# passes, world units (0: always passes); `perturb`: the exit direction's
# random offset, thousandths per axis; `range` and `damage`: what is left
# of each after passing, as factors.
units = { length = 0.018 }

[[surface]]
names = ["wood"]
ids = [30]
thickness = 10.0
perturb = 10.0
range = 1.0
damage = 0.5

