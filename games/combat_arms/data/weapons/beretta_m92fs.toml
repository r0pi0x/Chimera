# Combat Arms' Beretta M92FS, the pistol of
# specs/combat_arms/weapon_classes.md: the reference build's numbers as its
# "Typical weapons" table gives them ([TW: row]) and section 4 ([4]).
# Fields the class spec doesn't give are left to the attribute defaults
# (specs/combat_arms/attribute_data.md). The install's own record
# overrides these when it can be read. Our numbers, not a file from the
# game.
#
# The format: docs/weapon-data.md; the hooks: game/weapons.rs. Units:
# world units (1.8 cm each, by body size) and hit points.
id = "combat_arms:beretta_m92fs"
units = { length = 0.018, damage = 0.01 }
# A secondary (inventory class 2, [4]).
slot = 1
# [TW: Draw] 650 ms.
draw = 0.65
# Its class in an automatic gun game (docs/weapon-data.md); install
# weapons copied from this document keep it.
class = "pistol"

# [TW: Clip / total] 15 / 45.
[ammo."combat_arms:9mm_m92fs"]
max = 30

# [TW: RapidFireCount] 1 (semi-automatic), [TW: Fire] 180 ms: [4] the
# fire animation is the rate limit (the 150 ms post-fire never delays a
# new press).
[trigger]
automatic = false
cycle = 0.18
timing = "accumulate"
# weapon_classes.md Corrections (2026-10-30) 1: pistols (the secondary
# class) play no pre-fire: the update that sees the press enters the
# firing state, fire_0 starts on the next and its key is consumed on the
# one after, so the first round comes 2 updates on.
latency = 2
# view_models.md 7: `postfire` 150 ms after the last round (weapon_classes.md
# 4); a press during it fires at once, a reload waits for it.
postfire = 0.15

# [TW: Clip / total] 15, [TW: Reload] 1500 ms.
[magazine]
clip = 15
ammo = "combat_arms:9mm_m92fs"
reload = 1.5
auto_reload = true

# [TW: Range] 2500, one ray.
[hitscan]
range = 2500.0
pellets = 1
punch_scale = 1.0

# [TW: Rays x damage] 26, [TW: Bands] 1000/2000/2500 at 1.0/0.7/0.35.
[hooks."combat_arms:damage"]
damage = 26.0
damage_type = 2
effect_range = [1000.0, 2000.0, 2500.0]
range_damage = [1.0, 0.7, 0.35]

# [TW: MinPerturb/MaxPerturb] 10/100, [TW: DynamicPerturbFactor] 1.1,
# [TW: PerturbIncSpeed/DecSpeed] 1.0/0.7, [TW: Zoomed min/max] 9/18 and
# inc/dec 1.0/0.7, [TW: Fire cap] .20/.30/.18/.25, [TW: Walk / run /
# jump target] .17/.20/.70, [TW: DecDelay] 100 ms.
[hooks."combat_arms:spread"]
cone = { min = 10, max = 100, inc = 1.0, dec = 0.7 }
zoomed_cone = { min = 9, max = 18, inc = 1.0, dec = 0.7 }
dynamic_factor = 1.1
state = { fire = 0.20, fire_move = 0.30, fire_duck = 0.18, fire_move_duck = 0.25, walk = 0.17, run = 0.20, jump = 0.70 }
dec_delay = 100.0

# [TW: Kick] 3.5 / 14, [TW: MaxRandomPitch] 0.02, [TW: Wag] -1.1/1.1, 10.
[hooks."combat_arms:recoil"]
pitch = 3.5
max_pitch = 14.0
random_pitch = 0.02
wag_r = -1.1
wag_l = 1.1
max_wag = 10.0

# [TW: ZoomTime] 0.13 s; no scope, so it never zooms ([4]).
[hooks."combat_arms:zoom"]
zoom_time = 0.13

# [TW: MovePenalty] 0.03.
[hooks."combat_arms:handling"]
move_penalty = 0.03

# attachments.md: its accepted list isn't in the spec: none (the
# install's modification file gives it).
[hooks."combat_arms:attachments"]

# view_models.md 4, 9, 10 (per-weapon placement): `MuzzlePos`,
# `BreachOffset`, `PVMuzzleFXName`; `Recoil` (the shot jiggle) is
# (0, 0, 0) in every stock record. Its animations are the view model's
# own, by view_models.md 7's names (game/view_model.rs).
[hooks."combat_arms:view_model"]
muzzle_pos = [2.84, -2.4, 8.559921]
breach_offset = [0.0, 0.0, 0.0]
muzzle_fx = "AK47_pv_muzz"
shells = true

# The first-person model (unkeyed GUNS_M_PV_Pistol) and its skin (index 1,
# view_models.md 2; GUNS_T_PV_Pistol is keyed: flat grey without the V2
# key). Its animations: view_models.md 7 (select 650 ms, idle_0 1566 ms,
# fire_0 180 ms, postfire 150 ms, reload 1500 ms, PreRush/rush/PostRush
# 250/1500/400 ms; no pre-fire played for a pistol).
[models]
view = "guns_m_pv_pistol/pv_pst_m92fs_sh.ltb"
view_skins = ["", "guns_t_pv_pistol/pv_beretta_m92fs.dtx"]
# view_models.md, per-weapon placement: `Pos` (-0.1, -0.2, 0.7).
view_offset = [-0.1, -0.2, 0.7]

# effects_sounds.md, "How effects are described as data" and 11: the
# ammo's ImpactFX, FireFX and TracerFX records (data/effects.toml), the
# third-person muzzle group and the weapon's sounds (files inside the
# install's archives; pistols have no tracer; WEAPON_HH and FireSndRadius 1600 PLACEHOLDER).
[hooks."combat_arms:effects"]
ammo_kind = "bullet"
impact = "BulletFmj"
fire = "9mm"
tracer = ""
hh_muzzle = "WEAPON_HH"
fire_sound = "guns_snd_pistol/beretta_m92fs/fire.wav"
fire_radius = 1600
silenced_sounds = ["guns_snd_option/pistol/silenced1.wav", "guns_snd_option/pistol/silenced2.wav"]
dry_fire_sound = "guns_snd_pistol/beretta_m92fs/dryfire.wav"
reload_sounds = ["guns_snd_pistol/beretta_m92fs/reload1.wav", "guns_snd_pistol/beretta_m92fs/reload2.wav", "guns_snd_pistol/beretta_m92fs/reload3.wav"]
select_sound = "guns_snd_pistol/beretta_m92fs/select.wav"
deselect_sound = "guns_snd_pistol/beretta_m92fs/deselect.wav"
