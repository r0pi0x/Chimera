# Caltrops: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:caltrops"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
# The view model's draw animation [6.12].
draw = 0.3
undroppable = false

# HideWhenEmpty: the weapon is unselectable at total 0 and the owner
# switches away; a device never drops on death [inventory.md 10, 12].
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:device"]
spawned = 1
max = 5
# 1 per spawn, 5 at most [6.5]; prefire 600, `fire_0` 67, the post-fire's
# key at 92 ms of 366 [6.12].
kind = "caltrops"
prefire = 0.6
throw_loop = 0.067
key = 0.092
postfire = 0.366
redraw = 0.3
perturb = [1, 10]
dynamic_perturb = 1.0
speed = 600.0
# Lifetime 60 s, Health 50, the model x 1.2: 18 x 6 x 18 [6.5].
lifetime = 60.0
health = 50.0
box_half = [18.0, 6.0, 18.0]
# ProgDamage 3 HP/s bleeding for 5 s in a cylinder of 50 u by 80 u; 12
# counts; StunnedMovePenalty 0.4, StunnedTime 5 [6.5].
caltrops = { rate = 3.0, duration = 5.0, radius = 50.0, height = 80.0, counts = 12, recount = 1.0, stun_penalty = 0.4, stun_time = 5.0 }
weak = [[40, 3.5]]
# The projectile record's CreateSound: the weapon's PlayAutoThrowSound is 0,
# so the server plays it at the throw [special_weapons.md Corrections
# (2026-10-31) 3].
create_sound = "guns_snd_throwing/caltrops/fire.wav"
create_radius = 300.0

[hooks."combat_arms:handling"]
move_penalty = 0.0
