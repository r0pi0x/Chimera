# The nerve confuse mine: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:nerve_confuse_mine"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
# The view model's draw animation [6.12].
draw = 0.833
undroppable = false

# HideWhenEmpty: the weapon is unselectable at total 0 and the owner
# switches away; a device never drops on death [inventory.md 10, 12].
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:device"]
spawned = 2
max = 2
# 2 per spawn, OnceActivate [6.6, 6.11]; prefire 1100, the post-fire's key
# at 333 ms of 633 [6.12].
kind = "nerve_mine"
prefire = 1.1
key = 0.333
postfire = 0.633
redraw = 0.833
perturb = [1, 10]
dynamic_perturb = 1.0
once_only = true
# Thrown at 800 u/s; Lifetime 60 s, Health 300, the model x 2: 20 x 6 x 20.
speed = 800.0
lifetime = 60.0
health = 300.0
box_half = [20.0, 6.0, 20.0]
# Sounds: the beep while it flies, the loop once it lies still, the finish
# 2.4 s before its 60 s are over; all 3D at 600 u [special_weapons.md
# Corrections (2026-10-31) 3].
look = { fly_sound = "guns_pt/snd/bomb_beep.wav", activate_sound = "guns_snd_etc/nerve_confuse_mine/activeloop.wav", finish_sound = "guns_snd_etc/nerve_confuse_mine/autofinish.wav", finish_time = 2.4, lifetime = 60.0, sound_radius = 600.0 }
# Damage type 44 (camera reverse) with 3 for 3 s on every enemy within 250 u.
nerve = { damage_type = 44, amount = 3.0, duration = 3.0, radius = 250.0 }

[hooks."combat_arms:handling"]
move_penalty = 0.0
