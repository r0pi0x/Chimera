# The claymore: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.85 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:claymore"
units = { length = 0.0185, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
# The view model's draw animation [6.12].
draw = 0.9
undroppable = false

# HideWhenEmpty: the weapon is unselectable at total 0 and the owner
# switches away; a device never drops on death [inventory.md 10, 12].
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:device"]
spawned = 2
max = 2
# 2 per spawn, Health 300, Velocity 0 (placed) [6.3]; prefire 1000 ms, the
# post-fire's key at 534 ms of 700 [6.12]. The box: PLACEHOLDER.
kind = "claymore"
prefire = 1.0
key = 0.534
postfire = 0.7
redraw = 0.9
perturb = [1, 10]
dynamic_perturb = 1.0
speed = 0.0
lifetime = 60000.0
health = 300.0
box_half = [8.0, 6.0, 3.0]
# AreaDamage 60 / 120 and the cone 120 / 500 / 80 degrees, claymore type 38
# (applied twice) [6.3]. SubControlWeaponName.
area_damage = 60.0
area_radius = 120.0
area_type = 38
controller = "combat_arms:claymore_controller"
arc = { damage = 120.0, radius = 500.0, angle = 80.0 }

[hooks."combat_arms:handling"]
move_penalty = 0.0
