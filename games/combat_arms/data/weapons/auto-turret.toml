# The auto turret: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:auto-turret"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
# The view model's draw animation [6.12].
draw = 1.333
undroppable = false
# An automatic gun game's specials band (docs/DESIGN.md "Gun game rules",
# "A turret rung"; ours: the spec has no ladder). Its install copies keep it
# (HG2_Auto_Turret; the infected ship turrets, whose top gun's rays do
# nothing here, and the perk ammo box are left out by their data).
class = "launcher"

# HideWhenEmpty: the weapon is unselectable at total 0 and the owner
# switches away; a device never drops on death [inventory.md 10, 12].
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:device"]
spawned = 1
max = 1
# 1 per spawn, OnceActivate, Health 350, x3 from explode and infected
# explode [6.7, 6.11]; `fire_0` 3666 ms with the release key at 3100 [6.12].
# The box: PLACEHOLDER (the spec's is its model's first animation box, not
# read): 32 x 40 x 32 u (0.58 x 0.72 x 0.58 m), what bullets of every game
# meet; a gun game's turret rung tunes nothing else (docs/DESIGN.md).
kind = "turret"
prefire = 0.0
key = 3.1
postfire = 3.666
redraw = 1.333
perturb = [1, 10]
dynamic_perturb = 1.0
once_only = true
speed = 600.0
lifetime = 60000.0
health = 350.0
box_half = [16.0, 20.0, 16.0]
weak = [[7, 3.0], [40, 3.0]]
# The `Auto-Turret` record: `Lower_set` 2833 ms, MaxAmmo 100, FireDelay
# 0.13 s, Perturb 50, SensorOffset (0, 10, 0), ShootingAngle (-45, 60),
# SensorAreaRadius 800; its gun `Turret-TopGun`: 12 damage, bullet, +-5 %,
# bands 800/900/1000 at 1.0/0.7/0.35, range 1000.
[hooks."combat_arms:device".turret]
setup = 2.833
ammo = 100
fire_delay = 0.13
perturb = 50.0
sensor_offset = [0.0, 10.0, 0.0]
angles = [-45.0, 60.0]
search_radius = 800.0
range = 1000.0
[hooks."combat_arms:device".turret.gun]
damage = 12.0
damage_type = 2
roll = 0.05
effect_range = [800.0, 900.0, 1000.0]
range_damage = [1.0, 0.7, 0.35]
fire_delay = 0.0

[hooks."combat_arms:handling"]
move_penalty = 0.35
