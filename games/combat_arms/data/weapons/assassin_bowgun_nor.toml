# The crossbow: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:assassin_bowgun_nor"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1, 7].
slot = 4
draw = 1.2
# Its class in an automatic gun game (docs/weapon-data.md); install
# weapons copied from this document keep it.
class = "sniper"

# Clip 5 and total 25 [7].
[ammo."combat_arms:assassin_bowgun_nor_bolt"]
max = 20

# Automatic, `fire_0` 1100 ms [7].
[trigger]
automatic = true
cycle = 1.1
timing = "accumulate"

[magazine]
clip = 5
ammo = "combat_arms:assassin_bowgun_nor_bolt"
reload = 2.3
auto_reload = true

[hitscan]
range = 1.0
pellets = 1
punch_scale = 0.0

# The `CrossBow` record [7]: 5000 u/s straight for 10 s, 50 HP. The direct
# damage 105.0 of type crossbow (45), the roll +-10 %, the range band measured
# from the map's origin: beyond 3500 u x0.7, beyond 4000 x0.35, beyond 5000
# x1 (Quirk 4). The cone as the thrown traps' (n = 1).
[hooks."combat_arms:bolt"]
speed = 5000.0
lifetime = 10.0
health = 50.0
perturb = [1, 10]
dynamic_perturb = 1.0
[hooks."combat_arms:bolt".damage]
damage = 105.0
damage_type = 45
roll = 0.1
effect_range = [3500.0, 4000.0, 5000.0]
range_damage = [1.0, 0.7, 0.35]
fire_delay = 0.0
# The alternate fire's bolt [7]: 1300 u/s, `InstDamage` 41.
[hooks."combat_arms:bolt".alt]
speed = 1300.0
damage = 41.0

# Right mouse is alt-fire [weapon_classes.md 8]: one bolt, `alt_fire_0`
# 550 ms [7]; not with an empty clip.
[hooks."combat_arms:alt_fire"]
rounds = 1
interval = 0.0
cycle = 0.55

# MovePenalty 0.18 [7].
[hooks."combat_arms:handling"]
move_penalty = 0.18
