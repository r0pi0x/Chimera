# Combat Arms' announcer pack (chimera_core::announcer; the numbers and
# file names are specs/combat_arms/kill_streaks.md Part B's). The files are
# paths in the player's own install, loaded at run time.
id = "combat_arms"
name = "Combat Arms"
game = "combat_arms"
# B1: enemy kills each less than 5 s after the previous one.
window_ms = 5000
# Not in the spec ("killed them repeatedly", A1): two kills unanswered.
revenge_after = 2

# B1: the steps by multi-kill count (the thresholds inferred, Open
# question 1); level 5, a streak step's (B4, corrected 2026-10-28).
steps = [
    { count = 2, key = "double_kill", name = "DOUBLE KILL", banner = "UI_HUD_Message/Effect/DoubleKill.dtx", voice = "UI_SND/doublekill.wav", level = 5 },
    { count = 3, key = "multi_kill", name = "MULTI KILL", banner = "UI_HUD_Message/Effect/MultiKill.dtx", voice = "UI_SND/multikill.wav", level = 5 },
    { count = 4, key = "ultra_kill", name = "ULTRA KILL", banner = "UI_HUD_Message/Effect/UltraKill.dtx", voice = "UI_SND/ultrakill.wav", level = 5 },
    { count = 5, key = "fantastic", name = "FANTASTIC", banner = "UI_HUD_Message/Effect/fantastic.dtx", voice = "UI_SND/fantastic.wav", level = 5 },
    { count = 6, key = "unbelievable", name = "UNBELIEVABLE", banner = "UI_HUD_Message/Effect/Unbelievable.dtx", voice = "UI_SND/Unbelievable.wav", level = 5 },
    # Quirk 6: the same voice as Unbelievable.
    { count = 7, key = "unbelievable_plus", name = "UNBELIEVABLE+", banner = "UI_HUD_Message/Effect/Unbelievable_plus.dtx", voice = "UI_SND/Unbelievable.wav", level = 5 },
]

# B2 and B4 (corrected 2026-10-28): the event kills (first kill, revenge)
# at level 6; head and groin shots at the special shots' (5); revenge has
# no voice (a headshot revenge says the head line, A6). One kill raises
# one event, with one voice; the skull or nut goes over a step, first kill
# or revenge, not over a single kill's own headshot or nutshot (A2).
first_kill = { key = "first_kill", name = "FIRST KILL", banner = "UI_HUD_Message/Effect/FirstKill.dtx", voice = "UI_SND/FirstKill.wav", level = 6 }
headshot = { key = "headshot", name = "HEADSHOT", banner = "UI_HUD_Message/Effect/HeadShot.dtx", top = "UI_HUD_Message/Effect/Head.dtx", voice = "UI_SND/headshot.wav", level = 5 }
# The voice by the killer's body (Open question 10, answered).
groin = { key = "nutshot", name = "NUTSHOT", banner = "UI_HUD_Message/Effect/NutShot.dtx", top = "UI_HUD_Message/Effect/Nut.dtx", voice = "UI_SND/NutShot_Male.wav", voice_female = "UI_SND/NutShot_Female.wav", level = 5 }
revenge = { key = "revenge", name = "REVENGE", banner = "UI_HUD_Message/Effect/Revenge.dtx", level = 6 }

# B2a: the plain kill, level 1 (B4): "KILL" for a match kill total of 1 or
# less, "KILLS" above, with the total in digits: one image per digit
# (`digit_prefix` + digit + ".dtx"), the ones, tens and hundreds slots of
# B3 (`Num_One`, `Num_Ten`, `Num_Hun`). No top image; "KILL"'s voice
# (`OneKillSound`) is not in the install, so none is named; "KILLS" has no
# key. The weapon skins (A8, B7) are read from the install
# (`HUDEffectOverride` sections); the Graffiti skin's "KILL" names a missing
# file (Quirk 5), drawn blank.
[plain_kill]
one = { key = "kill", name = "KILL", banner = "UI_HUD_Message/Effect/Kill.dtx", level = 1 }
many = { key = "kills", name = "KILLS", banner = "UI_HUD_Message/Effect/Kills.dtx", level = 1 }
digit_prefix = "UI_HUD_Message/Effect/Number_"
digits = [[425.0, 175.0, 64.0, 128.0], [385.0, 175.0, 64.0, 128.0], [345.0, 175.0, 64.0, 128.0]]

# B3: the 1024 x 768 reference screen, each axis stretched.
[layout]
reference = [1024.0, 768.0]
banner = [256.0, 76.0, 512.0, 256.0]
top = [256.0, 93.0, 512.0, 256.0]

# B4 (and A5's shake, -5..5 screen pixels).
[timing]
total = 1.4
start = 0.0
creating = 0.1
blowing = 0.15
end = 1.2
destroying = 0.2
start_size = 5.0
blow_size = 3.0
last_size = 5.0
shake = 5
