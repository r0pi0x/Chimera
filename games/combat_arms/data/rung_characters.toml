# Who wears a Combat Arms rung's gun (chimera_sim::minigame::holders; read
# by game::rungs): the body drawn for a rung is one of the characters
# allowed to hold its weapon. Derived from the game's own data:
# - an infected's weapon (its record plays the infected leg set,
#   `LowerAniType` 1 or 2, characters.md 5: the Quarantine hands; marked
#   `combat_arms:infected`, game::data::infected_table) is held by the
#   infected only: zombie bodies (`@infected`: the player bodies with an
#   infection override, worn infected, game_modes.md M8);
# - every other weapon by any character that holds guns (`@players`: the
#   install's player bodies, skeletons 0 and 1 with a two-texture body,
#   characters.md 1: the stock bodies, specialists and mercenaries; never
#   an infected override, an NPC or a boss record).
# Characters are `@players`, `@infected`, `@npcs`, a body record id (a
# `Model#` index; an `AIModel#` is the `Model#` count plus its index), or
# a record `Name` (a `*` pattern; `Model#` and `AIModel#` alike); `!x`
# takes x out of a group.
default = "soldiers"

[derived]
infected = "zombies"

[groups]
soldiers = ["@players"]
zombies = ["@infected"]
# The Sandhog soldiers (12.4's `SH_*` holders).
sandhog = ["SH_Rifle", "SH_Recon", "SH_MGunner", "SH_Sniper", "SH_HeavyGunner", "SH_RoyalGuard"]
# The squad mercenaries holding the M67 (Squad_0-9, 11, 12).
squad = ["Squad_0", "Squad_1", "Squad_2", "Squad_3", "Squad_4", "Squad_5", "Squad_6", "Squad_7", "Squad_8", "Squad_9", "Squad_11", "Squad_12"]
# The big powered suit and its coloured copies (Model 62, 583, 588).
big_suits = ["62", "583", "588"]
# The bosses holding `Abnormal_Boss_Minigun` (12.4).
abnormal_bosses = ["Abnormal_Boss", "Abnormal_Du_Boss", "Abnormal_Du_Boss_A", "Abnormal_Boss_Fortress", "Abnormal_Boss_Beetle", "Abnormal_Boss_GroundThorn"]

