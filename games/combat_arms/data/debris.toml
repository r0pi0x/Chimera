# Combat Arms' prop debris records (specs/combat_arms/effects_sounds.md
# Follow-up (2026-10-31b) 1: the install's `ATTRIBUTES\DEBRIS.TXT`, six
# records), as the spec gives them, not a file from the game: used when the
# install's table can't be read. A record's place is its id; a map object's
# `DebrisType` names it by `name` (case ignored). Vectors: `vel` is (right,
# forward, up) of the death direction's frame, the others world (x, y, z);
# times in seconds; `rotate` 0 or not; `models`, `skins`, `styles` and the
# sounds are archive paths.

