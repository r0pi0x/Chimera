[package]
name = "combat_arms"
version = "0.1.0"
description = "Combat Arms as a game crate: its simulation on the engine (a skeleton of placeholder parts until its specs arrive)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The layers this crate builds on, beside Chimera (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
loaders = ["lithtech"]

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# What only a feature compiles, for the hooks' test selection
# (checks/src/affected.rs): an edit under src/ui/ runs the front end's
# tests (tests/ui/) and the crates above, not the simulation's
# (tests/it/).
[package.metadata.affected]
feature-paths = { ui = ["src/ui/"] }

# The engine's crates, Bevy and physics; never `mashup`, another game
# (`cs_source`) or Source's map logic, and the presentation
# (`chimera_present`) and the shell only for `ui`
# (checks/tests/it/architecture.rs checks it). Same versions and features
# as the other members' (workspace dependencies), so `cargo test -p
# combat_arms` reuses the workspace's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
# The network: the game registers what it replicates there (`game::net`);
# its predicted parts go with Chimera's prediction.
chimera_net.workspace = true
bevy_replicon.workspace = true
# The selection's network form (`game::inventory`), as Chimera's
# predicted parts.
postcard.workspace = true
# LithTech's formats: the install's `.rez` archives (`game::mount`).
lithtech_formats.workspace = true
# Sound files (WAV) from the install's archives (`game::effects`).
chimera_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
serde.workspace = true
toml.workspace = true
# The front end (`ui`, the `ui` feature): the client shell and the
# presentation it draws with.
chimera_client = { workspace = true, optional = true }
chimera_present = { workspace = true, optional = true }
workspace-hack.workspace = true

# The simulation's integration tests (tests/it/): scenario tests on the
# headless harness with Combat Arms' simulation as the base
# (`harness::CaSim`) and the greybox.
[[test]]
name = "it"
path = "tests/it/main.rs"

# The front end's (tests/ui/): built with `ui` only; the HUD's behaviour
# and the scenario tests that read its state.
[[test]]
name = "ui"
path = "tests/ui/main.rs"
required-features = ["ui"]

[features]
# Combat Arms' front end (`ui`): its HUD and placeholder visuals on the
# client shell. The app turns it on; the simulation's tests build without
# it.
ui = ["dep:chimera_client", "dep:chimera_present"]
# Bevy as a dynamic library, as the app's `dev` (which turns this on):
# `cargo test -p combat_arms --features dev` shares the app's Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "chimera_client?/dev", "chimera_present?/dev"]

[dev-dependencies]
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
