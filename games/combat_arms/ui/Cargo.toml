[package]
name = "combat_arms_ui"
version = "0.1.0"
description = "Combat Arms' front end on the client shell: the layout format's widgets, the HUD, the menus, the scoreboard, the lobby screens, the radar and the effects' drawing, above the game's simulation (`combat_arms`)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The game's simulation, the engine's crates and the client shell with the
# presentation; never another game, its front end or an app
# (checks/tests/it/architecture.rs, `layers_follow_paths`). Its own crate so
# that `combat_arms` and its tests build without the shell, and a client-side
# edit selects this crate's tests, not the simulation's
# (docs/plans/active/architecture-for-iteration.md, stage 1).
[dependencies]
combat_arms.workspace = true
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_net.workspace = true
chimera_client.workspace = true
chimera_present.workspace = true
lithtech_formats.workspace = true
chimera_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
serde.workspace = true
toml.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, as every
# build with the presentation has them, so `cargo test -p combat_arms_ui`
# shares the clients' builds (`selections_share_one_build`).
[dev-dependencies]
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

# The front end's integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on).
dev = ["combat_arms/dev", "chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "chimera_client/dev", "chimera_present/dev", "lithtech_formats/dev", "chimera_formats/dev"]
