# The sniper rifle (specs/halo_ce/weapons.md "Multiplayer weapon numbers",
# 12, "Test cases"; projectiles.md "Flight numbers", "Material responses";
# animations.md "First-person graphs"): 4 + 8 rounds (24 most in reserve),
# semi-automatic, 2 a second (15 ticks), 0.5 degrees of error unzoomed and
# none zoomed (trigger flag 10), two zoom levels (2x then 8x), a 5-frame
# recoil animation of its own that holds a reload back; its bullet at
# 33.33 WU a tick to 1000 WU passes through an unshielded body and the
# organic ones at full speed (101 points: a headshot kills a full Spartan).
id = "halo_ce:sniper_rifle"
base = "halo_ce:gun"
slot = 2
class = "sniper"

# Its models (models.md "Which models the game draws where", "The other
# first-person weapon models"; weapons.md "References"): seen in first
# person with the arms (`game::view`), held in the Spartan's hand.
[models]
view = 'weapons\sniper rifle\fp\fp'
world = 'weapons\sniper rifle\sniper rifle'

[hud]
name = "Sniper Rifle"

[hooks."halo_ce:weapon"]
