# The frag grenade rung of a party ladder (game::weapons::rung, the
# user's choice of presentation): the pistol in hand with an empty
# magazine and no reserve that nothing refills (its numbers, models and
# animations are the pistol's: `base`), the frag grenades thrown with the
# grenade button by the ladder's grenade-band supply rule. Its id is the
# frag grenade's own (the kill feed's name and icon, the ladder's rung).
# Halo's own app has no ladder and never hands it out.
id = "halo_ce:frag_grenade"
base = "halo_ce:pistol"
class = "grenade"

[hud]
name = "Frag Grenade"

# No round loaded, none in reserve, none to be had.
[hooks."halo_ce:weapon".magazine]
rounds_total_initial = 0
rounds_total_maximum = 0

# The party ladder's hint on its rung (opt-in, this rung only): the key of
# Halo's grenade action and what it does.
[rung_hint]
action = "grenade"
verb = "throw"

# Its attack: Halo's grenade action (the engine's `weapon::AttackAction`,
# for the bots), the frag kind.
[hooks."halo_ce:grenade_rung"]
kind = "frag"
action = "grenade"
