# The frag grenade rung of a party ladder (game::weapons::rung, the
# user's choice of presentation): the pistol in hand with an empty
# magazine and no reserve that nothing refills (its numbers, models and
# animations are the pistol's: `base`), the frag grenades thrown with the
# grenade button by a supply that comes back over time (the ladder's grenade supply). Its id is the
# frag grenade's own (the kill feed's name and icon, the ladder's rung).
# Halo's own app has no ladder and never hands it out.
id = "halo_ce:frag_grenade"
base = "halo_ce:pistol"
class = "grenade"

[hud]
name = "Frag Grenade"

# No round loaded, none in reserve, none to be had.
[hooks."halo_ce:weapon".magazine]
rounds_total_initial = 0
rounds_total_maximum = 0

# The party ladder's hint on its rung (opt-in, this rung only), shown the
# whole time there: "Grenade rung - throw with [LMB] or [G]" (the keys
# bound to fire and to Halo's grenade action) and the frags left.
[rung_hint]
title = "Grenade rung"
action = "grenade"
verb = "throw"
fire = true
always = true
count = true

# Its attack: Halo's grenade action (the engine's `weapon::AttackAction`,
# for the bots), the frag kind.
[hooks."halo_ce:grenade_rung"]
kind = "frag"
action = "grenade"
# The fire button throws too (there is no gun to fire).
fire_throws = true
# The most frags the holder has (arriving, and every new life, gives this
# many). One thrown comes back after the party ladder's grenade supply
# seconds (chimera/sim/data/power_curve.toml, [grenade_supply]), one at a
# time while the count is below `max`, so the rung cannot be spammed.
max = 4
