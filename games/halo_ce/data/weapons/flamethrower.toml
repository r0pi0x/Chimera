# The flamethrower (specs/halo_ce/weapons.md "Multiplayer weapon numbers";
# projectiles.md "Flight numbers", 16; animations.md "First-person graphs";
# not placed on a stock map: multiplayer_rules.md 5.3 makes it a rocket
# launcher there): 100 + 500 rounds (1200 most in reserve; a reload throws
# the loaded rounds away), 15 a second (2 ticks), error 2 to 4 degrees, 0.04125
# heat a round (overheated at 1, firing again below 0.9, 0.475 lost a
# second); its stream is a flame every 2 ticks, each a blob at 0.333 WU a
# tick that vanishes on any surface and explodes at 2.5 WU (10 points within
# 0.4 WU, flame). Its trigger's shots keep the marker's own vector (flag 11).
id = "halo_ce:flamethrower"
base = "halo_ce:gun"
slot = 3

# Its models (models.md "Which models the game draws where", "The other
# first-person weapon models"; weapons.md "References"): seen in first
# person with the arms (`game::view`), held in the Spartan's hand.
[models]
view = 'weapons\flamethrower\fp\fp'
world = 'weapons\flamethrower\flamethrower'

