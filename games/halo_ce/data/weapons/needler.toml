# The needler (specs/halo_ce/weapons.md "Multiplayer weapon numbers";
# projectiles.md "Flight numbers", 12, 13; animations.md "First-person
# graphs"): 20 + 60 needles (80 most in reserve), 3 rising to 10 a second as
# held (10 ticks to 3), error 2 to 4 degrees; the needle at 0.133 WU a tick
# to 20 WU, turning 1.57 rad a second toward its target (half against a
# player), sticking into what it hits (stone and metal glance off at a
# shallow angle) and detonating 0.75 s after the last one stuck: 10 points
# each, and more than six in one biped a supercombine (60 points, emp).
id = "halo_ce:needler"
base = "halo_ce:gun"
slot = 0
class = "smg"

[hud]
name = "Needler"

[hooks."halo_ce:weapon"]
