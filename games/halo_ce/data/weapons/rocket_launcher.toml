# The rocket launcher (specs/halo_ce/weapons.md "Multiplayer weapon
# numbers"; projectiles.md "Flight numbers", 9 to 11, 16; animations.md
# "First-person graphs"): 2 + 2 rounds (8 most in reserve), semi-automatic,
# one rocket every 60 ticks, no error, one 2x zoom, the rocket 0.1 WU to the
# right of the camera line (the first-person offset), at 0.4 WU a tick
# slowing to 0.333 over 100 WU, 0.1 WU wide against objects, detonating on
# any surface (leaves: through, 10 % detonate) and at 128 WU: 300 to 330
# points within 0.5 WU falling to 80 at 2 WU, and a push of 6 WU/s.
id = "halo_ce:rocket_launcher"
base = "halo_ce:gun"
slot = 3
class = "launcher"

# Its models (models.md "Which models the game draws where", "The other
# first-person weapon models"; weapons.md "References"): seen in first
# person with the arms (`game::view`), held in the Spartan's hand.
