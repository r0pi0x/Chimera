# The plasma pistol (specs/halo_ce/weapons.md "Multiplayer weapon
# numbers", 8 to 10, "Test cases"; projectiles.md "Flight numbers", 14;
# animations.md "First-person graphs"): two triggers. Trigger 0 (the fire
# button) charges on the press (18 ticks) and fires a bolt on the release
# (no rate limit: a tap every other tick fires every 2), 0.16 heat and
# 0.002 battery a bolt; held through the charge it stays charged (45 s, the
# overcharged action none: held for ever) and its release fires trigger 1,
# the charged bolt (heat 1, battery 0.11), which tracks its target and
# strips a shield (70 points, emp). Overheated at 1, firing again below
# 0.25, 0.65 heat lost a second (35 ticks from full).
id = "halo_ce:plasma_pistol"
base = "halo_ce:gun"
slot = 1
class = "pistol"

# Its models (models.md "Which models the game draws where", "The other
# first-person weapon models"; weapons.md "References"): seen in first
# person with the arms (`game::view`), held in the Spartan's hand.
[models]
view = 'weapons\plasma pistol\fp\fp'
world = 'weapons\plasma pistol\plasma pistol'

[hud]
name = "Plasma Pistol"

[hooks."halo_ce:weapon"]
tag = 'weapons\plasma pistol\plasma pistol'
label = "pp"
# Bit 11: cannot fire at maximum age.
flags = 0x800
# The plasma pistol type.
weapon_type = 3
zoom_levels = 0
camo = [1.0, 0.04]
melee_damage = "plasma_pistol_melee"
# The port gives its charged bolt section 15's target with aim assist off.
guidance_targets = true

[hooks."halo_ce:weapon".heat]
