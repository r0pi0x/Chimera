# Halo's balance where damage crosses games (the party apps, where a
# player holding a Halo gun is Halo's: shield over health, the Spartan,
# Halo's movement), read by game::cross_game. These rules apply only when
# damage crosses games (another game's damage on a Halo player); a Halo
# source on another game's character is scaled by the party's per-game
# damage table. Halo against Halo is untouched (the
# spec's shots-to-kill table holds with the switch on and off).
#
# The project owner's decision (2026-11-15): a Halo character a little
# more tanky than a normal character is fine, the shield is its special
# thing; its guns must not also be overpowered; Halo against Halo must not
# become weird; the shield must not leak into the next rung.

# Off: today's behaviour exactly (incoming damage counted as it comes, the
# shield's value kept as armour on the next rung, the power reader as
# before), for comparison.
enabled = true

# Another game's damage on a Halo player counts this many times against
# the shield and the body, the shield still first: a full Halo player's 75
# shield and 75 body points (100 armour and 100 health to another game's
# gun) become 200 / 1.5 = 133 effective hit points, where any other
# character has 100. An AWP's 114-point body hit kills a full Halo player
# with one shot from 200 / 114 = 1.754 on.
incoming_scale = 1.5

# A Halo source on another game's character keeps Halo's own conversion
# (a Halo point 1/75 of that character's health: the Spartan's body is 75
# points) and is scaled by the party's per-game damage table (party_kit's
# data/party_damage.toml, `halo_ce`), where every game's weapons are tuned.

# What the ladder's power reader assumes of a hand on Halo's guns
# (game::weapons' power reader).
[power]
# A trigger with no rate limit (the plasma pistol's: a bolt on each
# release) fires as fast as a hand taps: taps a second.
hand_taps_per_second = 7.0
# An automatic gun whose error grows as it is held (the assault rifle) is
# fired in bursts this long (seconds), the trigger let go until the error
# is back to its least before the next: the cone is the burst's mean, the
# pause counted in the fire interval.
burst_seconds = 0.2
