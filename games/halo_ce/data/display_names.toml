# Halo's guns' names (chimera_sim::weapon::names;
# docs/plans/active/gun-display-names.md). The disc has no strings the
# simulation reads, so the full names are given here (and as each weapon
# document's `hud.name`); each is short enough to be its own short name.
# `gun_names halo_ce` in the console lists them.
game = "halo_ce"

[[name]]
weapons = ["halo_ce:assault_rifle"]
full = "Assault Rifle"

[[name]]
weapons = ["halo_ce:pistol"]
full = "Pistol"

[[name]]
weapons = ["halo_ce:plasma_rifle"]
full = "Plasma Rifle"

[[name]]
weapons = ["halo_ce:shotgun"]
full = "Shotgun"

[[name]]
weapons = ["halo_ce:sniper_rifle"]
full = "Sniper Rifle"

[[name]]
weapons = ["halo_ce:rocket_launcher"]
full = "Rocket Launcher"

[[name]]
weapons = ["halo_ce:needler"]
full = "Needler"

[[name]]
weapons = ["halo_ce:plasma_pistol"]
full = "Plasma Pistol"

[[name]]
weapons = ["halo_ce:flamethrower"]
full = "Flamethrower"
