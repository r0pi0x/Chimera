# Seats: flags (bit 2 driver, 3 gunner, 4 third-person camera, 5 allows
# weapons, 6 third person on enter), yaw and pitch rates (degrees per
# second, 0: the player's), camera focus marker, pitch auto level and range
# (radians), yaw range (radians, both 0: none), HUD text index.
[[seats]]
