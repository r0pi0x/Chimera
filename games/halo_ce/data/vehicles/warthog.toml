# The Warthog (`vehicles\warthog\warthog`), from specs/halo_ce/vehicles.md
# ("Vehicle fields of the four", "Seats", "Physics: the four", "Warthog mass
# points", the camera track table). Units as the tag's: world units (WU),
# WU per tick, degrees where the tag stores degrees (turn limits, turn rate,
# seat yaw and pitch rates), radians elsewhere. Checked against the disc by
# the heavy test `vehicle_data`.

name = "warthog"
tag = "vehicles\\warthog\\warthog"
kind = "jeep"
flags = 0xCD1
max_forward_speed = 0.255
max_reverse_speed = 0.1
speed_acceleration = 0.00275
speed_deceleration = 0.011
max_left_turn = 30.0
max_right_turn = -30.0
wheel_circumference = 1.0
turn_rate = 180.0
blur_speed = 0.08
flipping_angular_velocity = [0.2, 0.75]
bounding_radius = 1.1
acceleration_scale = 0.3
rider_damage_fraction = 0.18
power_up_time = 1.0
power_down_time = 0.1

[physics]
mass = 5000.0
center_of_mass = [0.106921, 0.0, 0.321783]
density = 5.0
gravity_scale = 1.0
ground_friction = 0.2
ground_depth = 0.15
ground_damp_fraction = 0.05
ground_normal_k1 = 0.707107
ground_normal_k0 = 0.5
water_friction = 0.05
water_depth = 0.25
water_density = 1.0
air_friction = 0.005
# The stored tensor: xx, yy, zz and the xz (= zx) product; the other
# off-diagonal terms are 0.
