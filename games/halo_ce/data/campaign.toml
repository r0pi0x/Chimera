height_crouch = 0.5
radius = 0.18
camera_stand = 0.62
camera_crouch = 0.44

# Its rifle class's moves (section 4, "The numbers"): front 0.0700 WU/t,
# back 0.0500, sides 0.0583; crouched 0.0326, 0.0326, sides 0.0175 left
