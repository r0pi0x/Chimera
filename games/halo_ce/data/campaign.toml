    { name = "unarmored", head = false, type = 15, leak = 1.0, shield = 0.0, body = 1.0 },
    { name = "head", head = true, type = 15, leak = 1.0, shield = 0.0, body = 1.0 },
    { name = "armored", head = false, type = 15, leak = 1.0, shield = 0.0, body = 1.0 },
    { name = "shield", head = false, type = 16, leak = 0.0, shield = 1.0, body = 0.0 },
]
regions = [
    { name = "arms", flags = 0, threshold = 0.0 },
    { name = "head", flags = 0, threshold = 0.0 },
    { name = "legs", flags = 0, threshold = 0.0 },
    { name = "shield", flags = 16, threshold = 0.0 },
