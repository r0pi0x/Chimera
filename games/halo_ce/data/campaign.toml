# Its own lines (each of the four voices fills these): the Marines'
# taunt slot is empty, so a call to move up on becoming one (advance),
# a cheer after a kill (celebration, killed enemy player).
lines = { becoming = ["advance", "new combat alone"], kill = ["celebration", "killed enemy player", "killed enemy"] }

[bodies.marine.movement]
