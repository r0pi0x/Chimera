# The campaign's characters as bodies a party player can wear on a Halo
# rung (specs/halo_ce/characters.md; docs/plans/active/halo-ce.md, "Play as
# the campaign's characters"). `games/halo_ce/src/game/campaign/mod.rs`
# reads it (`CampaignData`). Party apps only: Halo's own app never offers
# these bodies. The Spartan is every Halo player's body unless a draw here
# says otherwise.

# How fast a campaign body runs (the owner's rule, 2026-11-16: player
# expression over fidelity for movement): every body moves on the
# Spartan's mover (its acceleration, air control, jump and gravity, every
# direction, no landing freeze, no aim limit), only its speed differs: the
# Spartan's run and crouch speeds times 1 + speed_blend x (speed_ratio -
# 1), halfway (0.5) between the Spartan's and the character's own. Tune
# here.
speed_blend = 0.5

# Which bodies may carry each Halo gun, with their weights (characters.md
# section 2, "Character by multiplayer weapon": a character is offered only
# for the guns its graph animates and the campaign gives it). A gun not
# listed is the Spartan's alone. With `halo_ce:campaign_bodies` on, a
# player given a Halo rung draws its body by these weights (the Spartan's
# included); a body whose unit is not here is skipped (the Spartan then).
[guns."halo_ce:plasma_rifle"]
spartan = 1.0
elite = 1.0

[guns."halo_ce:needler"]
spartan = 1.0
elite = 1.0

# Each character: its biped tag, the campaign map its unit is cut from
# (section 8: the smallest holding it), and what differs from the
# Spartan's tables (data/movement.toml and data/vitality.toml, merged key
# by key: a table not named here is the Spartan's). Its `movement` table
# may override any key of data/movement.toml, each the Spartan's when
# absent: the pill and camera, and for a tuning pass the run and crouch
# speeds (`run_*`, `sneak_*`, before the blend), the acceleration
# (`run_accel`, `sneak_accel`), the air control (`air_accel`) and the
# jump (`jump_velocity`, WU/t). The Elite sets its pill, camera and speed
# ratio only.
[bodies.elite]
biped = 'characters\elite\elite'
donor_map = "d20"
# The game's own moving speed over the Spartan's (characters.md section 4:
# it outruns the Spartan by 15 %, 0.0865 against 0.075 WU/t).
speed_ratio = 1.15
# Its armour takes the player's colour (the party's team or free-for-all
# colour, as the Spartan's) through change colour A, which tints it all
# over; a player given no colour wears the minor's blue violet
# (characters.md section 1, "The Elite's colours": a player-worn `elite`
# keeps the colour it is created with; the sheen stays permutation 0's
# blue).
colour_slot = "A"
uncoloured = [0.314, 0.302, 0.533]

# The Elite's pill and camera (section 3, "Dimensions and the pill"), its
# own. With its speed ratio it runs at 107.5 % of the Spartan.
[bodies.elite.movement]
height_stand = 0.8
height_crouch = 0.5
radius = 0.2
camera_stand = 0.6
camera_crouch = 0.3

# The speeds its graph's move animations show (section 4 "The numbers":
# the mean root motion of stand pistol move-front 0.0865 WU/t, back and
# sides 0.0731, crouched 0.0333, 0.0217, 0.0200), WU/s: its legs play at
# the body's ground speed over these, so the feet keep up.
[bodies.elite.animation]
front = 2.595
back = 2.193
side = 2.193
crouch_front = 0.999
crouch_back = 0.651
crouch_side = 0.6

# The Elite's vitality (section 5: the collision model
# `characters\elite\elite`): 100 body, 100 shield of type 30 (elite energy
# shield), 12 s before the shield recharges, 10 s from empty to full; its
# materials (section 3, "Hit boxes") in the collision model's order, the
# indirect material `body`; its four regions, none destroyable. The model
# fields the spec does not state are the Spartan's.
[bodies.elite.vitality.model]
tag = 'characters\elite\elite'
maximum_body = 100.0
maximum_shield = 100.0
shield_material_type = 30
stun_time = 12.0
recharge_time = 10.0
recharge_velocity = 0.0033333334
indirect_material = 2
materials = [
    { name = "head", head = true, type = 14, leak = 0.0, shield = 1.0, body = 1.0 },
    { name = "arms", head = false, type = 14, leak = 0.0, shield = 1.0, body = 0.5 },
    { name = "body", head = false, type = 14, leak = 0.0, shield = 1.0, body = 1.0 },
    { name = "legs", head = false, type = 14, leak = 0.0, shield = 1.0, body = 0.8 },
]
regions = [
    { name = "arms", flags = 0, threshold = 0.0 },
    { name = "head", flags = 0, threshold = 0.0 },
    { name = "legs", flags = 0, threshold = 0.0 },
    { name = "torso", flags = 0, threshold = 0.0 },
]

# Chimera's body regions as the Elite's materials: head, arms, legs, the
# rest its body.
[bodies.elite.vitality.regions]
head = 0
arms = 1
legs = 3
other = 2

# Section 5 rule 7: the Elite's hard ping threshold 0.3 (0.5 s).
[bodies.elite.vitality.unit]
hard_ping_threshold = 0.3
soft_ping_interrupt_time = 0.5
