# The Hunter (`characters\hunter\hunter`; sections 1 to 8), cut from d20,
# the smallest map holding it, with its own weapon (the arm cannon, cut as
# a unit of its own: `weapon/hunter_fuel_rod`). It holds only its cannon
# (section 2 rule 6), which is the body of its own rung (`[guns]` above).
# Its move-front 0.0773 WU/t against the Spartan's 0.075 (103 %, so 101.5
# % with the blend; the spec gives it no slower mover: it keeps the
# Spartan's acceleration, jump and air control, and walks every
# direction, its graph's forward walk played for the others, section 4);
# its pill 0.8 WU standing and crouched (crouching does not lower it,
# section 3 note 2), radius 0.24, camera 0.6 / 0.3 (the biped's: 1.83 m,
# well below its head marker's 2.755 m). No change colours (section 1:
# untinted).
[bodies.hunter]
biped = 'characters\hunter\hunter'
donor_map = "d20"
speed_ratio = 1.0306667
weapons = ['weapons\fuel rod gun\hunter fuel rod']
# Its own lines: its roar on becoming one (melee attack 10, dive 11), its
# kill line after a kill (killed enemy 9: section 6, the eight slots it
# fills).
lines = { becoming = ["melee attack", "dive"], kill = ["killed enemy"] }

[bodies.hunter.movement]
height_stand = 0.8
height_crouch = 0.8
radius = 0.24
camera_stand = 0.6
camera_crouch = 0.3

# Its unarmed class's moves (section 4, "The numbers"): front 0.0773 WU/t
# (no back or side walk: those play the forward one at their speed);
# crouched 0.0189 front and back, 0.0167 sides.
[bodies.hunter.animation]
front = 2.319
back = 2.319
side = 2.319
crouch_front = 0.567
crouch_back = 0.567
crouch_side = 0.501

# Its first-person view (game::campaign::first_person, the owner's idea:
# the disc has no first-person model for its cannon): its own right arm,
# the cannon, from the upper arm down, and its shield arm's forearm (its
# melee is a bash of that arm), posed by its own idle, aim, fire
# and melee, the eye at its standing camera; `offset` (metres: +X right,
# +Y up, -Z forward) and `turn` (degrees: yaw, pitch, roll) place it in
# the view, the cannon in the lower right as a gun sits. Tune here.
[bodies.hunter.first_person]
guns = ["halo_ce:hunter_fuel_rod"]
keep = ["bip01 r upperarm", "bip01 l forearm"]
label = "fr"
offset = [-0.25, 0.25, -0.35]
turn = [0.0, 0.0, 0.0]

