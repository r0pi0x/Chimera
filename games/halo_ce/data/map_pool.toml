# Halo maps an automatic gun game's pool leaves out (the Ultimate Gun
# Game: chimera_sim::minigame::map_fit; docs/plans/active/
# map-pool-fitness.md). Every other multiplayer map of the disc image
# joins the pool, drawn by the players present (data/map_fitness.toml).
# Each entry: map names (`*` matches any run of letters) and why;
# `[[allow]]` entries win over `[[deny]]` and over the measurements'
# flags.
#
# M4 (docs/plans/active/halo-ce.md, 2026-11-15): teleporters work for
# every game's characters (chimera_world's map::teleport, from the
# scenario's pairs) and the climbable surfaces are ladders, so the maps
# whose play goes through teleporters (putput's 30 pairs, boardingaction's
# 8, carousel, chillout, ratrace, wizard) joined the pool; the map_fitness
# sweep counts a teleporter as a link of no length, and found every spawn
# point of every map on one region. Blood Gulch and Sidewinder are vehicle maps measured over
# the pool's size limit: Blood Gulch is allowed (the milestone's map), its
# count rule still keeps it out of a draw by players present (its wander
# time); Sidewinder stays out (below).

[[deny]]
reason = "a vehicle map: its two bases sit at the ends of a canyon about 69000 m2 across, a long walk on foot (wander 18.1 s at 8 players, the rule's limit 10 s), with nothing but its 4 teleporter pairs to shorten it; it waits for vehicles (M6)"
maps = ["sidewinder"]

[[allow]]
reason = "M1's map: its measured area is the flood's cap, not a judgement"
maps = ["bloodgulch"]
