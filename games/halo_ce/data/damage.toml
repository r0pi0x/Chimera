# Halo's damage effects (`jpt!` tags) by our id, in the game's own units
# (points, WU, WU/s, seconds, fractions): specs/halo_ce/projectiles.md,
# "What is on the disc", "Damage effects" (the table and the material
# modifier lists). `games/halo_ce/src/game/vitality/data.rs` reads it at
# startup; the heavy test `tests/it/heavy/vitality_data.rs` checks every
# number against `bloodgulch.map`.
#
# Per effect: `tag`, the tag's path; `category` and `side_effect` by the
# spec's names; `flags`, the damage flags (0x1C8); `no_distance_scaling`,
# the tag's own flag bit 0 (0x00C); `lower` the damage lower bound
# ("minimum", 0x1D0) and `upper` the upper bound pair (0x1D4), points;
# `radius` (0x000), WU; `core`, the area of effect core radius (0x1CC);
# `camo`, the active camouflage damage (0x1E0); `stun`: stun, maximum stun
# and stun time in s (0x1E4 to 0x1EC); `accel`, the instantaneous
# acceleration (0x1F4), WU/s; `passthrough`, the vehicle passthrough
# penalty (0x1DC), where the spec gives one; `modifiers`, the material
# modifiers (0x200) as the spec lists them, a value and its material types
# (codes, ranges with "-"), every type not listed 0.

