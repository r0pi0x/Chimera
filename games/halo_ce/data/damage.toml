# The campaign's (d20's; not on the multiplayer maps): the Hunter's rung
# (`campaign`). The numbers are the tags' as `blam_formats` reads them from
# d20 (characters.md section 8 names the cannon's unit; the spec states
# none of these numbers: the heavy test `heavy/campaign.rs` checks them
# against the disc). The cannon's rod detonates with its explosion (and
# the frag grenade's shock wave, as the rocket's does): 40 points at the
# edge, 75 within 0.5 WU, nothing past 1.5 WU, a push of 4 WU/s; Hunters
# (12, 13) and types 18 and 26 take none of it (characters.md section 5:
# "Hunters are immune to fuel rods").
