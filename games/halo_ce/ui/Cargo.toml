[package]
name = "halo_ce_ui"
version = "0.1.0"
description = "Halo: Combat Evolved's front end on the client shell: its HUD, its weapons' buttons, kill icons and party view, above the game's simulation (`halo_ce`)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The game's simulation, its loader layer (`blam_formats`, which the game
# declares) and the client shell with the presentation; never another game,
# its front end or an app (checks/tests/it/architecture.rs,
# `layers_follow_paths`). Its own crate so that `halo_ce` and its tests
# build without the shell, and a client-side edit selects this crate's
# tests, not the simulation's
# (docs/plans/active/architecture-for-iteration.md, stage 1).
[dependencies]
halo_ce.workspace = true
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
# The score board's network players and settings (`hud::score`).
chimera_net.workspace = true
chimera_client.workspace = true
# The HUD's material and its shader (`hud::material`), the effect lights.
chimera_present.workspace = true
blam_formats.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, as every
# build with the presentation has them, so `cargo test -p halo_ce_ui`
# shares the clients' builds (`selections_share_one_build`).
[dev-dependencies]
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

# The integration tests (tests/it/; the disc's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on).
dev = ["halo_ce/dev", "chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "chimera_client/dev", "chimera_present/dev", "blam_formats/dev"]
