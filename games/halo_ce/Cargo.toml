[package]
name = "halo_ce"
version = "0.1.0"
description = "Halo: Combat Evolved (Xbox) as a game crate: its install, registration and maps so far (docs/plans/active/halo-ce.md)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The layers this crate builds on, beside Chimera (checks/tests/it/architecture.rs,
# `layers_follow_paths`; docs/ARCHITECTURE.md, "Layers by path").
[package.metadata.chimera]
loaders = ["blam"]

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# What only a feature compiles, for the hooks' test selection
# (checks/src/affected.rs): an edit under src/ui/ runs the crates above, not
# the simulation's tests (tests/it/).
[package.metadata.affected]
feature-paths = { ui = ["src/ui/"] }

# The engine's crates and Bevy; never `mashup`, another game or an app, and
# the presentation (`chimera_present`) and the shell only for `ui`
# (checks/tests/it/architecture.rs checks it). Same versions and features as
# the other members' (workspace dependencies), so `cargo test -p halo_ce`
# reuses the workspace's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
# The network's prediction harness for the movement's test (`harness::NetSim`),
# as the other games have it.
chimera_net.workspace = true
# Halo's disc image and install folder as a mount (`game::mount`), its
# map cache files' tags (`game::maps`).
blam_formats.workspace = true
bevy.workspace = true
# The movement's collision queries (shape casts on the engine's colliders).
avian3d.workspace = true
# The map file's hash (`MapData::file_hash`) and the data tables
# (data/*.toml).
sha2.workspace = true
serde.workspace = true
toml.workspace = true
# The front end (`ui`, the `ui` feature): the client shell and the
# presentation it draws with.
chimera_client = { workspace = true, optional = true }
chimera_present = { workspace = true, optional = true }
workspace-hack.workspace = true

[dev-dependencies]
# This crate with its front end (`ui`), as the apps build it: its tests then
# use the one build of it every other selection uses (the workspace's, the
# hooks', `cargo run`'s) instead of a second one without the front end, with
# its own incremental cache (docs/performance.md, "Iteration speed").
halo_ce = { workspace = true, features = ["ui"] }
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it.
chimera_world = { workspace = true, features = ["render"] }
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it.
bevy_winit.workspace = true

# The integration tests (tests/it/; the install's in tests/it/heavy/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Halo's front end (`ui`): its HUD on the client shell. The app turns it on,
# and this crate's own tests (the dev-dependency on itself); the dedicated
# server builds without it.
ui = ["dep:chimera_client", "dep:chimera_present"]
# Bevy as a dynamic library, as an app's `dev` (which turns this on):
# `cargo test -p halo_ce --features dev` shares the apps' Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev", "chimera_net/dev", "chimera_client?/dev", "chimera_present?/dev", "blam_formats/dev"]
