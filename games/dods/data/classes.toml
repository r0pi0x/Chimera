# DoD:S's twelve classes and what each carries (specs/dods/classes.md,
# "Loadouts"): what a player holding one of a class's weapons is in a party
# app (`game::classes`): its body (`body`, a class body id of
# `game::bodies::CLASSES`) and, on a DoD:S rung, its melee weapon in place
# of the kit's (`melee`; the Assault classes carry none: the kit's stays).
#
# `guns`: the class's weapons, primary first (primary, secondary or rifle
# grenade, grenades). A weapon carried by several classes (the Colt, the
# P38, the frags, the knife and spade) makes its holder one of them, drawn
# with the ladder (`classes::HOOK`); its own class, where nothing was
# drawn, is the first class listing it, in this file's order (Allies then
# Axis, classes.md's order). Every class is 100 health and 220 u/s
# (classes.md, "Health and speed"): no numbers here.

[[classes]]
id = "dods:us_rifleman"
melee = "dods:weapon_amerknife"
guns = ["dods:weapon_garand", "dods:weapon_riflegren_us", "dods:weapon_amerknife"]

