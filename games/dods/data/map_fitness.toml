# map_fitness tool (`--write`; docs/plans/active/map-pool-fitness.md): edit
# data/map_pool.toml instead. Per map: its walkable area (m2), mean sight (m),
# the area its spawn spots cover, its spawn points, spawn spots, those off
# the map and those a player is stuck in, and its wander times at 4/8/12
# players (s; read by chimera_sim::minigame::map_fit, which works them out
# again from area and sight at any count).
