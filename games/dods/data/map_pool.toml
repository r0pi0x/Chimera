# DoD:S maps an automatic gun game's pool takes (the Ultimate Gun Game:
# chimera_sim::minigame::map_fit; docs/plans/active/map-pool-fitness.md,
# docs/plans/active/dods.md M3b and section 7). All nine stock maps
# (data/map_fitness.toml, the 2026-11-24 sweep). The spawn spots' walk goes
# through the physics props a DoD:S player gets past (by its turbo physics
# only debris and the multiplayer props asleep since load) and climbs
# DoD:S's jump-ups, and counts what a one-way drop reaches
# (`spawns::DROPS_REACHABLE`, the user's call "we can try it, revert later
# if not good"): six maps had their spawn points on ledges above drops of
# 0.9-1.8 m with no way back (dod_anzio, argentan, colmar, donner, kalt,
# palermo; main regions of 448-2483 of 4519-6576 m2 when only walks to and
# back counted), so their spots covered a part of the map. Now the spots
# cover the whole walkable area of every map (area = the whole flood), no
# spot is off the map and none stuck. To go back to the six's denial,
# flip the constant and list them under [[deny]] again.
# The players present still decide a draw (the wander time: dod_jagd and
# dod_avalanche from 4 players, dod_flash from about 8; the six large ones
# wander 11-15 s at 4 players). Each entry: map names (`*` matches any
# run of letters) and why; `[[allow]]` entries win over `[[deny]]` and over
# the measurements' flags.

[[deny]]
reason = "DoD:S's maps join the pool only when chosen for a free-for-all (the allow list)"
maps = ["*"]

[[allow]]
reason = "the spawn spots cover the whole walkable area (drops count as reached); measured fit"
maps = ["dod_anzio", "dod_argentan", "dod_avalanche", "dod_colmar", "dod_donner", "dod_flash", "dod_jagd", "dod_kalt", "dod_palermo"]
