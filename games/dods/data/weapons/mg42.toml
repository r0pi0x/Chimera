# The MG 42 (specs/dods/weapons.md, "The guns": the script's values):
# 85 a bullet, 2 bullets a shot, 0.05 s between shots (rounded up to ticks),
# 250 rounds and 2 spare clips; automatic, two bullets a shot (weapons.md, open question 2: both traced here); useful only deployed (prone, then the alt fire: `stance`), the ladders' heavy class.
id = "dods:weapon_mg42"
base = "dods:gun"
class = "heavy"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.5151
weight = 25

[ammo."dods:mg42"]
# The spare clips (2) of 250 rounds.
max = 500

[trigger]
automatic = true
cycle = 0.05

[magazine]
clip = 250
ammo = "dods:mg42"
# Measured, empty (weapons.md, "Draw and reload times"); deployed only (`dods:mg`).
reload = 4.71

[hitscan]
pellets = 2
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.2 }

[damage]
amount = 85.0

[hooks."dods:gun"]
script = "weapon_mg42"
accuracy = 0.2
alt_accuracy = 0.025
move_penalty = 0.1
recoil = 20.0

[hooks."dods:mg"]
# weapons.md, "Alt fire" (measured): the first shot 1.1667 s after
# deploying, the next 1.1667 s after undeploying; 45 degrees either way
# of the deploy (the limit fields); 15 stamina a shot fired undeployed
# (100 to 85; open question 4).
deploy_time = 1.1667
undeploy_time = 1.1667
yaw_limit = 45.0
stamina_per_shot = 15.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "mg", reload_anim_prefix "mg42" (no such reload in the model: the MG's),
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_MG).
suffix = "MG"

[hud]
name = "MG 42"
