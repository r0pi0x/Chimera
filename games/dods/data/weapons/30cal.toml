# The .30 Cal (specs/dods/weapons.md, "The guns": the script's values):
# 85 a bullet, 1 bullet a shot, 0.1 s between shots (rounded up to ticks),
# 150 rounds and 3 spare clips; automatic; useful only deployed (prone, then the alt fire: `stance`), the ladders' heavy class.
id = "dods:weapon_30cal"
base = "dods:gun"
class = "heavy"
slot = 0
# Unmeasured (weapons.md, open question 10): a stand-in draw time.
draw = 1.0
weight = 25

[ammo."dods:30cal"]
# The spare clips (3) of 150 rounds.
max = 450

[trigger]
automatic = true
cycle = 0.1

[magazine]
clip = 150
ammo = "dods:30cal"
# Unmeasured (weapons.md, open question 9: the view model's sequence).
reload = 2.5

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.2 }

[damage]
amount = 85.0

[hooks."dods:gun"]
script = "weapon_30cal"
accuracy = 0.2
alt_accuracy = 0.01
move_penalty = 0.1
recoil = 20.0

[hooks."dods:mg"]
# weapons.md, "Alt fire" (measured): the first shot about 1.2 s after
# deploying; 15 stamina a shot fired undeployed (100 to 85; open question 4).
deploy_time = 1.2
stamina_per_shot = 15.0

[hud]
name = ".30 Cal"
