# The .30 Cal (specs/dods/weapons.md, "The guns": the script's values):
# 85 a bullet, 1 bullet a shot, 0.1 s between shots (rounded up to ticks),
# 150 rounds and 3 spare clips; automatic; useful only deployed (prone, then the alt fire: `stance`), the ladders' heavy class.
id = "dods:weapon_30cal"
base = "dods:gun"
class = "heavy"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.3334
weight = 25

[ammo."dods:30cal"]
# The spare clips (3) of 150 rounds.
max = 450

[trigger]
automatic = true
cycle = 0.1

[magazine]
clip = 150
ammo = "dods:30cal"
# Measured, empty (weapons.md, "Draw and reload times"); deployed only (`dods:mg`).
reload = 4.6

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.2 }

[damage]
amount = 85.0

[hooks."dods:gun"]
script = "weapon_30cal"
accuracy = 0.2
alt_accuracy = 0.01
move_penalty = 0.1
recoil = 20.0

[hooks."dods:mg"]
# weapons.md, "Alt fire" (measured): the first shot 1.2163 s after
# deploying, the next 1.3635 s after undeploying; 45 degrees either way
# of the deploy (the limit fields); 15 stamina a shot fired undeployed
# (100 to 85; open question 4).
deploy_time = 1.2163
undeploy_time = 1.3635
yaw_limit = 45.0
stamina_per_shot = 15.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "30cal",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_30CAL).
suffix = "30CAL"

[hud]
name = ".30 Cal"
