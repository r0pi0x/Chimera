# The Thompson (specs/dods/weapons.md, "The guns": the script's values):
# 40 a bullet, 1 bullet a shot, 0.085 s between shots (rounded up to ticks),
# 30 rounds and 7 spare clips; automatic (measured: a shot every 6 ticks).
id = "dods:weapon_thompson"
base = "dods:gun"
class = "smg"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 0.9376
weight = 25

[ammo."dods:thompson"]
# The spare clips (7) of 30 rounds.
max = 210

[trigger]
automatic = true
cycle = 0.085

[magazine]
clip = 30
ammo = "dods:thompson"
# Measured, empty (weapons.md, "Draw and reload times").
reload = 3.0

[hitscan]
pellets = 1
# `Accuracy` as the spread (weapons.md, "Spread"), drawn as DoD:S's
# seeded pattern (spread.md); `dods:gun` sets it each shot.
spread = { template_disc = 0.055 }

[damage]
amount = 40.0

# The alt fire: the stock strike (weapons.md, "Alt fire"; damage.md,
# "Melee"; measured): the knife's timing and reach, 60 before the hit
# zones, no backstab; the attack fires the gun (no [melee.primary]).
[melee.secondary]
range = 77.0
# The box the swing sweeps when the line misses (damage.md, open question
# 4: its shape is ours): 52 units across, swept 51 so it reaches no
# further than the line, wide enough to hit a player 45 degrees off the aim
# at 56 units (measured).
hull = 26.0
hull_reach = 51.0
facing_cos = 0.5
damage = 60.0
hitgroup_scale = { head = 2.5, chest = 1.0, stomach = 1.0, arm = 0.75, leg = 0.75 }
# Measured: the hit 14 ticks (0.21 s) after the press; every attack
# blocked 0.4 s from the press (not the script's FireDelay 0.1).
delay = 0.21
hit_refire = 0.4
miss_refire = 0.4
miss_refire_other = 0.4
force = 0.0
kind = "melee"
armor_ratio = 1.0
quantum = 0.0

[hooks."dods:gun"]
script = "weapon_thompson"
accuracy = 0.055
move_penalty = 0.1
recoil = 2.15

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "tommy",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_TOMMY).
suffix = "TOMMY"

[hud]
name = "Thompson"
