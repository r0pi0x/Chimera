# The StG 44 (specs/dods/weapons.md, "The guns": the script's values):
# 50 a bullet, 1 bullet a shot, 0.12 s between shots (rounded up to ticks),
# 30 rounds and 7 spare clips; automatic; its alt fire selects semi-automatic fire, one shot each 0.3 s at the most.
id = "dods:weapon_mp44"
base = "dods:gun"
class = "rifle"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.1291
weight = 25

[ammo."dods:mp44"]
# The spare clips (7) of 30 rounds.
max = 210

[trigger]
automatic = true
cycle = 0.12

[magazine]
clip = 30
ammo = "dods:mp44"
# Measured, empty (weapons.md, "Draw and reload times").
reload = 3.2354

[hitscan]
pellets = 1
# `Accuracy` as the spread (weapons.md, "Spread"), drawn as DoD:S's
# seeded pattern (spread.md); `dods:gun` sets it each shot.
spread = { template_disc = 0.025 }

[damage]
amount = 50.0

[alt]
# Fire select (weapons.md, "Alt fire", measured): the alt fire toggles
# semi-automatic fire, no sights (the field of view unchanged): one shot a
# press, the next 0.3 s on (`SecondaryFireDelay`), the spread then the
# script's `SecondaryAccuracy` (`dods:gun`); again, full auto. How long the
# switch takes is unmeasured: the next attack a tick on.
kind = "burst"
count = 1
interval = 0.0
refire = 0.3
once_per_press = true
step = 0.015

[hooks."dods:gun"]
script = "weapon_mp44"
accuracy = 0.025
alt_accuracy = 0.02
move_penalty = 0.1
recoil = 5.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "stg44",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_MP44).
suffix = "MP44"

[hud]
name = "StG 44"
