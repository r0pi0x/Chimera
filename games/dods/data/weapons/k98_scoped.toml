# The Scoped Karabiner 98k (specs/dods/weapons.md, "The guns": the script's values):
# 120 a bullet, 1 bullet a shot, 1.6 s between shots (rounded up to ticks),
# 5 rounds and 13 spare clips; bolt action.
id = "dods:weapon_k98_scoped"
base = "dods:gun"
class = "sniper"
slot = 0
# Unmeasured (weapons.md, open question 10): a stand-in draw time.
draw = 1.0
weight = 25

[ammo."dods:k98_scoped"]
# The spare clips (13) of 5 rounds.
max = 65

[trigger]
automatic = false
cycle = 1.6

[magazine]
clip = 5
ammo = "dods:k98_scoped"
# Unmeasured (weapons.md, open question 9: the view model's sequence).
reload = 2.5

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.06 }

[damage]
amount = 120.0

[alt]
kind = "scope"
# The scope (weapons.md, "Alt fire": as the iron sights, 0.49 s before
# the next shot). Its field of view is unmeasured: a stand-in.
fov = [20.0]
overlay = true
step = 0.49

[hooks."dods:gun"]
script = "weapon_k98_scoped"
accuracy = 0.06
alt_accuracy = 0.0
move_penalty = 0.1
recoil = 6.0

[hud]
name = "Scoped Karabiner 98k"
