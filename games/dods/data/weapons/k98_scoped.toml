# The Scoped Karabiner 98k (specs/dods/weapons.md, "The guns": the script's values):
# 120 a bullet, 1 bullet a shot, 1.6 s between shots (rounded up to ticks),
# 5 rounds and 13 spare clips; bolt action.
id = "dods:weapon_k98_scoped"
base = "dods:gun"
class = "sniper"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.1
weight = 25

[ammo."dods:k98_scoped"]
# The spare clips (13) of 5 rounds.
max = 65

[trigger]
automatic = false
cycle = 1.6

[magazine]
clip = 5
ammo = "dods:k98_scoped"
# Measured, empty (weapons.md, "Draw and reload times").
reload = 4.2122

[hitscan]
pellets = 1
# `Accuracy` as the spread (weapons.md, "Spread"), drawn as DoD:S's
# seeded pattern (spread.md); `dods:gun` sets it each shot.
spread = { template_disc = 0.06 }

[damage]
amount = 120.0

[alt]
kind = "scope"
# The scope (weapons.md, "Alt fire": as the iron sights, 0.49 s before
# the next shot). Its field of view, 20 (measured; `dods:gun` sets it 0.315 s after the
# press).
fov = [20.0]
overlay = true
step = 0.49

[hooks."dods:gun"]
script = "weapon_k98_scoped"
accuracy = 0.06
alt_accuracy = 0.0
move_penalty = 0.1
recoil = 6.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "bolt",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_BOLT).
suffix = "BOLT"

[hud]
name = "Scoped Karabiner 98k"
