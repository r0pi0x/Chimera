# The US knife (specs/dods/weapons.md, "The guns"; damage.md, "Melee"): 60
# a hit from the front, five times that from behind (300) when the
# attacker's aim . the victim's level facing is over 0.3, the hit zones'
# multipliers on both (a leg 45, or 225 from behind). Measured: the hit
# 0.21 s after the press, 0.4 s between swings (a backstab: 0.405 s and
# 0.9 s), reach 92 between the two players' origins (aim level).
id = "dods:weapon_amerknife"
base = "dods:base"
slot = 2
# Measured (weapons.md, "Draw and reload times").
draw = 1.0
weight = 0
undroppable = true

[melee.primary]
range = 77.0
# The box the swing sweeps when the line misses (damage.md, open question
# 4: its shape is ours): 52 units across, swept 51 so it reaches no
# further than the line, wide enough to hit a player 45 degrees off the aim
# at 56 units (measured).
hull = 26.0
hull_reach = 51.0
facing_cos = 0.5
damage = 60.0
# From behind when the attacker's aim . the victim's level facing > 0.3
# (measured, standing, crouched and prone victims alike): five times the
# hit. A backstab is a slower swing, settled on the press (a victim facing
# away in reach then): it lands 27 ticks (0.405 s) after the press and
# blocks every attack 0.9 s (measured, damage.md "Melee").
backstab = { aim_dot = 0.3, damage = 300.0, delay = 0.405, refire = 0.9 }
hitgroup_scale = { head = 2.5, chest = 1.0, stomach = 1.0, arm = 0.75, leg = 0.75 }
# Measured: the hit 14 ticks (0.21 s) after the press; every attack
# blocked 0.4 s from the press (not the script's FireDelay 0.1).
delay = 0.21
hit_refire = 0.4
miss_refire = 0.4
miss_refire_other = 0.4
# dod_meleeattackforcescale 8 is a ragdoll scale; unmeasured as a push.
force = 0.0
kind = "melee"
armor_ratio = 1.0
quantum = 0.0

[hooks."dods:melee"]
script = "weapon_amerknife"

[hooks."dods:hit_slow"]
body = 0.5
legs = 2.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "knife",
# as the shared player model names its activities (ACT_DOD_STAND_AIM_KNIFE).
suffix = "KNIFE"

[hud]
name = "US knife"
