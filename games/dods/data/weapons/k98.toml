# The Karabiner 98k (specs/dods/weapons.md, "The guns": the script's values):
# 110 a bullet, 1 bullet a shot, 1.6 s between shots (rounded up to ticks),
# 5 rounds and 13 spare clips; bolt action: the next shot waits the fire delay (weapons.md, "Fire modes").
id = "dods:weapon_k98"
base = "dods:gun"
class = "marksman"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.1
weight = 25

[ammo."dods:k98"]
# The spare clips (13) of 5 rounds.
max = 65

[trigger]
automatic = false
cycle = 1.6

[magazine]
clip = 5
ammo = "dods:k98"
# Measured, empty (weapons.md, "Draw and reload times").
reload = 2.8125

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.014 }

[damage]
amount = 110.0

[alt]
kind = "scope"
# Iron sights (weapons.md, "Alt fire"): the next shot waits 0.49 s
# (measured on the Garand; `dods:gun` makes the step block the primary).
# The sights' field of view, 55 (measured; `dods:gun` sets it 0.315 s
# after the press).
fov = [55.0]
step = 0.49

[hooks."dods:gun"]
script = "weapon_k98"
accuracy = 0.014
alt_accuracy = 0.0
move_penalty = 0.15
recoil = 8.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "bolt",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_BOLT).
suffix = "BOLT"

[hud]
name = "Karabiner 98k"
