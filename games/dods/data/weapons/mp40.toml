# The MP40 (specs/dods/weapons.md, "The guns": the script's values):
# 40 a bullet, 1 bullet a shot, 0.09 s between shots (rounded up to ticks),
# 30 rounds and 7 spare clips; automatic.
id = "dods:weapon_mp40"
base = "dods:gun"
class = "smg"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.4001
weight = 25

[ammo."dods:mp40"]
# The spare clips (7) of 30 rounds.
max = 210

[trigger]
automatic = true
cycle = 0.09

[magazine]
clip = 30
ammo = "dods:mp40"
# Measured, empty (weapons.md, "Draw and reload times").
reload = 3.3636

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.055 }

[damage]
amount = 40.0

[hooks."dods:gun"]
script = "weapon_mp40"
accuracy = 0.055
move_penalty = 0.1
recoil = 2.2

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "mp40",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_MP40).
suffix = "MP40"

[hud]
name = "MP40"
