# The Panzerschreck (specs/dods/weapons.md, "Rockets", "Alt fire"; damage.md,
# "Explosions"; measured): shouldered by the alt fire (the next shot
# 0.79 s later; again, or held past that, lowered: 0.99 s), it fires only
# shouldered, its holder then at most 50 units/s. The rocket leaves the
# eye along the aim at 1300 units/s with 0.1 of the gravity (80 units/s²)
# and explodes on a player or the world (measured): 150 x (1 - r / 200)
# (mp_rocketdamage, mp_rocketradius). One in the launcher, five spare (the
# script's); after a shot it takes nothing, not even the reload key, for
# 2.33 s (the cycle); reloaded only by the key, in 3.0 s (measured).
id = "dods:weapon_pschreck"
base = "dods:base"
class = "launcher"
slot = 0
# Measured (weapons.md, "Draw and reload times").
draw = 1.0
weight = 25

[ammo."dods:pschreck"]
max = 5

[trigger]
automatic = false
cycle = 2.33
timing = "set"

[magazine]
clip = 1
ammo = "dods:pschreck"
# Measured; only by the key (`explosives::key_reloads`).
reload = 3.0

# Without [damage] the frame traces nothing: the round is a rocket.
[hitscan]
range = 8192.0
pellets = 1
punch_scale = 0.0
spread = { template_disc = 0.0 }

[hooks."chimera:projectile"]
shown = "dods:weapon_pschreck/projectile"
speed = 1300.0
gravity = 80.0
touch = "explode"
half = [2.0, 2.0, 2.0]
life = 10.0

[hooks."dods:rocket"]
script = "weapon_pschreck"
# The projectile's own model (the pak's; the script names only the
# weapon's view and world models), drawn by the key `<id>/projectile`.
model = "models/weapons/w_panzerschreck_rocket.mdl"
damage = 150.0
radius = 200.0
shoulder_time = 0.79
unshoulder_time = 0.99

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the set the shared player model has for it
# (ACT_DOD_STAND_IDLE_PSCHRECK).
suffix = "PSCHRECK"

[hud]
name = "Panzerschreck"
