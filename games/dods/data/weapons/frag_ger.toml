# The German stick grenade (specs/dods/weapons.md, "Grenades"; damage.md,
# "Explosions"; measured): one in hand, thrown with the attack (left
# click). The pin comes out on the press and the fuse runs from it, thrown
# or not: it goes off 5.1 s after the press (335-347 ticks measured), in
# the hand when held that long. Thrown from the eye at 500 units/s, 10
# degrees above the aim squeezed (aiming A up: 10 + A x 80/90; D down:
# 10 - D x 100/90), faster aiming more than 22.5 degrees up (500 + 250 x
# (A - 22.5) / 67.5, at most dod_grenademaxspeed 1400), with half the
# thrower's velocity along the aim, under dod_grenadegravity 420. The blast
# 150 x (1 - r / 375), a clear line needed, the thrower hurt too (the
# script's Damage 180 isn't it). Both nations' alike (measured).
id = "dods:weapon_frag_ger"
base = "dods:base"
# A grenade that kills: the ladders' grenade rung.
class = "grenade"
slot = 3
# Unmeasured: a stand-in draw time.
draw = 1.0
weight = 1
undroppable = true

[hooks."dods:grenade"]
script = "weapon_frag_ger"
# The projectile's own model (the pak's; the script names only the
# weapon's view and world models), drawn by the key `<id>/projectile`.
model = "models/weapons/w_stick.mdl"
damage = 150.0
radius = 375.0
fuse = 5.1
gravity = 420.0
lift = 10.0
scale_up = 0.888889
scale_down = 1.111111
# Measured (weapons.md, "Grenades"): 500 + 250 x (A - 22.5) / 67.5 aiming
# A degrees up above 22.5; about half the thrower's velocity along the aim.
speed_knee = 22.5
speed_per_deg = 3.7037
speed_min = 500.0
speed_max = 1400.0
carry = 0.5
# Measured: the press blocks the weapon 0.667 s (the windup); the next
# grenade is drawn once that is over and the grenade has left, ready
# 0.667 s later.
pin_time = 0.667
redraw_time = 0.667

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the set the shared player model has for it
# (ACT_DOD_STAND_AIM_GREN_STICK).
suffix = "GREN_STICK"

[hud]
name = "Stick grenade"
