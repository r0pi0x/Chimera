# The M1 Garand (specs/dods/weapons.md, "The guns": the script's values):
# 80 a bullet, 1 bullet a shot, 0.37 s between shots (rounded up to ticks),
# 8 rounds and 11 spare clips; semi-automatic; reloads only when empty (weapons.md, "Fire modes").
id = "dods:weapon_garand"
base = "dods:gun"
class = "rifle"
slot = 0
# Unmeasured (weapons.md, open question 10): a stand-in draw time.
draw = 1.0
weight = 25

[ammo."dods:garand"]
# The spare clips (11) of 8 rounds.
max = 88

[trigger]
automatic = false
cycle = 0.37

[magazine]
clip = 8
ammo = "dods:garand"
# Unmeasured (weapons.md, open question 9: the view model's sequence).
reload = 2.5

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.014 }

[damage]
amount = 80.0

[alt]
kind = "scope"
# Iron sights (weapons.md, "Alt fire"): the next shot waits 0.49 s
# (measured on the Garand; `dods:gun` makes the step block the primary).
# The sighted field of view is unmeasured: a stand-in.
fov = [55.0]
step = 0.49

[hooks."dods:gun"]
script = "weapon_garand"
accuracy = 0.014
alt_accuracy = 0.0
move_penalty = 0.1
recoil = 4.0
reload_when_empty = true

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "rifle", reload_anim_prefix "garand" (no such reload in the model: the rifle's),
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_RIFLE).
suffix = "RIFLE"

[hud]
name = "M1 Garand"
