# The BAR (specs/dods/weapons.md, "The guns": the script's values):
# 50 a bullet, 1 bullet a shot, 0.12 s between shots (rounded up to ticks),
# 20 rounds and 13 spare clips; automatic; sighted, its alt fire delay 0.3 is unapplied (weapons.md, open question 3).
id = "dods:weapon_bar"
base = "dods:gun"
class = "rifle"
slot = 0
# Unmeasured (weapons.md, open question 10): a stand-in draw time.
draw = 1.0
weight = 25

[ammo."dods:bar"]
# The spare clips (13) of 20 rounds.
max = 260

[trigger]
automatic = true
cycle = 0.12

[magazine]
clip = 20
ammo = "dods:bar"
# Unmeasured (weapons.md, open question 9: the view model's sequence).
reload = 2.5

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.025 }

[damage]
amount = 50.0

[alt]
kind = "scope"
# Iron sights (weapons.md, "Alt fire"): the next shot waits 0.49 s
# (measured on the Garand; `dods:gun` makes the step block the primary).
# The sighted field of view is unmeasured: a stand-in.
fov = [55.0]
step = 0.49

[hooks."dods:gun"]
script = "weapon_bar"
accuracy = 0.025
alt_accuracy = 0.02
move_penalty = 0.1
recoil = 5.0

[hud]
name = "BAR"
