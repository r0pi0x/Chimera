# The C96 (specs/dods/weapons.md, "The guns": the script's values):
# 40 a bullet, 1 bullet a shot, 0.065 s between shots (rounded up to ticks),
# 20 rounds and 3 spare clips; semi-automatic (assumed for the pistols, weapons.md "Fire modes").
id = "dods:weapon_c96"
base = "dods:gun"
class = "pistol"
slot = 1
# Unmeasured (weapons.md, open question 10): a stand-in draw time.
draw = 0.5
weight = 5

[ammo."dods:c96"]
# The spare clips (3) of 20 rounds.
max = 60

[trigger]
automatic = false
cycle = 0.065

[magazine]
clip = 20
ammo = "dods:c96"
# Unmeasured (weapons.md, open question 9: the view model's sequence).
reload = 2.0

[hitscan]
pellets = 1
# `Accuracy` as a cone's half-angle sine (weapons.md, open question 1:
# CS:S's seeded spread assumed); `dods:gun` sets it each shot.
spread = { cone = 0.065 }

[damage]
amount = 40.0

[hooks."dods:gun"]
script = "weapon_c96"
accuracy = 0.065
move_penalty = 0.1
recoil = 3.0

[hooks."dods:body_anim"]
# The body's animations (`player_anim`): the script's anim_prefix "pistol",
# as the shared player model names its activities (ACT_DOD_STAND_IDLE_PISTOL).
suffix = "PISTOL"

[hud]
name = "C96"
