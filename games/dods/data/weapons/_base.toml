# DoD:S's weapons' shared base: Source units (inches) and hit points
# (specs/dods/weapons.md, "Units and conventions"). The format:
# docs/weapon-data.md. M0 has one stand-in gun (colt.toml) so a DoD:S body
# can be worn in the party apps; M1 reads the guns' numbers from the
# install's scripts (`scripts/weapon_<id>.txt`, plain KeyValues).
id = "dods:base"
abstract = true
units = { length = 0.0254, damage = 0.01 }

[ammo."dods:colt"]
# The script's spare clips (3) of 7 rounds (weapons.md, "The guns").
max = 21
