# FAMAS (specs/cs16/weapons.md, "The guns").
id = "cs16:weapon_famas"
base = "cs16:gun"
class = "rifle"
slot = 0
draw = 0.75
max_speed = 240.0
weight = 25

[buy]
price = 2250
team = 2

[trigger]
automatic = true
cycle = 0.0825

[magazine]
