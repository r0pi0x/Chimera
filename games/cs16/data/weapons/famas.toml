# The burst: its first round 34; the follow-ups the first's spread, 30, no kick.
burst_first = 34.0
follow_ups = { amount = 30.0, falloff = 0.96 }

[hooks."cs16:gun".spread]
air = [0.04, 0.3]
moving = [[140.0, 0.04, 0.07]]
