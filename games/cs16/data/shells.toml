# CS 1.6's shell ejection per gun (specs/cs16/shells.md): the case model
# (`models/<model>.mdl`), the bounce sound type (`brass`: pl_shell1-3,
# `shotgun`: sshell1-3), the first-person start offset from the eye
# (forward `f`, up `up`, right `r` for a right-handed player; `f_left`:
# the forward offset when left-handed, where it differs; `r` is the
# right gun's for the Elites), and, for the guns that throw it late, the
# `late` delay in seconds after the shot.

[glock18]
model = "pshell"
f = 36
up = -14
r = 14

