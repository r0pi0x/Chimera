[package]
name = "cs16_ui"
version = "0.1.0"
description = "Counter-Strike 1.6's front end on the client shell, above the game's simulation (`cs16`): its HUD"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The game's simulation and the client shell; never another game, its
# front end or an app (checks/tests/it/architecture.rs, `layers_follow_paths`).
[dependencies]
cs16.workspace = true
chimera_core.workspace = true
chimera_sim.workspace = true
chimera_world.workspace = true
chimera_client.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The tests' own: the presentation's Bevy and Avian features, as every
# build with the presentation has them (`selections_share_one_build`).
[dev-dependencies]
chimera_world = { workspace = true, features = ["render"] }
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
bevy_winit.workspace = true

# The integration tests (tests/it/).
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as an app's `dev` (which turns this on).
dev = ["cs16/dev", "chimera_core/dev", "chimera_sim/dev", "chimera_world/dev", "chimera_client/dev"]
