# nextest settings (cargo nextest run). Memory, not CPU, is the limit on
# shared dev machines: a heavy test loads a real map (median ~1.1 GB peak
# RSS, a quarter over 1.7 GB, a few 3.5-6.6 GB: big surf textures, the
# soak's five apps), and nextest's default of one test per CPU thread ran
# 12+ of them at once and pushed the box into swap. Measured 2026-10-14
# (docs/performance.md, "Test cycle"): the heavy tests are ~80% of the
# suite's test time, so their slots set the wall time.

[profile.default]
test-threads = 8
# Say which tests run long, and kill a hung one. Outside `heavy::` the
# slowest took 53 s on a busy box (load ~20 on 12 threads, 2026-10-19):
# killed after 5 minutes. Heavy tests get 12 and the soak 30 (overrides
# below).
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
# Five heavy tests at once (~6 GB typical); the big ones take more slots.
heavy = { max-threads = 5 }

# Overrides apply first match first, per setting. Tests are named by test
# binary (`binary_id(<package>::<binary>)`: each crate's tests/it/ is its
# `it`) and module path (`heavy::<file>::<test>`).

# The soak: 6.6 GB, and the longest test (3-8 minutes with the box's
# load); start it first so it doesn't end the run alone.
[[profile.default.overrides]]
filter = 'binary_id(cs_source::it) & test(/^heavy::net_soak::/)'
test-group = 'heavy'
threads-required = 3
priority = 100
slow-timeout = { period = "180s", terminate-after = 10 }

# Combat Arms' map sweeps convert an archive's maps two at a time
# (threads; 2.3 GB, 15-30 s alone, 2026-10-19). Before `load_world` left
# out the view models every map shares, a Combat Arms map load took
# ~10 GB and 17 s, and the one test over the 33 plain maps ran 17-20
# minutes beside four others like it: the box ran out of memory.
[[profile.default.overrides]]
filter = 'binary_id(combat_arms::it) & test(/^heavy::world::(every_plain_map_converts|keyed_maps_)/)'
test-group = 'heavy'
threads-required = 2
priority = 80

# The capacity test: a server and four clients like the soak, 32
# characters; weighted like it until measured on its own.
[[profile.default.overrides]]
filter = 'binary_id(cs_source::it) & test(/^heavy::net_capacity::/)'
test-group = 'heavy'
threads-required = 3
priority = 95

# Heavy tests that peak at 3-5 GB take two slots.
[[profile.default.overrides]]
filter = '''
binary_id(cs_source::it) & (
test(/^heavy::map_stock::water_materials$/)
| test(/^heavy::map_surf::/)
| test(/^heavy::map_community::(other_rooms_items_and_water_are_culled_on_creative_multigames|moving_water_is_culled_on_jacks)$/)
| test(/^heavy::map_brush_entities::brush_entities_(draw_merged_until_they_change|share_materials)$/)
| test(/^heavy::map_net_weapons::/)
| test(/^heavy::map_visuals::detail_props_load$/)
| test(/^heavy::map_brush_decals::/)
| test(/^heavy::map_ladders::/)
)
'''
test-group = 'heavy'
threads-required = 2

# de_nuke's ladder tests climb in several worlds at once (threads): 6 GB.
[[profile.default.overrides]]
filter = 'binary_id(cs_source::it) & test(/^heavy::map_de_nuke::/)'
test-group = 'heavy'
threads-required = 3

# The long ones (over a minute alone) start early.
[[profile.default.overrides]]
filter = 'binary_id(cs_source::it) & test(/^heavy::map_courses::(kz_bhop_izanami|kz_bhop_skodna|bhop_myztek)$/)'
test-group = 'heavy'
priority = 90

# The dedicated server's memory over a session of maps: 2.4-2.9 GB in use
# with the installs, beside the client-side heavy tests of its crate
# (2026-11-11: with the box in swap, `map_swap_frames` beside it missed its
# 120 s for one load).
[[profile.default.overrides]]
filter = 'binary_id(ultimate_gun_game::it) & test(/^heavy::server_map_memory::/)'
test-group = 'heavy'
threads-required = 2

# The session tests play whole ladders on several real maps in one process:
# `session_materials`'s four tests take 4-8 minutes each (it was one test of
# 13-17, killed at the heavy tests' 720 s on 00e10257), `session_maps` 535 s
# and more. 60 minutes
# (period 300 s x 12) leaves room on a loaded box; they start early.
[[profile.default.overrides]]
filter = 'binary_id(ultimate_gun_game::it) & (test(/^heavy::session_materials::/) | test(/^heavy::session_maps::/))'
test-group = 'heavy'
priority = 90
slow-timeout = { period = "300s", terminate-after = 12 }

# The on-demand guard: a dedicated server in the test process (about 2 GB
# with the installs) and an offscreen client process without installs
# (about 2.2 GB), a three-map session: 215-320 s on a loaded box
# (2026-11-12).
[[profile.default.overrides]]
filter = 'binary_id(ultimate_gun_game::it) & test(/^heavy::no_fetch_in_match::/)'
test-group = 'heavy'
threads-required = 2
priority = 85
slow-timeout = { period = "300s", terminate-after = 4 }

# The spawn sweep's own limit: 449 s and 602 s, then past the heavy tests'
# 12 minutes three times with agents building (2026-11-09). 30 minutes,
# like the soak.
[[profile.default.overrides]]
filter = 'binary_id(party_kit::server) & test(/^heavy::spawns::every_pool_map_s_spawn_spots_are_inside_it$/)'
slow-timeout = { period = "180s", terminate-after = 10 }

# The longest besides the soak (2-3 minutes: every pool map loaded in
# turn) and Combat Arms' skins of every rung (2 minutes): party_kit's
# sweep ended every run alone, its binary's turn coming last
# (2026-10-31, the map-cache-2 runs: the last of 625 tests in each).
[[profile.default.overrides]]
filter = '(binary_id(party_kit::server) & test(/^heavy::spawns::every_pool_map_s_spawn_spots_are_inside_it$/)) | (binary_id(combat_arms::it) & test(/^heavy::body_skins::every_rung_bodys_skins_resolve$/))'
test-group = 'heavy'
priority = 90

# Every crate's heavy tests (`heavy::` in its test binaries) share the
# slots. The longest besides the soak took ~2 minutes on a busy box:
# killed after 12.
[[profile.default.overrides]]
filter = 'test(/^heavy::/)'
test-group = 'heavy'
slow-timeout = { period = "120s", terminate-after = 6 }

# scripts/testbench.ps1: the same suite, with per-test times written as
# JUnit under target/testbench/ for the benchmark's slowest-tests table.
# Not a CI profile; it changes no test selection.
[profile.bench]
inherits = "default"

[profile.bench.junit]
path = "target/testbench/junit.xml"

# The fast tier at the default 8 test processes: 12 was measured at 89 s
# before the melee/projectile merge, then peaked at 39 GB after it (swap).
# Kept as a named profile for the testbench; the default stays 8.
[profile.fast]
inherits = "bench"
test-threads = 8
