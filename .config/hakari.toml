# `cargo hakari` settings (https://docs.rs/cargo-hakari/latest/cargo_hakari/config).
#
# The workspace-hack (chimera/workspace-hack) lists the third-party crates
# the members build with different features, with all of them, and every
# member depends on it: so `cargo test -p <crate>` builds Bevy and the rest
# with the same features as the whole workspace and reuses its builds
# instead of building them again (docs/performance.md, "Workspace-hack").
#
# After changing a dependency or its features: `cargo hakari generate`
# (and `cargo hakari manage-deps -y` for a new member); `cargo hakari
# verify` checks it is current.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# `workspace-hack.workspace = true` in the members (the root's
# [workspace.dependencies] has the path).
workspace-hack-line-style = "workspace-dotted"

resolver = "2"

# The game builds on Linux and Windows.
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Not simulated: `chimera_dev` carries Bevy's development features
# (dynamic linking, the remote protocol, Chrome traces), which every
# crate's `dev`/`profile` turns on through it. Hakari simulates each member
# with all its features; without this, the hack would turn them on for
# every build, release builds included.
[traversal-excludes]
workspace-members = ["chimera_dev"]

# Simulated (their dependencies' features count) but not given the hack:
# the asset store (`chimera_assets`, plain data over the VFS), the format readers (Source's and LithTech's) and Source's tools stay plain data without Bevy
# (`cargo test -p source_formats` builds in seconds), as do the
# repository's checks (`repo_checks`: the hooks build it first), and
# `chimera_dev` isn't managed.
[final-excludes]
workspace-members = ["chimera_vfs", "chimera_formats", "chimera_assets", "source_formats", "lithtech_formats", "source_tools", "chimera_dev", "repo_checks"]
# Also not given the hack: the crates only the presentation (render, window,
# input devices, audio) builds. A hack entry is a normal dependency of every
# member, so listing them made the dedicated servers compile them (A5):
# `bevy` (its `wav` is audio), `bevy_internal`, `bevy_render`, `bevy_winit`,
# `bevy_window`, `bevy_input`, `bevy_light` (webgl), `bevy_picking`, wgpu, `avian3d` (debug plugin).
# A build of the clients unifies their features by itself; the simulation
# crates take the presentation's Bevy as a dev-dependency, so their own
# tests still share the clients' builds (docs/performance.md,
# "Workspace-hack").
third-party = [
    { name = "avian3d" },
    { name = "bevy" },
    { name = "bevy_internal" },
    { name = "bevy_render" },
    { name = "bevy_winit" },
    { name = "bevy_window" },
    { name = "bevy_input" },
    { name = "bevy_light" },
    { name = "bevy_picking" },
    { name = "wgpu" },
    { name = "wgpu-core" },
]
