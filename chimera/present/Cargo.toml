[package]
name = "chimera_present"
version = "0.1.0"
description = "The engine's presentation: drawing and audio of the map and what it simulates"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The map it presents (`chimera_world`), the engine's base, Bevy and
# physics; never `mashup` or a game (checks/tests/it/architecture.rs checks it).
# Same versions and features as the game's (workspace dependencies), so
# `cargo test -p chimera_present` reuses the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world = { workspace = true, features = ["render"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it:
# without this line a build that leaves the client shell out builds another
# bevy_winit, and with it another Bevy and every crate of ours.
bevy_winit.workspace = true
bevy = { workspace = true, features = ["default", "wav"] }
half.workspace = true
image.workspace = true
workspace-hack.workspace = true

# The WAV reader decodes what playback writes (tests/it/wav_playback.rs).
[dev-dependencies]
chimera_formats.workspace = true

# The integration tests (tests/it/): the renderer's and audio's spec cases.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_present --features dev` shares the game's Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev"]
