[package]
name = "chimera_sim"
version = "0.1.0"
description = "The simulation's frameworks: weapons, movement implementations, the rule-module interface"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base and the simulation's map, Bevy and physics; never the
# presentation (`chimera_present`), `mashup` or a game
# (checks/tests/it/architecture.rs checks it). Same versions and features as the
# game's (workspace dependencies), so `cargo test -p chimera_sim` reuses
# the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
avian3d.workspace = true
bevy.workspace = true
postcard.workspace = true
serde.workspace = true
toml.workspace = true
workspace-hack.workspace = true

# The integration tests (tests/it/) run on the test kit (feature `testkit`).
[dev-dependencies]
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it (docs/performance.md, "Iteration speed").
chimera_world = { workspace = true, features = ["render"] }
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it:
# without this line a build that leaves the client shell out builds another
# bevy_winit, and with it another Bevy and every crate of ours.
bevy_winit.workspace = true
chimera_sim = { workspace = true, features = ["testkit"] }

# The integration tests (tests/it/): the engine's movement on the
# greybox, on the headless harness with the engine's base alone.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_sim --features dev` shares the game's Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "testkit"]
# The test kit (`chimera_sim::testkit`): a weapon set as data, the base on the
# greybox and readers, for contract tests and games' generic tests. Turned on
# by dev-dependencies (`features = ["testkit"]`) and by `dev` (so every
# `--features dev` build, whatever it selects, uses one build of this crate),
# never in a release.
testkit = []
