[package]
name = "chimera_world"
version = "0.1.0"
description = "The engine's map: neutral map data, collision, sim-side spawning"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base and the formats, Bevy and physics; never the
# presentation (`chimera_present`), `mashup` or a game
# (checks/tests/it/architecture.rs checks it). Same versions and features as the
# game's (workspace dependencies), so `cargo test -p chimera_world` reuses
# the game's builds.
[dependencies]
chimera_core.workspace = true
source_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
half.workspace = true
wgpu-types.workspace = true
image.workspace = true
serde.workspace = true
# The converted-map cache's map side (`map::cache`): the map types'
# format (postcard, `pod_serde`'s byte strings).
postcard.workspace = true
bytemuck.workspace = true
# BC blocks decoded again when a cached map is read (`map::texture_serde`).
texpresso = "2.0"
# Surface tables of mashups (`map::sources::SurfaceTable`).
toml.workspace = true
workspace-hack.workspace = true

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_world --features dev` shares the game's Bevy build.
dev = ["chimera_core/dev"]
# What needs Bevy's render crates (`bevy_pbr`, `bevy_render`): the greybox's
# `StandardMaterial`s, the maps' blend states and view fog. `chimera_present`
# turns it on; the dedicated servers build without it (A5).
render = []

[dev-dependencies]
# Its own render feature, for its own tests.
chimera_world = { workspace = true, features = ["render"] }
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
