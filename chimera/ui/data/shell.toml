# The shell's default theme (chimera_ui::theme::Theme::shell_default):
# what screens use when the app inserts no theme, and the base every other
# theme lays over (a theme names only what differs). Our faces (UGG
# Display and Mono, chimera/ui/fonts/) and the shell overlays' present
# colours. Colours are display-space sRGB.

name = "shell"

[palette]
ink = "#000000"
ink_2 = "#0A0A0A"
ink_3 = "#141414"
ink_4 = "#1E1E1E"
fg = "#FFFFFF"
acc = "#FFB000"
on_acc = "#000000"
acc_text = "#FFC040"
hero = "#FFB000"     # the forward action's fill
on_hero = "#000000"
threat = "#FF4040"
good = "#9BE3B4"      # network good only
warn = "#FFB547"      # network warnings only

[alpha]
fg_2 = 0.66
fg_3 = 0.42
fg_4 = 0.15
fg_5 = 0.07
acc_2 = 0.16
acc_glow = 0.45
plate = 0.55
glow = 0.20

# Each game's own kill icon wherever it has one, ours only where none
# (chimera_ui::icons::choose).
[icons]
prefer_game = true

# The ping meter (chimera_ui::widgets::PingLevel).
[network]
ping_quiet_ms = 60
ping_fine_ms = 120
ping_warn_ms = 200
good_alpha = 0.7

[shape]
slant_deg = 0.0
min_text_px = 9.0

# Text roles (chimera_ui::fonts::Role): face `display`/`mono` are our own
# faces (KitFonts, loaded for every app); any other face is a family name.
# `upper`: the role upper-cases its text (the faces have lower case);
# `line`: line height in font sizes.
[type.wordmark]
face = "display"
weight = 900
tracking = 0.03
upper = true

[type.display_black]
face = "display"
weight = 900
tracking = 0.02
upper = true

[type.display_bold]
face = "display"
weight = 700
tracking = 0.02
upper = true

[type.display_regular]
face = "display"
weight = 400
tracking = 0.02
upper = true

[type.mono]
face = "mono"
weight = 400
tracking = 0.06
hinted = true
upper = true

# Sentences and typed text, in their own case: descriptions, help, dialog
# bodies, notices, names. Lines 1.3 em: the lower case's descenders reach
# 0.05 em below the faces' line box.
[type.text]
face = "display"
weight = 400
tracking = 0.01
line = 1.3

# Named easings (chimera_ui::motion::Ease::parse).
[motion.ease]
out = "bezier(.16,1,.3,1)"
in = "bezier(.7,0,.84,0)"
io = "bezier(.65,0,.35,1)"
pop = "bezier(.34,1.56,.64,1)"
roll = "back(.9)"

# Durations and offsets in seconds, by piece.
[motion.dur.pass]
total = 1.2
swap = 0.6

[motion.dur.matchend]
lines_loop = 96.0      # the planes: one spacing per loop

# The scroll container (chimera_ui::scroll), every app's: cq, seconds.
[layout.scroll]
wheel_step = 3.2       # a wheel notch, cq
ease = 0.07            # the eased scroll's time constant, s
friction = 3.2         # a fling slows by e^-friction a second
max_velocity = 220.0   # a fling's top speed, cq/s
overscroll = 3.0       # the elastic band's farthest, cq
spring = 16.0          # back from past an edge, per second
window = 0.1           # the release's speed from the last window, s
min_velocity = 1.0     # a fling stops below this, cq/s
reveal_margin = 0.6    # room kept around a row scrolled into view, cq
bar_w = 0.5            # the bar's width (the thumb's), cq
thumb_min = 2.4        # the thumb's least length, cq
gap = 0.6              # between the content and the bar, cq
