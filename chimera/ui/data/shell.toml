# The shell's default theme (chimera_ui::theme::Theme::shell_default):
# what screens use when the app inserts no theme, and the base every other
# theme lays over (a theme names only what differs). Our faces (UGG
# Display and Mono, chimera/ui/fonts/) and the shell overlays' present
# colours. Colours are display-space sRGB.

name = "shell"

[palette]
ink = "#000000"
ink_2 = "#0A0A0A"
ink_3 = "#141414"
ink_4 = "#1E1E1E"
fg = "#FFFFFF"
acc = "#FFB000"
on_acc = "#000000"
acc_text = "#FFC040"
hero = "#FFB000"     # the forward action's fill
on_hero = "#000000"
threat = "#FF4040"
good = "#9BE3B4"      # network good only
warn = "#FFB547"      # network warnings only

[alpha]
fg_2 = 0.66
fg_3 = 0.42
fg_4 = 0.15
fg_5 = 0.07
acc_2 = 0.16
acc_glow = 0.45
plate = 0.55
glow = 0.20

# Each game's own kill icon wherever it has one, ours only where none
# (chimera_ui::icons::choose).
[icons]
prefer_game = true

# The ping meter (chimera_ui::widgets::PingLevel).
[network]
ping_quiet_ms = 60
ping_fine_ms = 120
ping_warn_ms = 200
good_alpha = 0.7

[shape]
slant_deg = 0.0
min_text_px = 9.0

# Text roles (chimera_ui::fonts::Role): face `display`/`mono` are our own
# faces (KitFonts, loaded for every app); any other face is a family name.
# `upper`: the role upper-cases its text (the faces have lower case);
# `line`: line height in font sizes.
[type.wordmark]
face = "display"
weight = 900
tracking = 0.03
upper = true

[type.display_black]
face = "display"
weight = 900
tracking = 0.02
upper = true

[type.display_bold]
face = "display"
weight = 700
tracking = 0.02
upper = true

[type.display_regular]
face = "display"
weight = 400
tracking = 0.02
upper = true

[type.mono]
face = "mono"
weight = 400
tracking = 0.06
hinted = true
upper = true

# Sentences and typed text, in their own case: descriptions, help, dialog
# bodies, notices, names. Lines 1.3 em: the lower case's descenders reach
# 0.05 em below the faces' line box.
[type.text]
face = "display"
weight = 400
tracking = 0.01
line = 1.3

# Named easings (chimera_ui::motion::Ease::parse).
[motion.ease]
out = "bezier(.16,1,.3,1)"
in = "bezier(.7,0,.84,0)"
io = "bezier(.65,0,.35,1)"
pop = "bezier(.34,1.56,.64,1)"
roll = "back(.9)"

# Durations and offsets in seconds, by piece.
[motion.dur.pass]
total = 1.2
swap = 0.6

[motion.dur.matchend]
lines_loop = 96.0      # the planes: one spacing per loop

# The scroll container (chimera_ui::scroll), every app's: cq, seconds.
[layout.scroll]
wheel_step = 3.2       # a wheel notch, cq
ease = 0.07            # the eased scroll's time constant, s
friction = 3.2         # a fling slows by e^-friction a second
max_velocity = 220.0   # a fling's top speed, cq/s
overscroll = 3.0       # the elastic band's farthest, cq
spring = 16.0          # back from past an edge, per second
window = 0.1           # the release's speed from the last window, s
min_velocity = 1.0     # a fling stops below this, cq/s
reveal_margin = 0.6    # room kept around a row scrolled into view, cq
bar_w = 0.5            # the bar's width (the thumb's), cq
thumb_min = 2.4        # the thumb's least length, cq
gap = 0.6              # between the content and the bar, cq

# A settings column (chimera_ui::form), every app's, cq: every control
# in a row is `control_w` wide (the user's review, 2026-11-21), toggles
# and segmented choices `control_h` tall; the reset key's column after it.
[layout.form]
control_w = 14.0
control_h = 2.2
state_w = 2.6        # the reset key's column
badge_h = 1.15       # a badge's height
seg_pad = 0.8        # a segmented option's padding besides its words (fits or a dropdown)
blink = 1.0          # the capture chip's light: one blink, s

# The text field (chimera_ui::controls), every app's, cq: a screen's one
# hero field (`Ui::text_field_hero`: the first run's invite field) is
# taller with bigger typed text than a settings row's.
[layout.field]
hero_h = 3.2
hero_text = 0.9

# The kit's picker (chimera_ui::picker: the host's Maps and guns, the
# sandbox's Change gun and map), every app's, cq unless said. Rows (the List look):
[layout.picker]
view_h = 40.0        # the list's tallest view (sizes its pool of slots)
row_h = 1.95         # a row's height
row_gap = 0.7
row_pad_r = 0.6
pad_game = 0.6       # a row's left pad by depth: game, group, item, child
pad_group = 2.0
pad_item = 3.4
pad_child = 4.8
bg_game = 0.03       # fg alphas: a game's row, the cursor's, hover's lift
bg_focus = 0.06
hover = 0.05
focus_bar = 0.24
chev_w = 0.8
chev_h = 0.5
slop = 0.45          # a header box's hit slop around it
slop_hover = 0.14    # its hover fill (fg alpha)
name_game = 0.9
name_group = 0.8
name_item = 0.62
count = 0.52
box_w = 1.3          # the tri-state box (its lean added)
box_h = 0.75
box_line = 1.5       # its outline, px at 1080 lines
box_mixed = 55.0     # some on: the fill's share, %
# The search and the chips over the list.
bar_gap = 0.5
search_w = 19.0
chip_h = 1.5
chip_pad = 0.6
chip_size = 0.5
# Cards (the Cards look): the frame's width sets the columns.
head_h = 1.95        # a game's header line
card_min_w = 7.0
card_max_w = 10.5
card_gap = 0.45
card_aspect = 0.62   # height over width
card_pad = 0.5
card_inner_gap = 0.2
card_bg = 0.04
card_outline = 0.15
card_line = 1.0     # an idle card's outline (Fg5 alpha)
card_cursor = 1.0   # single pick: the cursor's accent outline (alpha)
card_cursor_px = 2.0  # and its inner line, px at scale 1
card_bg_at = 0.1    # the cursor's card's fill (fg alpha)
badge = 0.38        # a card's badge (its game, a family's count)
mark_w = 0.95       # a card's mark (a pinned slot's number)
mark_size = 0.42
mark_bg = 0.1
foot_h = 0.9        # a card's foot slot (PickerFrame::foot)
edge_h = 0.24       # a download's bar along a card's bottom edge
head_gap = 0.7      # a folded header's preview
side_gap = 1.3      # the list and the side pane (a detail pane)
card_icon = 0.32     # the icon's height over the card's
card_name = 0.72
card_tag = 0.46
# The dialog the host's pickers sit in.
scrim = 0.72         # ink alpha over the page
dialog_side = 26.0   # in from each side of the 100-wide frame
dialog_gap = 0.8
dialog_pad_t = 1.6
dialog_pad_b = 1.4
dialog_pad_x = 1.8
shadow_a = 0.6
shadow_y = 2.0
shadow_blur = 4.0
top_line = 0.22
title = 1.6
title_gap = 1.2
meta = 0.56
legend_gap = 0.5
legend_after = 0.8
keys_gap = 1.4
keys_inner = 0.45
keys_size = 0.54
acts_gap = 0.7
ghost_h = 2.0
cancel_h = 2.4
