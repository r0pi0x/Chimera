[package]
name = "chimera_ui"
version = "0.1.0"
description = "The UI kit: theme tokens as data, fonts by role, size units, the motion kit and UI materials"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# Bevy's UI, text and render crates and the engine's base only: no game,
# no simulation, no network (checks/tests/it/architecture.rs,
# `workspace_crates`; docs/plans/active/ugg-ui.md, 2.1). The client shell
# and the apps build their screens on it. Bevy with the clients' features
# (as `chimera_client`'s), so `cargo test -p chimera_ui` shares their build.
[dependencies]
chimera_core.workspace = true
bevy = { workspace = true, features = ["default", "wav"] }
# bevy_winit with its default feature, as the clients have it (one Bevy
# build for every selection).
bevy_winit.workspace = true
serde.workspace = true
toml.workspace = true
workspace-hack.workspace = true

# avian3d with the clients' features, for this crate's own tests only (one
# build for every selection: `selections_share_one_build`).
[dev-dependencies]
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }

# The integration tests (tests/it/): the kit on a bare Bevy app, headless.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on).
dev = ["chimera_core/dev"]
