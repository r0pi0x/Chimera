[package]
name = "chimera_movement"
version = "0.1.0"
description = "Player movement of the Quake lineage: the tick, traces, ladders, water, the physics shadow; each engine's games run it with their own config"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base and the simulation's map, Bevy and physics; never a
# loader layer, the presentation (`chimera_present`), `mashup` or a game
# (checks/tests/it/architecture.rs checks it). Its own crate, not a module
# of `chimera_sim`: an edit here rebuilds only the movement's users
# (docs/plans/active/shared-movement.md, section 4). Same versions and
# features as the game's (workspace dependencies), so `cargo test -p
# chimera_movement` reuses the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
avian3d.workspace = true
bevy.workspace = true
serde.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# The map's `render` feature, as every build with the presentation has it:
# this crate's own tests then share the workspace's build of `chimera_world`
# and of everything above it (docs/performance.md, "Iteration speed").
chimera_world = { workspace = true, features = ["render"] }
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
# bevy_winit with its default feature, as the debug UI (bevy_egui) asks for it:
# without this line a build that leaves the client shell out builds another
# bevy_winit, and with it another Bevy and every crate of ours.
bevy_winit.workspace = true
# The engine's base for the scenario tests (`SimBasePlugins`).
chimera_sim = { workspace = true, features = ["testkit"] }

# The integration tests (tests/it/): the movement's own seams on a small
# course, on the headless harness with the engine's base alone.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_movement --features dev` shares the game's Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev"]
