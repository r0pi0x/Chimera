[package]
name = "chimera_services"
version = "0.1.0"
description = "The hub's services as a library with a binary each (docs/plans/active/hub.md): the accounts service (invites, devices, tickets, revocations) on SQLite, the front (one public TLS port routing by path), the hub (discovery document, server list), systemd units; later feedback"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

[features]
dev = ["chimera_assets/dev", "chimera_formats/dev"]

# A host tool, plain data: no Bevy, no game (checks/tests/it/architecture.rs
# checks it). SQLite lives only here, so no game or client build compiles it.
[dependencies]
# Tickets, TLS (the in-process front), the asset service's helpers.
chimera_assets.workspace = true
# The A2S query packets (the hub's reachability probe).
chimera_formats.workspace = true
# The database: SQLite compiled from source (Linux and Windows MSVC alike),
# blocking like the rest of the server code.
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "backup"] }
# Device keys and the ticket key.
ed25519-dalek = "2.2"
getrandom = "0.3"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
# The loopback HTTP listeners (as the asset service's).
tiny_http = "0.12"
# The front's TLS (the asset service's certificate; ring, as chimera_assets).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The admin command line's calls to the service on loopback.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# The accounts service and the owner's command line.
[[bin]]
name = "chimera_accounts"
path = "src/bin/chimera_accounts.rs"
test = false

# The hub's one public TLS port, routing to the services on loopback.
[[bin]]
name = "chimera_front"
path = "src/bin/chimera_front.rs"
test = false

# The hub service: the discovery document, the server list, heartbeats.
[[bin]]
name = "chimera_hub"
path = "src/bin/chimera_hub.rs"
test = false

# Integration tests as one binary (tests/it/): services on port 0 with
# scratch stores.
[[test]]
name = "it"
path = "tests/it/main.rs"
