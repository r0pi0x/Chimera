# Gun Game on de_dust2 (docs/plans/active/architecture-review.md D2): every
# player for themselves up a ladder of Counter-Strike: Source's and Combat
# Arms' guns, a rung a kill; a knife death, a suicide or a fall costs a
# rung; a late joiner starts on the lowest rung; the first kill with the
# last gun wins. Each player is the game of the gun in hand
# (`identity = "weapon"`): a CS:S gun moves, looks and shows its HUD as
# CS:S, a Combat Arms gun as Combat Arms; the knife is the gun's game's
# (CS:S's with a CS:S gun, Combat Arms' M9 with a Combat Arms gun), so
# drawing it keeps the player that game's. On a CS:S map (or on Combat
# Arms' Warehouse, the pool's second map).
id = "originals:gun_game_dust2"
name = "Gun Game: {map}"   # {map}: the map actually played (the pool rotates)
description = "Climb a ladder of CS:S and Combat Arms guns; a knife death or a suicide costs a rung; the last gun's kill wins."
players = { min = 2, max = 16 }
maps = ["cs_source:de_dust2", "combat_arms:warehouse"]
teams = "free_for_all"
time_limit = "10m"
rotate = true   # after the match: the pool's next map (Dust II, Warehouse, Dust II, ...)

[slots]
hud = "combat_arms"
binds = "combat_arms"
tick = "combat_arms"
bots = "combat_arms"
movement = "combat_arms:movement"
character = "combat_arms:soldier"
identity = "weapon"
weapons = ["cs_source", "combat_arms"]

[spawn]
respawn = { delay = "2s", protection = "2s" }
points = "scored"
min_distance = 20.32   # random_hidden's (800 u); scored's own: chimera/sim/data/spawn_scoring.toml
# The knife of the rung gun's game, swapped with the gun.
kit = { cs_source = ["cs_source:weapon_knife"], combat_arms = ["combat_arms:m9_knife"] }

[rules]
module = "chimera:ladder"
# Written by hand; `ladder = "auto"` (with `rungs = 13`) would draw it on
# the power curve at each match's start (chimera_sim::minigame::power).
ladder = [
    "cs_source:weapon_glock",
    "combat_arms:beretta_m92fs",
    "cs_source:weapon_deagle",
    "combat_arms:mp5a4",
    "cs_source:weapon_p90",
    "combat_arms:remington_870",
    "cs_source:weapon_ak47",
    "combat_arms:m4a1",
    "combat_arms:m60",
    "cs_source:weapon_awp",
]
advance_on = "kill"
demote_on = "melee_death"
demote_on_suicide = true   # a suicide, a fall or `kill` costs a rung (the default)
join_rung = "lowest"       # a late joiner starts on the others' lowest rung (the default)
knife_finale = true        # the ladder ends on knife-only melee rungs (the module default: off)
melee_rungs = "auto"       # how many: "auto" (7% of the ladder, at least 1; melee_share) or a number
                           # (each draws its own knife or melee weapon of the installed games)
refill_ammo = true   # the ladder gives each gun once: 200 rounds of M60 run out
# Each Combat Arms rung's fitted parts, character and melee weapon, the
# same for everyone on it, and of the knife finale's melee rungs one
# sometimes the infected's (their hands alone, when the install has them)
# (the default; `false`, or by part: { attachments = false, character =
# false, melee = false, infected = false }; odds tuned by a table:
# { attachments = { sight = 0.4, muzzle = 0.3, max_parts = 2 } },
# { infected = { odds = 0.25 } }, the rest as Combat Arms' data:
# data/attachments/rung_odds.toml, data/rung_melee.toml).
rung_extras = true
win = { kind = "ladder_end" }
